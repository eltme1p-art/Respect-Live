<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030508">
<script>
/* يطبّق الوضع البسيط وإعدادات الزجاج قبل رسم الصفحة (لتفادي الوميض) */
window.rlGlassVars = function (g) {
  if (document.documentElement.classList.contains('lite')) return;
  var r = document.documentElement.style, n = function (v, d) { v = parseFloat(v); return isNaN(v) ? d : v; };
  g = g || {};
  r.setProperty('--g-op', (1.9 - n(g.transparency, 50) * 0.018).toFixed(3));
  r.setProperty('--g-blur', n(g.blur, 22) + 'px');
  r.setProperty('--g-sat', n(g.sat, 185) + '%');
  r.setProperty('--g-sheen-i', (n(g.sheen, 100) / 100).toFixed(2));
  r.setProperty('--g-rim-i', (n(g.rim, 100) / 100).toFixed(2));
  r.setProperty('--g-shadow-i', (n(g.shadow, 100) / 100).toFixed(2));
  r.setProperty('--g-orbs', (n(g.orbs, 55) / 100).toFixed(2));
};
(function () {
  try {
    if (localStorage.getItem('rl_ui_mode') === 'lite') document.documentElement.classList.add('lite');
    var u = JSON.parse(localStorage.getItem('rl_glass_user') || 'null');
    var s = JSON.parse(localStorage.getItem('rl_glass_site') || 'null');
    var g = (u && u.on) ? u : s;
    if (g) window.rlGlassVars(g);
  } catch (e) {}
})();
</script>
<title>Respect Live</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   RESPECT LIVE — iOS Liquid Glass
   زجاج سائل بهوية الموقع: أزرق داكن + Orbitron/Tajawal
   ═══════════════════════════════════════════════════════════ */
:root{
  --blue:#0b55ea;--blue2:#1b67ff;--blue-rgb:11,85,234;
  --bg:#030508;--bg-2:#05070d;--panel:#0a0f18;
  --text:#f4f6fa;--text-2:#c8cfdd;--muted:#8a95a8;--muted-2:#5f6a7b;
  --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --blue-line:rgba(var(--blue-rgb),.34);--blue-line-2:rgba(var(--blue-rgb),.52);
  --green:#10b981;--red:#ef4444;--gold:#f5b400;--orange:#f59e0b;--purple:#8b5cf6;
  --glow-sm:0 0 20px rgba(var(--blue-rgb),.30);
  --glow:0 0 30px rgba(var(--blue-rgb),.42);
  --font-ar:'Tajawal',system-ui,sans-serif;
  --font-en:'Orbitron',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,.61,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --r:26px;--r-sm:20px;--r-xs:14px;
  --pad:clamp(16px,5vw,28px);

  /* ── glass tokens (تتحكم بها لوحة الإدارة + إعدادات الحساب) ── */
  --g-op:1;--g-sheen-i:1;--g-rim-i:1;--g-shadow-i:1;--g-orbs:.55;
  --g-blur:22px;--g-sat:185%;
  --g-fill:rgb(255 255 255 / calc(.055 * var(--g-op)));
  --g-fill-hi:rgb(255 255 255 / calc(.09 * var(--g-op)));
  --g-sheen:linear-gradient(158deg,rgb(255 255 255 / calc(.17 * var(--g-sheen-i))) 0%,rgb(255 255 255 / calc(.045 * var(--g-sheen-i))) 30%,rgb(255 255 255 / calc(.012 * var(--g-sheen-i))) 62%,rgb(255 255 255 / calc(.07 * var(--g-sheen-i))) 100%);
  --g-rim:inset 0 1px 0 rgb(255 255 255 / calc(.30 * var(--g-rim-i))),inset 0 -1px 0 rgb(255 255 255 / calc(.05 * var(--g-rim-i))),inset 1px 0 0 rgb(255 255 255 / calc(.08 * var(--g-rim-i))),inset -1px 0 0 rgb(255 255 255 / calc(.08 * var(--g-rim-i)));
  --g-shadow:0 14px 34px rgb(0 0 0 / calc(.38 * var(--g-shadow-i))),0 2px 8px rgb(0 0 0 / calc(.28 * var(--g-shadow-i)));
  --card:linear-gradient(158deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
html{scroll-behavior:smooth;background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ar);font-size:15px;line-height:1.7;min-height:100vh;overflow-x:hidden;padding-bottom:calc(128px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background-image:linear-gradient(rgba(var(--blue-rgb),.04) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--blue-rgb),.04) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 78%)}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(circle at 10% 12%,rgba(var(--blue-rgb),.14),transparent 42%),radial-gradient(circle at 92% 70%,rgba(var(--blue-rgb),.10),transparent 46%)}
/* كرات الإضاءة خلف الزجاج — هي التي تعطي الانكسار الحقيقي */
.ambient{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--g-orbs,.55);will-change:transform}
.ambient i:nth-child(1){width:46vmax;height:46vmax;right:-14vmax;top:-12vmax;background:radial-gradient(circle,rgba(var(--blue-rgb),.75),transparent 68%);animation:orbA 22s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:38vmax;height:38vmax;left:-12vmax;top:34vh;background:radial-gradient(circle,rgba(70,120,255,.55),transparent 68%);animation:orbB 27s ease-in-out infinite alternate}
.ambient i:nth-child(3){width:30vmax;height:30vmax;right:8vmax;bottom:-12vmax;background:radial-gradient(circle,rgba(139,92,246,.40),transparent 68%);animation:orbC 31s ease-in-out infinite alternate}
@keyframes orbA{to{transform:translate3d(-8vmax,10vmax,0) scale(1.15)}}
@keyframes orbB{to{transform:translate3d(10vmax,-8vmax,0) scale(.9)}}
@keyframes orbC{to{transform:translate3d(-10vmax,-6vmax,0) scale(1.2)}}

a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
svg{width:20px;height:20px;flex-shrink:0;display:inline-block;vertical-align:middle}
::selection{background:rgba(var(--blue-rgb),.4);color:#fff}

/* ═══ أساس الزجاج المشترك ═══ */
.glass,.top,.tabbar,.seg,.hdr-btn,.btn,.ch,.feat,.stats,.live-card,.notif,.news-card,.guest-banner,.member-banner,.ad-user-card,.adm-card,.adm-tile,.adm-open,.switch-row,.kw-rule,.discord-ch-item,.user-detail-item,.tw-opt,.tgm-opt,.msg-it,.gl-group,.acct-hero,.hero-card,.q-tile,.tg-pick-item,.bot-item,.toast,.adm-bar,.login-card,.pill,.ad-tab,.theme-item,.tgv-chat,.tgv-box,.qv-code{
  background-image:var(--g-sheen);
  background-color:var(--g-fill);
  -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
  backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
  border:1px solid var(--line);
  box-shadow:var(--g-rim),var(--g-shadow);
}

/* ═══ Splash ═══ */
#splash{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(var(--blue-rgb),.26),transparent 62%),var(--bg);transition:opacity .75s var(--ease),transform .75s var(--ease)}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:26px}
.sp-logo{width:108px;height:108px;border-radius:32px;display:grid;place-items:center;color:#fff;overflow:hidden;background:linear-gradient(145deg,rgba(var(--blue-rgb),.95),rgba(var(--blue-rgb),.55));box-shadow:var(--g-rim),0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.5);animation:spGlow 2.4s ease-in-out infinite}
.sp-logo img{width:100%;height:100%;object-fit:cover}
.sp-logo svg{width:52px;height:52px}
@keyframes spGlow{0%,100%{box-shadow:var(--g-rim),0 0 0 0 rgba(var(--blue-rgb),.55),0 20px 60px rgba(var(--blue-rgb),.45)}50%{box-shadow:var(--g-rim),0 0 0 26px rgba(var(--blue-rgb),0),0 20px 60px rgba(var(--blue-rgb),.65)}}
.sp-dots{display:flex;gap:9px}
.sp-dots i{width:10px;height:10px;border-radius:50%;background:var(--blue2);animation:spBounce 1.5s ease-in-out infinite;box-shadow:0 0 12px rgba(var(--blue-rgb),.7)}
.sp-dots i:nth-child(2){animation-delay:.18s}
.sp-dots i:nth-child(3){animation-delay:.36s}
@keyframes spBounce{0%,80%,100%{transform:scale(.35);opacity:.35}40%{transform:scale(1);opacity:1}}
.sp-foot{font-family:var(--font-en);font-size:11px;letter-spacing:4px;font-weight:800;color:var(--muted);opacity:0;animation:fadeIn .8s .9s forwards}
@keyframes fadeIn{to{opacity:1}}

.page{display:none}
.page.on{display:block;animation:pageIn .45s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
#view{animation:pageIn .3s var(--ease) both}

/* ═══ الشريط العلوي ═══ */
.top{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:50;margin:10px 12px 14px;padding:9px 12px 9px 10px;border-radius:999px;display:flex;align-items:center;gap:10px;transition:box-shadow .3s var(--ease-soft),background-color .3s}
.top.scrolled{background-color:rgb(10 15 26 / calc(.55 * var(--g-op)));box-shadow:var(--g-rim),0 18px 40px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding-right:4px}
.brand-logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,var(--blue2),rgba(var(--blue-rgb),.6));display:grid;place-items:center;flex-shrink:0;box-shadow:var(--g-rim),0 0 18px rgba(var(--blue-rgb),.5);overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-logo svg{width:21px;height:21px;color:#fff}
.brand-txt{min-width:0}
.brand-name{font-family:var(--font-en);font-size:14px;font-weight:900;letter-spacing:2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name span{color:var(--blue2);text-shadow:var(--glow-sm)}
.brand-sub{font-family:var(--font-en);font-size:8.5px;font-weight:800;letter-spacing:2px;color:var(--muted);margin-top:2px}
.hdr-acts{display:flex;align-items:center;gap:7px}
.hdr-btn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:transform .3s var(--spring),border-color .22s}
.hdr-btn:hover{border-color:var(--blue-line-2)}
.hdr-btn:active{transform:scale(.88)}
.hdr-btn svg{width:19px;height:19px}
.hdr-btn:disabled{opacity:.4}
.hdr-btn .badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg);font-family:var(--font-en);line-height:1}
.hdr-login{height:42px;padding:0 16px;border-radius:999px;font-weight:900;font-size:13px;display:inline-flex;align-items:center;gap:7px;color:#fff;background:linear-gradient(160deg,rgba(var(--blue-rgb),.95),rgba(var(--blue-rgb),.6));box-shadow:var(--g-rim),0 6px 20px rgba(var(--blue-rgb),.4);transition:transform .3s var(--spring)}
.hdr-login:active{transform:scale(.93)}

/* ═══ شريط التبويب السفلي (4 أزرار + عدسة سائلة) ═══ */
.tabbar{--n:4;--i:0;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:100;width:min(92%,430px);height:74px;padding:6px;border-radius:999px;display:grid;grid-template-columns:repeat(var(--n),1fr);background-color:rgb(12 18 32 / calc(.46 * var(--g-op)));-webkit-backdrop-filter:blur(30px) saturate(200%) brightness(1.08);backdrop-filter:blur(30px) saturate(200%) brightness(1.08);box-shadow:var(--g-rim),0 22px 54px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.25)}
.tab-lens{position:absolute;top:6px;bottom:6px;inset-inline-start:6px;width:calc((100% - 12px)/var(--n));border-radius:999px;transform:translateX(calc(var(--i) * -100%));transition:transform .55s var(--spring);pointer-events:none;background:radial-gradient(120% 150% at 28% 0%,rgba(255,255,255,.30),rgba(255,255,255,.05) 55%),rgba(var(--blue-rgb),.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.20),inset 0 9px 14px rgba(255,255,255,.12),inset 0 -10px 16px rgba(var(--blue-rgb),.38),0 8px 24px rgba(var(--blue-rgb),.45)}
.tabbar button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);border-radius:999px;transition:color .3s var(--ease-soft),transform .3s var(--spring)}
.tabbar button svg{width:23px;height:23px;transition:transform .45s var(--spring),filter .3s}
.tabbar button span{font-size:10.5px;font-weight:800;line-height:1;letter-spacing:.2px}
.tabbar button:active{transform:scale(.9)}
.tabbar button.on{color:#fff}
.tabbar button.on svg{transform:translateY(-1px) scale(1.12);filter:drop-shadow(0 0 8px rgba(120,170,255,.9))}
.tabbar .tb-dot{position:absolute;top:9px;inset-inline-end:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid rgba(12,18,32,.9)}

/* ═══ Segmented (اختيار المنصة) ═══ */
.seg-wrap{padding:0 var(--pad);margin-bottom:18px;position:sticky;top:calc(76px + env(safe-area-inset-top));z-index:40}
.seg{--n:4;--i:0;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:5px;border-radius:999px;background-color:rgb(12 18 32 / calc(.5 * var(--g-op)))}
.seg-lens{position:absolute;top:5px;bottom:5px;inset-inline-start:5px;width:calc((100% - 10px)/var(--n));border-radius:999px;transform:translateX(calc(var(--i) * -100%));transition:transform .5s var(--spring),background .3s;pointer-events:none;background:radial-gradient(120% 160% at 30% 0%,rgba(255,255,255,.30),rgba(255,255,255,.04) 60%),rgba(var(--blue-rgb),.40);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 8px 12px rgba(255,255,255,.10),inset 0 -8px 12px rgba(var(--blue-rgb),.35),0 6px 20px rgba(var(--blue-rgb),.4)}
.seg button{position:relative;z-index:1;height:44px;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;color:var(--muted);font-weight:800;font-size:12.5px;transition:color .3s,transform .3s var(--spring)}
.seg button svg{width:18px;height:18px}
.seg button:active{transform:scale(.93)}
.seg button.on{color:#fff}
@media(max-width:400px){.seg button span{display:none}.seg button svg{width:21px;height:21px}}

.mnt-banner{position:fixed;top:0;left:0;right:0;z-index:2000;padding:12px 16px;background:linear-gradient(90deg,rgba(239,68,68,.92),rgba(220,38,38,.92));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--g-rim);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;gap:10px;animation:mntSlideDown .5s var(--ease)}
@keyframes mntSlideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.mnt-banner svg{width:18px;height:18px;flex-shrink:0}
.mnt-banner b{font-family:var(--font-en);letter-spacing:1px}
.mnt-banner small{opacity:.9;font-weight:600;font-size:11.5px}

/* ═══ تسجيل الدخول ═══ */
.login-page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;position:relative;animation:pageIn .6s var(--ease) both}
.login-card{position:relative;width:min(430px,100%);padding:38px 28px 30px;border-radius:38px;background-color:rgb(12 18 32 / calc(.5 * var(--g-op)));-webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);box-shadow:var(--g-rim),0 30px 80px rgba(0,0,0,.55),0 0 90px rgba(var(--blue-rgb),.16)}
.login-logo{width:92px;height:92px;border-radius:28px;margin:0 auto 20px;background:linear-gradient(145deg,var(--blue2),rgba(var(--blue-rgb),.55));display:grid;place-items:center;color:#fff;overflow:hidden;box-shadow:var(--g-rim),0 0 40px rgba(var(--blue-rgb),.5)}
.login-logo img{width:100%;height:100%;object-fit:cover}
.login-logo svg{width:46px;height:46px}
.login-head{text-align:center;margin-bottom:20px}
.login-head h1{font-family:var(--font-en);font-size:22px;letter-spacing:3px;font-weight:900;margin-bottom:8px}
.login-head h1 span{color:var(--blue2);text-shadow:var(--glow-sm)}
.login-head p{color:var(--muted);font-size:12.5px}
.auth-tabs{position:relative;display:flex;gap:0;margin-bottom:20px;padding:5px;border-radius:999px;background-color:rgba(0,0,0,.28)}
.auth-tabs button{flex:1;padding:11px;border-radius:999px;font-size:13px;font-weight:900;color:var(--muted);transition:.3s var(--ease-soft)}
.auth-tabs button.on{color:#fff;background:radial-gradient(120% 160% at 30% 0%,rgba(255,255,255,.28),rgba(255,255,255,.03) 60%),rgba(var(--blue-rgb),.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),inset 0 -8px 12px rgba(var(--blue-rgb),.3),0 6px 18px rgba(var(--blue-rgb),.4)}

/* ═══ الحقول ═══ */
.fld{display:block;margin:14px 0}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:9px;font-weight:800}
input[type="text"],input[type="password"],input[type="number"],input[type="email"],input[type="search"],input[type="url"],textarea,select{-webkit-appearance:none;appearance:none;display:block;width:100%;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);padding:14px 18px;min-height:50px;border-radius:18px;background:rgba(0,0,0,.30);border:1px solid var(--line);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.07);transition:border-color .25s,box-shadow .25s,background .25s}
input::placeholder,textarea::placeholder{color:var(--muted-2);font-weight:500}
input:hover,textarea:hover,select:hover{border-color:var(--line-2)}
input:focus,textarea:focus,select:focus{border-color:var(--blue2);background:rgba(4,8,18,.6);box-shadow:inset 0 2px 6px rgba(0,0,0,.4),0 0 0 4px rgba(var(--blue-rgb),.20),0 0 24px rgba(var(--blue-rgb),.22)}
textarea{resize:vertical;min-height:110px;line-height:1.7;border-radius:20px}
textarea.mono{font-family:monospace;font-size:13px;direction:ltr;text-align:left}
select{cursor:pointer}
select option{background:var(--panel);color:var(--text)}
input[type="checkbox"]{-webkit-appearance:checkbox;appearance:checkbox;width:20px;height:20px;min-height:auto;padding:0;accent-color:var(--blue);cursor:pointer;display:inline-block;vertical-align:middle;box-shadow:none}
.err{color:#f87171;font-size:12.5px;text-align:center;min-height:20px;margin-top:12px;font-weight:700}

/* ═══ الأزرار ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;min-height:44px;border-radius:999px;color:var(--text);font-size:13.5px;font-weight:800;transition:transform .35s var(--spring),border-color .22s,box-shadow .3s,background-color .3s;position:relative}
.btn:hover{border-color:var(--blue-line-2)}
.btn:active{transform:scale(.94)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important}
.btn.pri{color:#fff;border-color:rgba(255,255,255,.22);background-image:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.06) 46%,rgba(255,255,255,0) 100%),linear-gradient(160deg,rgba(var(--blue-rgb),.95),rgba(var(--blue-rgb),.62));box-shadow:var(--g-rim),0 10px 28px rgba(var(--blue-rgb),.42)}
.btn.pri:hover{box-shadow:var(--g-rim),0 14px 38px rgba(var(--blue-rgb),.6)}
.btn.danger{color:#fff;border-color:rgba(255,255,255,.2);background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 60%),linear-gradient(160deg,rgba(239,68,68,.92),rgba(190,30,30,.6));box-shadow:var(--g-rim),0 10px 26px rgba(239,68,68,.32)}
.btn.ghost{background-color:transparent;background-image:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--line-2)}
.btn.ghost:hover{background-color:rgba(255,255,255,.05)}
.btn.ghost.danger{color:#ff7b7b;background-image:none;background-color:rgba(239,68,68,.08);border-color:rgba(239,68,68,.34);box-shadow:none}

/* ═══ الرئيسية ═══ */

.q-tile .ib{margin:0 auto 10px}
.q-tile b{display:block;font-family:var(--font-en);font-size:24px;font-weight:900;line-height:1}
.q-tile small{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:6px}

/* أيقونة داخل حاوية زجاجية ملوّنة */
.ib{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;color:var(--blue2);background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 62%);background-color:rgba(var(--blue-rgb),.16);border:1px solid rgba(var(--blue-rgb),.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px rgba(0,0,0,.25)}
.ib svg{width:23px;height:23px}
.ib.kick{color:#53fc18;background-color:rgba(83,252,24,.12);border-color:rgba(83,252,24,.32)}
.ib.yt{color:#ff4d4d;background-color:rgba(255,0,0,.12);border-color:rgba(255,60,60,.34)}
.ib.tw{color:#fff;background-color:rgba(255,255,255,.10);border-color:rgba(255,255,255,.26)}
.ib.tg{color:#3db8ff;background-color:rgba(0,136,204,.16);border-color:rgba(0,160,235,.36)}
.ib.dc{color:#8b95ff;background-color:rgba(88,101,242,.16);border-color:rgba(110,122,255,.36)}
.ib.green{color:var(--green);background-color:rgba(16,185,129,.14);border-color:rgba(16,185,129,.34)}
.ib.orange{color:var(--orange);background-color:rgba(245,158,11,.14);border-color:rgba(245,158,11,.34)}
.ib.red{color:#ff6b6b;background-color:rgba(239,68,68,.14);border-color:rgba(239,68,68,.34)}

.ib.sm{width:38px;height:38px;border-radius:13px}.ib.sm svg{width:19px;height:19px}
.ib.lg{width:58px;height:58px;border-radius:20px}.ib.lg svg{width:29px;height:29px}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px var(--pad);animation:pageIn .6s var(--ease) .12s both}
@media(max-width:640px){.features{grid-template-columns:1fr}}
.feat{border-radius:26px;padding:20px 18px;text-align:center;transition:transform .35s var(--spring),border-color .25s;position:relative;overflow:hidden}
.feat:hover{transform:translateY(-3px);border-color:var(--blue-line-2)}
.feat-ico{margin:0 auto 14px}
.feat b{display:block;font-size:15px;font-weight:900;margin-bottom:6px}
.feat p{color:var(--muted);font-size:12.5px;line-height:1.7}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:26px;overflow:hidden;margin:20px var(--pad);animation:pageIn .6s var(--ease) .15s both}
.stats .s{padding:18px 8px;text-align:center;border-inline-start:1px solid var(--line)}

@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stats .s:nth-child(3){border-inline-start:0}.stats .s:nth-child(n+3){border-top:1px solid var(--line)}}

.live-strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * var(--pad));padding:4px var(--pad) 12px}
.live-strip::-webkit-scrollbar{display:none}
.live-card{flex:0 0 262px;border-radius:26px;overflow:hidden;cursor:pointer;transition:transform .35s var(--spring),border-color .25s;position:relative;scroll-snap-align:start}
.live-card:hover{border-color:var(--blue-line-2)}

.live-card-cover{height:122px;background:linear-gradient(135deg,rgba(var(--blue-rgb),.4),rgba(0,0,0,.5));position:relative;overflow:hidden}
.live-card-cover img{width:100%;height:100%;object-fit:cover}
.live-card-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(3,5,8,.9))}
.live-card-body{padding:0 16px 15px;margin-top:-22px;position:relative;z-index:2}

.sec{padding:20px var(--pad);animation:pageIn .45s var(--ease) both}

.sec-title{font-size:25px;font-weight:900;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.sec-title span{color:var(--blue2);transform:skewX(-8deg);display:inline-block;text-shadow:var(--glow-sm)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}

/* ═══ بطاقات القنوات ═══ */
.ch{position:relative;overflow:hidden;border-radius:var(--r);transition:transform .38s var(--spring),border-color .3s,box-shadow .3s;isolation:isolate}
.ch::after{content:"";position:absolute;inset:-40px;background-image:var(--ch-brand,none);background-size:cover;background-position:center;filter:blur(50px) saturate(1.9);opacity:.22;pointer-events:none;z-index:0;border-radius:inherit}
.ch:hover{transform:translateY(-3px);border-color:var(--blue-line-2);box-shadow:var(--g-rim),0 20px 48px rgba(var(--blue-rgb),.22)}
.ch>.ch-cover,.ch>.ch-head,.ch>.ch-acts{position:relative;z-index:1}
.ch-cover{height:120px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(var(--blue-rgb),.32),rgba(0,0,0,.5));border-radius:var(--r) var(--r) 0 0}
.ch-cover img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease-soft)}
.ch:hover .ch-cover img{transform:scale(1.06)}
.ch-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(3,5,8,.9))}
.ch-badge{position:absolute;top:12px;right:12px;z-index:3;font-size:10.5px;padding:5px 12px;border-radius:999px;font-weight:900;letter-spacing:.3px;display:inline-flex;align-items:center;gap:5px;-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.ch-badge svg{width:13px;height:13px}
.ch-badge.live{background:rgba(239,68,68,.85);color:#fff;animation:chPulse 1.9s infinite}
.ch-badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.ch-badge.off{background:rgba(255,255,255,.18);color:var(--text)}
.ch-badge.nosend{background:rgba(245,158,11,.88);color:#fff;top:auto;bottom:12px;right:12px}
.ch-badge.verified{background:rgba(16,185,129,.9);color:#fff;top:12px;left:12px;right:auto}
@keyframes chPulse{70%{box-shadow:0 0 0 12px rgba(239,68,68,0),inset 0 1px 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0),inset 0 1px 0 rgba(255,255,255,.35)}}
.ch-head{display:flex;align-items:flex-end;gap:12px;padding:0 18px;margin-top:-28px;position:relative;z-index:2}
.ch-head img{width:58px;height:58px;border-radius:19px;object-fit:cover;border:2px solid rgba(255,255,255,.35);background:var(--panel);flex-shrink:0;box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 18px rgba(var(--blue-rgb),.35)}
.ch-head .ph{width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,var(--blue2),rgba(var(--blue-rgb),.55));display:grid;place-items:center;border:2px solid rgba(255,255,255,.35);flex-shrink:0;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.ch-head .ph svg{width:26px;height:26px}
.ch-info{flex:1;min-width:0;padding-bottom:2px}
.ch-info b{display:block;font-size:15.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ch-info small{display:inline-block;font-size:10.5px;color:var(--text-2);font-family:var(--font-en);letter-spacing:1px;border:1px solid var(--line-2);background:rgba(255,255,255,.06);border-radius:999px;padding:3px 12px;margin-top:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-live{margin:12px 18px 0;padding:11px 15px;border-radius:18px;background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);font-size:12.5px;display:flex;justify-content:space-between;gap:10px;font-weight:700;align-items:center}
.ch-live div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-live span{color:#ff8a8a;white-space:nowrap;font-family:var(--font-en);font-weight:900;font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.ch-live span svg{width:14px;height:14px}
.ch-acts{display:flex;gap:7px;flex-wrap:wrap;padding:14px 18px 18px}

.empty{text-align:center;padding:56px 24px;animation:pageIn .55s var(--ease) both}
.empty .em-icon{width:96px;height:96px;margin:0 auto 20px;display:grid;place-items:center;border-radius:32px;color:var(--blue2);background-image:var(--g-sheen);background-color:var(--g-fill);border:1px solid var(--line);box-shadow:var(--g-rim),0 0 40px rgba(var(--blue-rgb),.25);animation:emptyFloat 4s ease-in-out infinite}
.empty .em-icon svg{width:44px;height:44px}
@keyframes emptyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty h3{font-size:17px;font-weight:900;color:var(--text);margin-bottom:8px}
.empty p{font-size:13px;color:var(--muted);margin-bottom:20px;max-width:320px;margin-left:auto;margin-right:auto}

/* ═══ لافتات ═══ */
.guest-banner{margin:6px var(--pad) 16px;padding:14px 18px;border-radius:28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:pageIn .5s var(--ease) both;background-color:rgba(var(--blue-rgb),.10)}
.guest-banner .gb-txt{flex:1;min-width:160px;font-size:13.5px;font-weight:800;color:var(--text);line-height:1.6}
.guest-banner .gb-txt small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:3px}
.member-banner{margin:6px var(--pad) 16px;padding:14px 18px;border-radius:28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:pageIn .5s var(--ease) both}
.member-banner.ok{background-color:rgba(16,185,129,.10);border-color:rgba(16,185,129,.38)}
.member-banner.warn{background-color:rgba(245,158,11,.10);border-color:rgba(245,158,11,.38)}
.member-banner .mb-txt{flex:1;min-width:200px;font-size:13.5px;font-weight:800;line-height:1.65}
.member-banner .mb-txt small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:4px}

/* ═══ النوافذ المنبثقة (Sheets) ═══ */
.modal{position:fixed;inset:0;z-index:1200;background:rgba(2,4,10,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;padding-top:46px;opacity:0;pointer-events:none;transition:opacity .32s var(--ease-soft)}
.modal.on{opacity:1;pointer-events:auto}
.sheet{position:relative;width:min(680px,100%);max-height:92vh;overflow-y:auto;border-radius:38px 38px 0 0;padding:14px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(80px) scale(.98);transition:transform .55s var(--spring);background-color:rgb(14 20 34 / calc(.62 * var(--g-op)));background-image:var(--g-sheen);-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%);border:1px solid var(--line-2);border-bottom:0;box-shadow:var(--g-rim),0 -20px 70px rgba(0,0,0,.55),0 0 80px rgba(var(--blue-rgb),.12)}
.modal.on .sheet{transform:translateY(0) scale(1)}
.sheet.sm{width:min(460px,100%)}
.sheet.wide{width:min(820px,100%)}
.sheet.xwide{width:min(980px,100%)}
.grab{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.3);margin:0 auto 16px}
@media(min-width:701px){.modal{align-items:center}.sheet{border-radius:36px;border-bottom:1px solid var(--line-2)}}
.sh-top{position:sticky;top:-14px;z-index:6;display:flex;justify-content:flex-start;padding:4px 0 12px;margin:-4px 0 6px}
.sh-top .btn{min-width:92px}
.sh-title{font-family:var(--font-ar);font-size:19px;font-weight:900;margin-bottom:8px}
.sh-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;line-height:1.75}
.row{display:flex;gap:10px;margin-top:20px}
.row>.btn{flex:1}

.toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:9000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:100%;padding:0 16px}
.toast{max-width:min(440px,100%);padding:13px 20px;border-radius:999px;font-size:13px;font-weight:800;background-color:rgb(14 20 34 / calc(.62 * var(--g-op)));-webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);box-shadow:var(--g-rim),0 18px 46px rgba(0,0,0,.5),0 0 30px rgba(var(--blue-rgb),.18);opacity:0;transform:translateY(-18px) scale(.94);transition:.5s var(--spring);display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.toast svg{flex-shrink:0;color:var(--blue2)}
.toast.ok svg{color:var(--green)}
.toast.bad svg{color:var(--red)}
.toast.on{opacity:1;transform:translateY(0) scale(1)}

/* ═══ الإشعارات والأخبار ═══ */
.notif{display:flex;gap:14px;padding:16px;border-radius:26px;margin:12px 0;transition:transform .3s var(--spring),border-color .22s;cursor:pointer}
.notif:hover{border-color:var(--blue-line-2)}
.notif:active{transform:scale(.98)}
.notif.un{background-color:rgba(var(--blue-rgb),.12);border-color:var(--blue-line)}
.notif img{width:54px;height:54px;border-radius:18px;object-fit:cover;flex-shrink:0;background:var(--panel);border:1px solid var(--line-2)}
.notif .nt-b{flex:1;min-width:0}
.notif b{display:block;font-size:14px;font-weight:900;margin-bottom:4px}
.notif p{font-size:12.5px;color:var(--muted);white-space:pre-wrap;line-height:1.7;margin-top:3px}
.notif .nt-t{font-size:11px;color:var(--muted-2);font-family:var(--font-en);letter-spacing:1px;margin-top:8px}
.news-card{padding:18px;border-radius:26px;margin-bottom:12px;position:relative;transition:.25s var(--ease-soft)}
.news-card:hover{border-color:var(--blue-line-2)}
.news-card.unread{background-color:rgba(var(--blue-rgb),.12);border-color:var(--blue-line)}
.news-card.kind-update{border-right:3px solid var(--blue2)}
.news-card.kind-maintenance{border-right:3px solid var(--orange)}
.news-card.kind-warning{border-right:3px solid var(--red)}
.news-card.kind-news{border-right:3px solid var(--green)}
.news-card h4{font-size:16px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.news-card .nc-body{font-size:13.5px;line-height:1.8;color:var(--text-2);white-space:pre-wrap}
.news-card .nc-img{max-height:200px;width:100%;border-radius:20px;margin:12px 0;object-fit:cover;border:1px solid var(--line-2)}
.news-card .nc-time{font-size:11px;color:var(--muted-2);font-family:var(--font-en);margin-top:10px;letter-spacing:1px}
.news-card .nc-kind{font-family:var(--font-en);font-size:10px;letter-spacing:1.2px;padding:3px 11px;border-radius:999px;font-weight:900}
.kind-update .nc-kind{background:rgba(var(--blue-rgb),.2);color:#7fa8ff}
.kind-maintenance .nc-kind{background:rgba(245,158,11,.18);color:var(--orange)}
.kind-warning .nc-kind{background:rgba(239,68,68,.18);color:#ff7b7b}
.kind-news .nc-kind{background:rgba(16,185,129,.18);color:var(--green)}

/* ═══ صفحة الحساب + القوائم المجمّعة بنمط iOS ═══ */
.acct-hero{position:relative;margin:4px var(--pad) 16px;padding:26px 20px 22px;border-radius:38px;text-align:center;overflow:hidden;animation:pageIn .5s var(--ease) both}
.acct-hero::before{content:"";position:absolute;inset:-40px;background-image:var(--av-bg,none);background-size:cover;background-position:center;filter:blur(46px) saturate(1.9);opacity:.35;pointer-events:none}
.acct-hero>*{position:relative}

.acct-user{direction:ltr;unicode-bidi:isolate;font-family:var(--font-en);font-size:11.5px;letter-spacing:1.5px;color:var(--muted);margin-top:3px}
.acct-pills{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.gl-title{margin:22px var(--pad) 9px;font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.gl-group{margin:0 var(--pad);border-radius:30px;overflow:hidden;animation:pageIn .5s var(--ease) both}

.gl-row:first-child{border-top:0}

/* ═══ الإدارة ═══ */

.ad-tab{flex-shrink:0;padding:9px 16px;border-radius:999px;color:var(--muted);font-size:12.5px;font-weight:800;transition:.3s var(--spring);display:inline-flex;align-items:center;gap:6px}

.ad-tab.on{color:#fff;background-color:rgba(var(--blue-rgb),.5);border-color:rgba(255,255,255,.22);box-shadow:var(--g-rim),0 6px 18px rgba(var(--blue-rgb),.4)}
.ad-user-card{padding:16px 18px;border-radius:26px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px;transition:.25s var(--ease-soft)}

.ad-user-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.ad-user-head .av img{width:100%;height:100%;object-fit:cover}
.ad-user-head .if{flex:1;min-width:0}
.ad-user-head b{display:block;font-size:14.5px;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ad-user-head b svg{width:14px;height:14px}
.ad-user-head b:hover{color:var(--blue2)}
.ad-user-head small{font-size:11.5px;color:var(--muted);font-family:var(--font-en);letter-spacing:.5px;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-user-acts{display:flex;gap:7px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;background-color:rgba(var(--blue-rgb),.16);border-color:var(--blue-line);color:#8db1ff;font-family:var(--font-en);font-size:11px;font-weight:900;letter-spacing:.5px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pill svg{width:14px;height:14px}
.pill.ok{background-color:rgba(16,185,129,.14);border-color:rgba(16,185,129,.36);color:var(--green)}
.pill.bad{background-color:rgba(239,68,68,.14);border-color:rgba(239,68,68,.36);color:#ff7b7b}
.pill.warn{background-color:rgba(245,158,11,.14);border-color:rgba(245,158,11,.36);color:var(--orange)}
.pill.purple{background-color:rgba(139,92,246,.14);border-color:rgba(139,92,246,.36);color:#b49bff}
.pill.off{background-color:rgba(124,135,153,.12);border-color:rgba(124,135,153,.28);color:var(--muted)}
.mu{color:var(--muted)}
.center{text-align:center}
.limit-bar{height:7px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.limit-bar b{display:block;height:100%;border-radius:inherit;background:linear-gradient(270deg,var(--blue2),rgba(var(--blue-rgb),.7));box-shadow:0 0 12px rgba(var(--blue-rgb),.7);transition:width .6s var(--ease-soft)}
.limit-bar.warn b{background:linear-gradient(270deg,var(--orange),var(--gold))}
.limit-bar.full b{background:linear-gradient(270deg,var(--red),#dc2626)}
.img-preview-box{border:1.5px dashed var(--line-2);border-radius:20px;padding:14px;text-align:center;margin-top:8px;transition:.25s var(--ease-soft);background:rgba(0,0,0,.18)}
.img-preview-box img{max-height:160px;margin:0 auto 10px;border-radius:14px;border:1px solid var(--line);object-fit:contain}
.img-preview-box.empty{padding:26px 14px;color:var(--muted-2);font-size:12.5px}
.tpl-preview{margin-top:10px;padding:14px;border-radius:18px;background:rgba(0,0,0,.3);border:1px solid var(--line);box-shadow:inset 0 2px 6px rgba(0,0,0,.4);font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--text-2);min-height:60px;max-height:280px;overflow-y:auto}

.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.theme-item{border-radius:20px;padding:14px 8px;text-align:center;cursor:pointer;transition:.3s var(--spring);font-weight:900;font-size:12px;color:#fff;min-height:80px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.theme-item:hover{transform:translateY(-2px)}
.theme-item.on{border-color:var(--blue2);box-shadow:var(--g-rim),0 0 0 3px rgba(var(--blue-rgb),.3),0 8px 22px rgba(var(--blue-rgb),.35)}
.theme-item i{display:block;width:26px;height:6px;border-radius:9px;margin:0 auto}
.discord-ch-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;margin-bottom:6px}
.discord-ch-item .ic{width:36px;height:36px;border-radius:12px;background:rgba(var(--blue-rgb),.16);border:1px solid var(--blue-line);display:grid;place-items:center;color:#8db1ff;flex-shrink:0}
.discord-ch-item .ic svg{width:18px;height:18px}
.discord-ch-item .if{flex:1;min-width:0}
.discord-ch-item b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.discord-ch-item small{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--font-en)}
.tg-pick-grid,.bot-list{max-height:240px;overflow-y:auto;display:grid;gap:6px;margin-top:8px;padding:8px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}

.tg-pick-item:hover,.bot-item:hover{background-color:rgba(var(--blue-rgb),.12)}
.tg-pick-item.on{background-color:rgba(var(--blue-rgb),.2);border-color:var(--blue-line-2)}
.tg-pick-item .av{width:32px;height:32px;border-radius:11px;background:rgba(var(--blue-rgb),.18);border:1px solid var(--blue-line);display:grid;place-items:center;color:#8db1ff;flex-shrink:0;overflow:hidden;font-size:11px;font-weight:900;font-family:var(--font-en)}
.tg-pick-item .av img{width:100%;height:100%;object-fit:cover}
.tg-pick-item .if,.bot-item .if{flex:1;min-width:0}
.tg-pick-item b,.bot-item b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-pick-item small,.bot-item small{display:block;font-size:10.5px;color:var(--muted);font-family:var(--font-en);margin-top:1px}
.tg-pick-item .ck{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:.3s var(--spring)}
.tg-pick-item.on .ck{background:var(--blue2);border-color:var(--blue2);color:#fff;transform:scale(1.08)}
.tg-pick-item .ck svg{width:12px;height:12px}
.bot-item.on{background-color:rgba(239,68,68,.14);border-color:rgba(239,68,68,.36)}
.bot-item .av{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#5865f2,#4752c4);display:grid;place-items:center;color:#fff;flex-shrink:0;overflow:hidden;font-size:13px;font-weight:900}
.bot-item .av img{width:100%;height:100%;object-fit:cover}
.bot-item .st{font-size:10.5px;padding:3px 10px;border-radius:999px;font-weight:900;flex-shrink:0}
.bot-item.on .st{background:rgba(239,68,68,.22);color:#ff7b7b}
.bot-item:not(.on) .st{background:rgba(255,255,255,.06);color:var(--muted)}

/* مفتاح التبديل — iOS */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:22px;margin:10px 0}
.switch-row .sw-txt{flex:1;min-width:0}
.switch-row b{display:block;font-size:13.5px;font-weight:900;margin-bottom:3px}
.switch-row small{color:var(--muted);font-size:11.5px;line-height:1.5;display:block}
.sw{position:relative;width:54px;height:32px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 5px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.1);transition:background .3s,box-shadow .3s;cursor:pointer}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#fff,#d7e0f2);transition:transform .45s var(--spring),width .25s;box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 -2px 3px rgba(0,0,0,.12)}
.sw:active i::after{width:31px}
.sw input:checked+i{background:linear-gradient(160deg,rgba(var(--blue-rgb),.95),rgba(var(--blue-rgb),.65));box-shadow:inset 0 2px 5px rgba(0,0,0,.3),0 0 18px rgba(var(--blue-rgb),.45)}
.sw input:checked+i::after{transform:translateX(-22px)}
.sw:active input:checked+i::after{transform:translateX(-17px)}

.kw-rule{padding:14px;border-radius:22px;margin-bottom:10px}
.kw-rule-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kw-rule-head b{font-size:13px;font-weight:900}
.kw-rule-body{display:grid;gap:10px}
.kw-tags{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:18px;min-height:46px;align-items:center;box-shadow:inset 0 2px 5px rgba(0,0,0,.4)}
.kw-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(var(--blue-rgb),.2);border:1px solid var(--blue-line);color:#8db1ff;font-size:11.5px;font-weight:800}
.kw-tag button{background:transparent;border:none;color:#8db1ff;cursor:pointer;padding:0 2px;font-weight:900;line-height:1}
.kw-tag-input{display:flex;gap:6px;margin-top:6px}
.kw-tag-input input{flex:1;font-size:12.5px;min-height:42px;padding:8px 14px}
.kw-img-row{display:flex;gap:8px;align-items:center}
.kw-img-prev{width:60px;height:60px;border-radius:18px;border:1px solid var(--line-2);background:rgba(0,0,0,.3);overflow:hidden;flex-shrink:0;display:grid;place-items:center;color:var(--muted-2);font-size:10px}
.kw-img-prev img{width:100%;height:100%;object-fit:cover}
.kw-img-row input[type=text]{flex:1}
.ai-status{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:20px;font-size:12.5px;font-weight:800;margin-bottom:12px}
.ai-status svg{width:18px;height:18px;flex-shrink:0}
.ai-status.ok{background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.34);color:var(--green)}
.ai-status.bad{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.34);color:#ff7b7b}
.ai-status.warn{background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.34);color:var(--orange)}

/* ═══ توثيق تيليجرام ═══ */
.tgv-box{padding:18px;border:1.5px dashed var(--blue-line);border-radius:26px;margin:14px 0}

.tgv-chat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:24px;margin:14px 0}
.tgv-chat .av{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,var(--blue2),rgba(var(--blue-rgb),.55));display:grid;place-items:center;color:#fff;flex-shrink:0;overflow:hidden;font-family:var(--font-en);font-weight:900;font-size:18px;border:1px solid rgba(255,255,255,.3)}

.tgv-chat .if{flex:1;min-width:0}

.tgv-chat small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.tgv-code{display:flex;gap:8px;margin:14px 0;direction:ltr}
.tgv-code input{font-family:var(--font-en);font-size:24px;font-weight:900;letter-spacing:8px;text-align:center;padding:16px;border-radius:22px;border:2px solid var(--blue-line)}
.tgv-timer{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-en);font-weight:900;color:#8db1ff;font-size:13px;margin:10px 0}
.tgv-spinner{width:22px;height:22px;border:2.5px solid rgba(var(--blue-rgb),.25);border-top-color:var(--blue2);border-radius:50%;animation:spin 1s linear infinite;display:inline-block}

.tgm-opt{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:22px;margin-bottom:8px;cursor:pointer}

.tgm-opt b{display:block;font-size:13.5px}
.tgm-opt small{color:var(--muted);font-size:11.5px;line-height:1.6;display:block;margin-top:3px}
.callout{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:24px;margin:0 0 14px;font-size:12.5px;line-height:1.75;border:1px solid var(--blue-line);background-color:rgba(var(--blue-rgb),.10)}

.callout.green{border-color:rgba(16,185,129,.36);background-color:rgba(16,185,129,.09)}.callout.green>svg{color:var(--green)}
.callout.orange{border-color:rgba(245,158,11,.38);background-color:rgba(245,158,11,.09)}.callout.orange>svg{color:var(--orange)}
.callout.red{border-color:rgba(239,68,68,.38);background-color:rgba(239,68,68,.09)}.callout.red>svg{color:#ff7b7b}

.user-detail-grid{display:grid;gap:10px;margin-top:12px}

.user-detail-item .ic.dc{background:rgba(88,101,242,.16);color:#8b95ff}

.user-detail-item b{display:block;font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-detail-item small{display:block;font-size:11px;color:var(--muted);font-family:var(--font-en);margin-top:2px}
.user-detail-item .st{font-size:10.5px;padding:3px 10px;border-radius:999px;font-weight:900;font-family:var(--font-en)}
.user-detail-item .st.on{background:rgba(16,185,129,.18);color:var(--green)}
.user-detail-item .st.off{background:rgba(124,135,153,.16);color:var(--muted)}
.user-detail-item .st.live{background:rgba(239,68,68,.18);color:#ff7b7b}

.msg-log{display:flex;flex-direction:column;gap:10px}
.msg-it{display:flex;gap:12px;padding:12px;border-radius:22px}
.msg-it img{width:58px;height:58px;border-radius:16px;object-fit:cover;flex-shrink:0}
.msg-it .mb{flex:1;min-width:0}
.msg-it .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:11.5px;color:var(--muted)}
.msg-it p{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin:0}
.msg-it a{color:#8db1ff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px;margin-top:6px}

.src-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(var(--blue-rgb),.16);color:#8db1ff}

.src-pill.kick{background:rgba(83,252,24,.14);color:#53fc18}.src-pill.yt{background:rgba(255,0,0,.14);color:#ff6b6b}
.src-pill.tw{background:rgba(255,255,255,.12);color:#fff}.src-pill.dc{background:rgba(88,101,242,.2);color:#8b95ff}

.adm-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.adm-tile{border-radius:22px;padding:13px 6px;text-align:center}
.adm-tile b{display:block;font-family:var(--font-en);font-size:20px;font-weight:900}
.adm-tile small{display:block;color:var(--muted);font-size:10.5px;margin-top:4px;font-weight:800}
.adm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.adm-grid{grid-template-columns:repeat(3,1fr)}}
.adm-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:right;min-height:118px;padding:16px;border-radius:28px;color:var(--text);transition:transform .35s var(--spring),border-color .25s}
.adm-card:active{transform:scale(.95);border-color:var(--blue2)}
.adm-card .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background-color:rgba(var(--blue-rgb),.18);background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 62%);color:#8db1ff;border:1px solid var(--blue-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.adm-card b{font-size:14.5px;font-weight:900}.adm-card small{color:var(--muted);font-size:11.5px;line-height:1.5}
.adm-card .bd{position:absolute;top:12px;left:12px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;font-family:var(--font-en)}
.adm-open{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:28px;background-color:rgba(139,92,246,.12);border-color:rgba(139,92,246,.4);color:var(--text);font-weight:900;font-size:14px;text-align:right;transition:transform .3s var(--spring)}
.adm-open:active{transform:scale(.97)}
.adm-open small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;margin-top:2px}
.adm-open .ic{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:rgba(139,92,246,.24);color:#b49bff}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* بديل للمتصفحات التي لا تدعم backdrop-filter */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .top,.tabbar,.seg,.sheet,.toast,.login-card,.adm-bar{background-color:rgba(12,18,32,.94)}
}

/* ═══ إضافات ═══ */
#app{padding-top:env(safe-area-inset-top)}
.tabbar.none .tab-lens{opacity:0}
.hico{display:inline-flex;vertical-align:middle;margin-inline-end:8px;color:#8db1ff}
.hico svg{width:18px;height:18px}
.tg-pick-item b svg{width:14px;height:14px;color:var(--gold);margin-inline-start:4px}
.fld small svg,.callout svg+svg{width:13px;height:13px}
.fld small svg{margin-inline-end:4px;color:var(--orange)}
.lock-cover{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(5,8,16,.25)}
.lock-cover h3{font-size:15px;font-weight:900}
.lc-icon{display:grid;place-items:center;border-radius:18px;color:#fff;background-image:var(--g-sheen);background-color:rgba(var(--blue-rgb),.3);border:1px solid var(--line-2);box-shadow:var(--g-rim)}
.msg-it a{direction:rtl}

/* ═══ لون القناة بدل الصورة المكبّرة ═══ */
.ch-cover.solid,.live-card-cover.solid{background:var(--cv,linear-gradient(135deg,rgba(var(--blue-rgb),.32),rgba(0,0,0,.5)));transition:background-color .35s var(--ease-soft)}

/* ═══ منزلقات الزجاج ═══ */
.gs{padding:11px 0 6px}
.gs-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;margin-bottom:4px}
.gs-h b{font-family:var(--font-en);font-size:11.5px;color:#8db1ff}
.gl-presets{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
input[type="range"]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;padding:0;min-height:0;border:0;background:transparent;box-shadow:none;direction:ltr;cursor:pointer}
input[type="range"]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--blue2) var(--p,50%),rgba(255,255,255,.16) var(--p,50%))}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:linear-gradient(180deg,#fff,#d7e0f2);box-shadow:0 3px 9px rgba(0,0,0,.5)}
input[type="range"]::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.16)}
input[type="range"]::-moz-range-progress{height:6px;border-radius:99px;background:var(--blue2)}
input[type="range"]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 9px rgba(0,0,0,.5)}

/* ═══ اختيار شكل الموقع (مرة واحدة) ═══ */
#uiPick{position:fixed;inset:0;z-index:9600;display:grid;place-items:center;padding:20px;background:rgba(3,5,8,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fadeIn .35s both;transition:opacity .3s}
#uiPick.out{opacity:0;pointer-events:none}
.up-card{width:min(480px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.up-h{text-align:center;margin-bottom:6px}
.up-h .ib{margin:0 auto 12px}
.up-h h2{font-size:20px;font-weight:900;margin-bottom:6px}
.up-h p{color:var(--muted);font-size:12.5px;line-height:1.8}
.up-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:16px;border-radius:26px;background:rgb(14 20 34 / .9);border:1.5px solid var(--line-2);transition:transform .3s var(--spring),border-color .25s}
.up-opt:active{transform:scale(.97)}
.up-opt.rec{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(var(--blue-rgb),.18)}
.up-opt .tx{flex:1;min-width:0}
.up-opt b{display:block;font-size:15px;font-weight:900}
.up-opt small{display:block;color:var(--muted);font-size:12px;line-height:1.7;margin-top:3px}
.up-pv{width:62px;height:62px;border-radius:18px;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(145deg,#0b55ea,#071a4a)}
.up-pv i{position:absolute;left:9px;right:9px;height:11px;border-radius:99px;background:rgba(255,255,255,.55)}
.up-pv i:nth-child(1){top:11px}.up-pv i:nth-child(2){top:28px;right:20px}.up-pv i:nth-child(3){top:45px;right:30px}
.up-pv.full{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px rgba(var(--blue-rgb),.5)}
.up-pv.full i{background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.up-pv.lite{background:#161e2e}.up-pv.lite i{background:#3b4a66}

/* ═══ انميشن الدخول ═══ */
#introFx{position:fixed;inset:0;z-index:9500;background:var(--bg);transition:opacity .5s var(--ease-soft)}
#introFx.out{opacity:0;pointer-events:none}
#introFx iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
#introFx .skip{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-start:14px;z-index:2;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}

/* ═══ الوضع البسيط (Lite): بدون زجاج ولا تأثيرات ثقيلة ═══ */
html.lite{--g-fill:#0f1624;--g-fill-hi:#151e30;--g-sheen:none;--g-rim:0 0 0 0 transparent;--g-shadow:0 1px 3px rgba(0,0,0,.3);--g-blur:0px;--g-sat:100%;--g-op:8;--g-orbs:0}
html.lite *,html.lite *::before,html.lite *::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;animation:none!important;transition-duration:.12s!important;transition-delay:0s!important;scroll-behavior:auto!important;text-shadow:none!important}
html.lite .ambient,html.lite body::before,html.lite body::after,html.lite .ch::after,html.lite .hero-card::before,html.lite .acct-hero::before{display:none!important}
html.lite .sp-foot{opacity:1}
html.lite .btn.pri,html.lite .hdr-login,html.lite .login-card,html.lite .sheet,html.lite .toast,html.lite .tabbar,html.lite .tab-lens,html.lite .seg-lens,html.lite .top.scrolled,html.lite .ch:hover,html.lite .up-opt.rec{box-shadow:none!important}
html.lite .sheet,html.lite .tabbar,html.lite .toast,html.lite .login-card,html.lite .seg{background-color:#0c1220!important}
html.lite .modal,html.lite #uiPick{background:rgba(2,4,10,.82)}
</style>

const fmtTime = ts => {
  if (!ts) return '';
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return 'الآن';
  if (d < 3600) return 'قبل ' + Math.floor(d/60) + ' دقيقة';
  if (d < 86400) return 'قبل ' + Math.floor(d/3600) + ' ساعة';

async function api(path, opts={}) {
  const o = { credentials:'include', method: opts.method || 'GET', headers: {} };
  if (opts.body !== undefined) { o.headers['content-type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  if (opts.form) o.body = opts.form;
  try {
    const r = await fetch(path, o);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const err = new Error(j.error || j.detail || 'خطأ في الاتصال'); err.status = r.status; err.data = j; throw err; }
    return j;
  } catch (e) { throw e; }
}

function modal(opts) {

    let html = '<div class="grab"></div>';
    // زر الإلغاء (أو الإغلاق) في الأعلى دائماً — لا حاجة للنزول لأسفل النافذة

    else html += '<div class="sh-top"><button class="btn ghost sm" id="__mx" type="button">' + IC.x + ' إغلاق</button></div>';
    if (opts.title) html += '<div class="sh-title">' + esc(opts.title) + '</div>';

    if (opts.html) html += opts.html;

    sh.innerHTML = html;
    sh.scrollTop = 0;
    m.classList.add('on');
    const close = v => { m.classList.remove('on'); setTimeout(() => resolve(v), 320); };
    const okBtn = $('#__mo'), cBtn = $('#__mc'), xBtn = $('#__mx');

    if (cBtn) cBtn.onclick = () => opts.input ? close(null) : close(false);
    if (xBtn) xBtn.onclick = () => close(opts.input ? null : true);

    if (opts.onReady) setTimeout(opts.onReady, 60);
  });
}

function bindGlassControls(root, vals, onChange) {

    if (d[i + 3] < 128) continue;
    const r = d[i], g = d[i + 1], b = d[i + 2];
    ar += r; ag += g; ab += b; an++;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), dd = mx - mn, v = mx / 255, s = mx ? dd / mx : 0;
    if (s < 0.25 || v < 0.2) continue;
    let h = mx === r ? ((g - b) / dd) % 6 : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;
    h = (h * 60 + 360) % 360;
    const w = s * s * (0.4 + v), bk = B[Math.min(35, Math.floor(h / 10))];
    bk.w += w; bk.r += r * w; bk.g += g * w; bk.b += b * w; tw += w;
  }
  if (!an) return null;
  let best = null; B.forEach(x => { if (!best || x.w > best.w) best = x; });
  let r, g, b;
  if (best && best.w > 0 && tw > an * 0.02) { r = best.r / best.w; g = best.g / best.w; b = best.b / best.w; }
  else { r = ar / an; g = ag / an; b = ab / an; }
  if (Math.max(r, g, b) < 26) { r = 27; g = 34; b = 51; }
  if (Math.min(r, g, b) > 238) { r = 226; g = 232; b = 240; }
  return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
}
function dominantColor(url) {
  if (!url) return Promise.resolve(null);
  if (_cvMem.has(url)) return _cvMem.get(url);
  const p = new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous'; im.decoding = 'async';
    im.onload = () => { try { res(pickColor(im)); } catch (e) { res(null); } };
    im.onerror = () => res(null);
    im.src = url;
  }).then(c => {
    if (c) {
      if (!_cvStore) _cvStore = _cvLoad();
      _cvStore[url] = c;
      const ks = Object.keys(_cvStore); if (ks.length > 300) ks.slice(0, 100).forEach(k => delete _cvStore[k]);
      lsSet('rl_cv', JSON.stringify(_cvStore));
    }
    return c;
  });
  _cvMem.set(url, p); return p;
}
function paintCover(coverEl, avatarUrl, seed) {
  if (!coverEl) return;
  const set = c => { coverEl.style.setProperty('--cv', c); coverEl.classList.add('solid'); };
  if (!_cvStore) _cvStore = _cvLoad();
  if (avatarUrl && _cvStore[avatarUrl]) return set(_cvStore[avatarUrl]);
  if (!avatarUrl) return set(hashColor(seed));

/* ═══ تنقل سلس غير مزعج ═══ */
let _swapTok = 0;
function swapView(fn) {
  const v = $('#view');
  if (!v || isLite() || !v.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) { fn(); window.scrollTo({ top: 0, behavior: 'auto' }); return; }
  const tok = ++_swapTok;
  v.getAnimations().forEach(a => a.cancel());
  const out = v.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, easing: 'ease-out', fill: 'forwards' });
  out.onfinish = () => {
    if (tok !== _swapTok) return;
    fn(); out.cancel();
    window.scrollTo({ top: 0, behavior: 'auto' });
    const nv = $('#view');
    if (nv) nv.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.16,1,.3,1)' });
  };
}

function showIntroAnim(code, secs, preview) {
  return new Promise(resolve => {
    const old = $('#introFx'); if (old) old.remove();
    const wrap = document.createElement('div'); wrap.id = 'introFx';
    const csp = "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:";
    const fr = document.createElement('iframe');
    fr.setAttribute('sandbox', 'allow-scripts');
    fr.setAttribute('title', 'login animation');
    fr.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="' + csp + '"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}</style></head><body>' + code + '</body></html>';
    const skip = document.createElement('button'); skip.type = 'button'; skip.className = 'skip'; skip.textContent = preview ? 'إغلاق المعاينة' : 'تخطي';
    wrap.appendChild(fr); wrap.appendChild(skip); document.body.appendChild(wrap);
    let done = false, tm = null;
    const onMsg = e => { if (e.source === fr.contentWindow && e.data === 'rl:done') finish(); };
    function finish() {
      if (done) return; done = true;
      window.removeEventListener('message', onMsg); clearTimeout(tm);
      wrap.classList.add('out'); setTimeout(() => { wrap.remove(); resolve(); }, 500);
    }
    window.addEventListener('message', onMsg);
    skip.onclick = finish;
    tm = setTimeout(finish, Math.max(1, +secs || 3) * 1000);
  });
}

async function checkPushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { S.pushEnabled = false; return; }
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); S.pushEnabled = !!sub; }
  catch (e) { S.pushEnabled = false; }
}
function urlB64ToU8(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  s += '='.repeat((4 - s.length % 4) % 4);
  const raw = atob(s); const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return toast('المتصفح لا يدعم الإشعارات', 'bad');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('تم رفض الإذن', 'bad');
    const reg = await navigator.serviceWorker.ready;
    const keyRes = await api('/api/push/key');
    if (!keyRes.key) return toast('Push غير مفعّل من السيرفر', 'bad');
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToU8(keyRes.key) });
    await api('/api/push/subscribe', { method:'POST', body: sub.toJSON() });
    S.pushEnabled = true; toast('تم تفعيل الإشعارات', 'ok');
    const old = $('#accMenu'); if (old) old.remove(); renderApp();
  } catch (e) { toast(e.message || 'فشل تفعيل الإشعارات', 'bad'); }
}
async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await api('/api/push/unsubscribe', { method:'POST', body: { endpoint: sub.endpoint } }); await sub.unsubscribe(); }
    S.pushEnabled = false; toast('تم إيقاف الإشعارات', 'ok');
    const old = $('#accMenu'); if (old) old.remove(); renderApp();
  } catch (e) { toast(e.message || 'فشل الإيقاف', 'bad'); }

  const adb = $('#adminBtn'); if (adb) adb.onclick = () => { S.view = 'admin'; S.admin.tab = ''; renderApp(); };
  const ln = $('#loginNow'); if (ln) ln.onclick = () => { S.guest = false; renderAuth(); };
  const lt = $('#loginTop'); if (lt) lt.onclick = () => { S.guest = false; renderAuth(); };
  if (!_scrollBound) {
    _scrollBound = true;
    window.addEventListener('scroll', () => { const t = $('#top'); if (t) t.classList.toggle('scrolled', window.scrollY > 8); }, { passive: true });
  }
  renderView();
}

function renderView() {
  const v = $('#view'); if (!v) return;
  if (S.view === 'home') return viewHome(v);
  if (S.view === 'tg') return viewTelegram(v);
  if (S.view === 'social') return viewSocial(v);
  if (S.view === 'account') return viewAccount(v);
  if (S.view === 'notifs') return viewNotifs(v);
  if (S.view === 'news') return viewNews(v);
  if (S.view === 'admin') return openAdmin();
  S.view = 'home'; return viewHome(v);
}

/* ═══ NEWS PAGE ═══ */
function viewNews(v) {
  const kindLabel = k => k === 'update' ? 'تحديث' : k === 'maintenance' ? 'صيانة' : k === 'warning' ? 'تحذير' : 'خبر';
  v.innerHTML = `<div class="sec" style="padding-top:0"><div class="sec-h"><div class="sec-title">الأخبار والإعلانات <span>.</span></div></div>${S.news.length ? '<div id="newsList"></div>' : `<div class="empty"><div class="em-icon">${IC.newsp}</div><h3>لا أخبار</h3></div>`}</div>`;
  const list = $('#newsList'); if (!list) return;
  S.news.forEach(n => {
    const card = el('div', 'news-card kind-' + (n.kind || 'news') + (n.is_read ? '' : ' unread'));
    card.innerHTML = `
      <h4>${esc(n.title)} <span class="nc-kind">${kindLabel(n.kind)}</span>${!n.is_read ? '<span class="pill warn">جديد</span>' : ''}</h4>
      ${n.image ? `<img class="nc-img" src="${esc(n.image)}" onerror="this.remove()">` : ''}
      ${n.body ? `<div class="nc-body">${esc(n.body)}</div>` : ''}
      <div class="nc-time">${fmtTime(n.created)}</div>`;
    card.onclick = async () => {
      if (!n.is_read) {
        try { await api('/api/news/' + n.id + '/read', { method:'POST' }); } catch (e) {}
        n.is_read = true; S.newsUnread = Math.max(0, S.newsUnread - 1);
        card.classList.remove('unread');
      }
    };
    list.appendChild(card);
  });
}

async function showNewsPopup() {
  const unread = S.news.filter(n => !n.is_read);
  if (!unread.length) return;
  const kindLabel = k => k === 'update' ? 'تحديث' : k === 'maintenance' ? 'صيانة' : k === 'warning' ? 'تحذير' : 'خبر';
  const itemsHTML = unread.slice(0, 5).map(n => `
    <div class="news-card kind-${n.kind || 'news'}" data-nid="${n.id}">
      <h4>${esc(n.title)} <span class="nc-kind">${kindLabel(n.kind)}</span></h4>
      ${n.image ? `<img class="nc-img" src="${esc(n.image)}" onerror="this.remove()">` : ''}
      ${n.body ? `<div class="nc-body">${esc(n.body)}</div>` : ''}
      <div class="nc-time">${fmtTime(n.created)}</div>
    </div>`).join('');
  const r = await modal({
    title: 'إعلانات جديدة',
    sub: `لديك ${unread.length} إعلان غير مقروء`,
    html: itemsHTML,
    okText: 'قرأت الكل',
    cancelText: 'لاحقاً',
    wide: true
  });
  if (r) {
    try {
      for (const n of unread) { await api('/api/news/' + n.id + '/read', { method:'POST' }); n.is_read = true; }
      S.newsUnread = 0;
      if (S.view === 'news' || S.view === 'home') renderApp();
    } catch (e) {}
  }
}

/* ═══ SOCIAL (كيك · يوتيوب · تويتر · ديسكورد) ═══ */
const socialItems = () => [
  { k:'kick', t:'كيك' },
  { k:'yt',   t:'يوتيوب' },
  { k:'tw',   t:'تويتر' },
  ...(canDiscord() ? [{ k:'dc', t:'ديسكورد' }] : []),
];
function viewSocial(v) {
  const items = socialItems();
  if (!items.some(x => x.k === S.social)) S.social = 'kick';
  const idx = items.findIndex(x => x.k === S.social);
  v.innerHTML = `
    <div class="seg-wrap">
      <div class="seg" id="seg" style="--n:${items.length};--i:${idx}">
        <div class="seg-lens"></div>
        ${items.map(x => `<button data-k="${x.k}" class="${x.k === S.social ? 'on' : ''}" aria-label="${x.t}">${IC[x.k]}<span>${x.t}</span></button>`).join('')}
      </div>
    </div>
    <div id="socialBody"></div>`;
  $$('#seg button').forEach(b => {
    b.onclick = () => {
      if (S.social === b.dataset.k) return;
      S.social = b.dataset.k;
      const i = items.findIndex(x => x.k === S.social);
      const seg = $('#seg'); seg.style.setProperty('--i', i);
      $$('#seg button').forEach(x => x.classList.toggle('on', x === b));
      renderSocialBody();
    };

}
function renderSocialBody() {
  const b = $('#socialBody'); if (!b) return;

  if (S.social === 'dc') return viewDiscord(b);
  return viewChannels(b, S.social);
}

/* ═══ CHANNELS ═══ */
function limitBarHTML(kind) {
  const l = S.limits[kind] || { used:0, limit:10, remaining:10 };
  const pct = l.limit > 0 ? Math.min(100, (l.used / l.limit) * 100) : 0;
  let cls = 'limit-bar';
  if (pct >= 100) cls += ' full';
  else if (pct >= 80) cls += ' warn';
  return { html: `<div class="${cls}"><b style="width:${pct}%"></b></div>`, text: `${l.used} / ${l.limit}`, isFull: l.remaining <= 0 };
}

  const rows = isLogged() ? (S.channels[kind] || []) : (S.preview?.live || []);

  const lim = isLogged() ? limitBarHTML(kind) : null;
  const isTg = kind === 'tg';
  const memberBonus = S.limits[kind]?.is_member;
  const canAdd = canWrite();

  v.innerHTML = `
    <div class="sec" style="padding-top:${isTg ? '6px' : '0'}">
      <div class="sec-h">
        <div class="sec-title"><div class="ib sm ${kind}">${IC[kind]}</div>${titleMap[kind]} <span>.</span></div>

      ${isTg && isLogged() ? `<div class="callout green">${IC.shieldCheck}<div><b>التوثيق عبر مشرف القناة</b><br><span class="mu">أضف البوت كمشرف في قناتك، ثم يصل رمز التأكيد لمشرف القناة في تيليجرام.</span></div></div>` : ''}
      ${kind === 'tw' && isLogged() && !(S.me && S.me.has_twitter) ? `<div class="callout orange">${IC.warn}<div><b>ميزة تويتر غير مفعّلة</b><br><span class="mu">الإدارة لم تضف مفتاح API بعد، لن تُجلب التغريدات حتى يُضاف.</span></div></div>` : ''}

function chCard(kind, r) {
  const card = el('div', 'ch');
