  if (kind === 'kick') { slug = '@' + (r.slug||''); title = r.name || r.slug || ''; }
  else if (kind === 'yt') { slug = r.channel_id||''; title = r.name || r.channel_id || ''; }
  else if (kind === 'tw') { slug = '@' + (r.username||''); title = r.name || r.username || ''; }
  else { slug = r.username || r.chat_id || ''; title = r.name || r.chat_id || ''; }
  const liveBadge = kind === 'kick' && r.live && r.enabled ? '<span class="ch-badge live">مباشر</span>' : '';
  const offBadge = !r.enabled ? '<span class="ch-badge off">موقوف</span>' : '';
  const noSend = (kind !== 'tg' && r.auto_send === 0) ? '<span class="ch-badge nosend">' + IC.bellOff + '</span>' : '';
  const verifiedBadge = (kind === 'tg' && r.verified) ? '<span class="ch-badge verified">' + IC.check + ' موثقة</span>' : '';
  const cover = r.banner || '';
  const avatarHTML = r.avatar ? `<img src="${esc(r.avatar)}" alt="" onerror="this.style.display='none'">` : `<div class="ph">${IC[kind]}</div>`;

  card.innerHTML = `
    <div class="ch-cover${cover ? '' : ' solid'}">${cover ? `<img src="${esc(cover)}" alt="">` : ''}${liveBadge}${offBadge}${noSend}${verifiedBadge}</div>
    <div class="ch-head">${avatarHTML}<div class="ch-info"><b>${esc(title)}</b><small>${esc(slug)}</small></div></div>
    ${kind === 'kick' && r.live && r.title ? `<div class="ch-live"><div>${esc(r.title)}</div><span>${r.viewers||0} ${IC.eye}</span></div>` : ''}
    <div class="ch-acts">
      ${kind === 'kick' ? `<a class="btn sm" href="https://kick.com/${esc(r.slug)}" target="_blank">${IC.play} مشاهدة</a>` : ''}
      ${kind === 'yt' ? `<a class="btn sm" href="https://youtube.com/channel/${esc(r.channel_id)}" target="_blank">${IC.play} زيارة</a>` : ''}
      ${kind === 'tw' ? `<a class="btn sm" href="https://x.com/${esc(r.username)}" target="_blank">${IC.tw} زيارة</a>` : ''}
      ${kind === 'tg' && r.username ? `<a class="btn sm" href="https://t.me/${esc(r.username.replace('@',''))}" target="_blank">${IC.tg} زيارة</a>` : ''}
      ${kind === 'tg' ? `<button class="btn sm" data-act="info" title="آخر الرسائل">${IC.info} معلومات</button>` : ''}
      ${kind === 'tw' ? `<button class="btn sm ghost" data-act="filters">${IC.sparkle} فلترة</button>` : ''}
      ${kind !== 'tg' ? `<button class="btn sm ghost" data-act="edit">${IC.edit} تخصيص</button>` : ''}
      <button class="btn sm ghost" data-act="refresh" title="تحديث الصورة والاسم">${IC.refresh}</button>
      ${kind !== 'tg' ? `<button class="btn sm ghost" data-act="autosend">${r.auto_send===0?IC.bellOff:IC.bell}</button>` : ''}
      <button class="btn sm ghost" data-act="toggle">${r.enabled?'إيقاف':'تفعيل'}</button>
      <button class="btn sm danger" data-act="del">${IC.trash}</button>
    </div>`;
  {
    const cvEl = card.querySelector('.ch-cover'), cvImg = cvEl && cvEl.querySelector('img');
    const paint = () => paintCover(cvEl, r.avatar, r.slug || r.channel_id || r.username || r.chat_id || title);
    if (!cover) paint(); else if (cvImg) cvImg.addEventListener('error', () => { cvImg.remove(); paint(); });
  }
  card.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const act = b.dataset.act;
      if (act === 'del') {
        const ok = await dlgConfirm('حذف القناة نهائياً؟', 'تأكيد', true); if (!ok) return;
        try { await api('/api/channels/' + kind + '/' + r.id, { method:'DELETE' }); toast('تم الحذف', 'ok'); await loadChannels(kind); renderApp(); }
        catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'toggle') {
        try { await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { enabled: !r.enabled } }); toast(r.enabled ? 'تم الإيقاف' : 'تم التفعيل', 'ok'); await loadChannels(kind); renderApp(); }
        catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'autosend') {
        const nv = r.auto_send === 0 ? 1 : 0;
        try { await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { auto_send: nv } }); toast(nv ? 'الإرسال مفعّل' : 'الإرسال موقوف', 'ok'); await loadChannels(kind); renderApp(); }
        catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'edit') { await editChannelMsg(kind, r); }
      else if (act === 'info') { await showTgMessages(r); }
      else if (act === 'filters') { await editTwFilters(r); }
      else if (act === 'refresh') {
        try {
          await api('/api/channels/' + kind + '/' + r.id + '/refresh', { method:'POST' });
          toast('تم التحديث', 'ok');
          await loadChannels(kind); renderApp();
        } catch (e2) { toast(e2.message, 'bad'); }
      }
    };
  });
  return card;
}

async function editChannelMsg(kind, r) {
  const curImg = r.msg && r.msg.match(/\{img:([^}]+)\}/);
  const curMsg = r.msg ? r.msg.replace(/\{img:[^}]+\}/g, '').trim() : '';
  let uploadedImage = curImg ? curImg[1] : '';
  const defaultTpl = kind === 'kick' ? (S.me.tpl_kick || '') : kind === 'tw' ? (S.me.tpl_tw || '') : (S.me.tpl_yt || '');
  const defaultBtn = kind === 'kick' ? (S.me.btn_kick || 'شاهد البث') : kind === 'tw' ? (S.me.btn_tw || 'عرض التغريدة') : (S.me.btn_yt || 'شاهد الفيديو');

  const html = `
    <label class="fld"><span>نص الرسالة</span>
      <textarea id="__msg" rows="6" placeholder="اتركه فارغاً للقالب العام">${esc(curMsg)}</textarea></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px;margin-bottom:12px">
      <span class="mu" style="font-size:11.5px">المتغيرات:</span>
      ${kind === 'tw' ? '<span class="pill">{name}</span><span class="pill">{username}</span><span class="pill">{text}</span><span class="pill">{url}</span>' : '<span class="pill">{name}</span><span class="pill">{title}</span><span class="pill">{url}</span>'}
    </div>
    <label class="fld"><span>نص زر المشاهدة</span>
      <input type="text" id="__btn" value="${esc(r.btn_text || '')}" placeholder="${esc(defaultBtn)}"></label>
    <label class="fld" style="margin-top:6px"><span>صورة مرفقة (اختياري)</span></label>
    <div class="img-preview-box ${uploadedImage ? '' : 'empty'}" id="__imgBox">
      ${uploadedImage ? `<img src="${esc(uploadedImage)}" alt="">` : '<div>لا توجد صورة</div>'}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button type="button" class="btn sm" id="__upBtn">${IC.camera} رفع</button>
      <button type="button" class="btn sm ghost" id="__clrBtn">${IC.x} مسح</button>
      <input type="file" id="__upFile" accept="image/*" style="display:none">
    </div>
    <div class="tpl-preview" id="__tplPrev"></div>`;

  const r2 = await modal({
    title:'تخصيص رسالة الإشعار',
    sub:'اتركه فارغاً للقالب العام',
    html, okText:'حفظ', wide: true,
    onReady: () => {
      const ta = $('#__msg'), prev = $('#__tplPrev');
      const update = () => {
        const tpl = ta.value.trim() || defaultTpl;
        const sample = tpl
          .replace(/\{name\}/g, r.name || 'اسم القناة')
          .replace(/\{title\}/g, kind === 'kick' ? 'عنوان البث' : 'عنوان الفيديو')
          .replace(/\{text\}/g, 'نص التغريدة يظهر هنا').replace(/\{username\}/g, r.username || '')
          .replace(/\{url\}/g, kind === 'kick' ? 'https://kick.com/' + (r.slug||'') : kind === 'tw' ? 'https://x.com/' + (r.username||'') : 'https://youtube.com/watch?v=...');
        prev.innerHTML = '<div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:var(--font-en)">PREVIEW</div>' + sample.replace(/\n/g, '<br>');
      };
      ta.oninput = update; update();
      $('#__upBtn').onclick = () => $('#__upFile').click();
      $('#__upFile').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
        const fd = new FormData(); fd.append('file', f);
        try {
          const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
          const j = await res.json();
          if (!res.ok) throw new Error(j.error || 'فشل');
          uploadedImage = j.url;
          const box = $('#__imgBox'); box.classList.remove('empty');
          box.innerHTML = `<img src="${esc(uploadedImage)}" alt="">`;
          toast('تم الرفع', 'ok');
        } catch (err) { toast(err.message, 'bad'); }
      };
      $('#__clrBtn').onclick = () => {
        uploadedImage = '';
        const box = $('#__imgBox'); box.classList.add('empty');
        box.innerHTML = '<div>لا توجد صورة</div>';
      };
    }
  });
  if (r2 === null || r2 === false) return;
  let finalMsg = ($('#__msg')?.value || '').trim();
  if (uploadedImage) finalMsg = (finalMsg ? finalMsg + '\n' : '') + `{img:${uploadedImage}}`;
  const btnText = ($('#__btn')?.value || '').trim();
  try {
    await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { msg: finalMsg, btn_text: btnText } });
    toast('تم الحفظ', 'ok');
    await loadChannels(kind); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

async function openAddChannel(kind) {
  if (!isLogged()) return;
  if (!canWrite()) return toast('الموقع في صيانة — لا يمكن الإضافة', 'bad');
  if (kind === 'tg') return openTgVerify();
  if (kind === 'tw' && !(S.me && S.me.has_twitter)) return modal({ title:'تويتر غير مفعّل', sub:'الإدارة لم تضف مفتاح API لتويتر بعد — تواصل معها.', okText:'حسناً', cancel:false });
  let suggestions = [];
  try { const r = await api('/api/channels/' + kind + '/suggestions'); suggestions = r.rows || []; } catch (e) {}
  const lim = S.limits[kind] || { used:0, limit:10, remaining:10 };
  const labels = {
    kick: { title:'إضافة قناة كيك', label:'slug', ph:'xqc' },
    yt:   { title:'إضافة قناة يوتيوب', label:'@handle أو UC...', ph:'@MrBeast' },
    tw:   { title:'إضافة حساب تويتر (X)', label:'@username أو رابط الحساب', ph:'@elonmusk' },
  }[kind];
  const noTg = !S.boot.has_telegram;
  const botWarn = noTg
    ? `<div style="padding:12px 14px;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.3);border-radius:12px;margin-bottom:12px;font-size:12.5px;line-height:1.7"><span style="color:var(--orange)">${IC.warn}</span> <b>توكن تيليجرام غير مضبوط</b> — لن تُرسل أي إشعارات تلقائية.</div>`
    : '';
  const sugHTML = suggestions.length ? `
    <div style="margin-top:22px;padding-top:20px;border-top:1px solid var(--line)">
      <div class="sh-sub" style="margin-bottom:6px">${IC.plus} مُقترحات الإدارة</div>
      <div class="sug-grid" id="sugGrid">${suggestions.map(s => `
        <div class="sug-item" data-id="${s.id}">
          <div class="av">${s.avatar ? `<img src="${esc(s.avatar)}" onerror="this.remove()">` : esc((s.name||'?').charAt(0).toUpperCase())}</div>
          <div class="if"><b>${esc(s.name || s.identifier)}</b><small>${esc(s.identifier)}</small></div>
          <div class="ck">${IC.check}</div>
        </div>`).join('')}</div>
      <div class="sug-toolbar"><span id="sugCount">0</span><button type="button" id="sugToggleAll">تحديد الكل</button></div>
    </div>` : '';
  const html = `
    <div style="padding:12px 14px;background:rgba(var(--blue-rgb),.06);border:1px solid var(--blue-line);border-radius:12px;margin-bottom:12px;font-size:12.5px;font-weight:800">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>الحدود</span><span style="color:var(--blue);font-family:var(--font-en)">${lim.used} / ${lim.limit}</span></div>
      <div class="limit-bar"><b style="width:${lim.limit > 0 ? Math.min(100, (lim.used/lim.limit)*100) : 0}%"></b></div>
    </div>
    ${botWarn}
    <label class="fld"><span>${esc(labels.label)}</span><input type="text" id="__ci" placeholder="${esc(labels.ph)}"></label>
    <label class="fld"><span>الاسم (اختياري)</span><input type="text" id="__cn"></label>
    <label class="fld"><span>نص الزر (اختياري)</span><input type="text" id="__bt" placeholder="${kind==='kick'?'شاهد البث':kind==='tw'?'عرض التغريدة':'شاهد الفيديو'}"></label>
    <div class="mu" style="font-size:11.5px;line-height:1.7;margin:-4px 0 6px">إن كانت القناة ضمن مقترحات الإدارة تُضاف تلقائياً بنفس بياناتها كأنك اخترتها منها.</div>
    ${kind === 'tw' ? twFiltersHTML({}) : ''}
    ${sugHTML}`;
  const result = await modal({ title: labels.title, html, okText: 'إضافة', wide: suggestions.length > 0 });
  if (result === false || result === null) return;
  const val = ($('#__ci')?.value || '').trim();
  const customName = ($('#__cn')?.value || '').trim();
  const btnText = ($('#__bt')?.value || '').trim();
  if (suggestions.length) {
    const ids = $$('#sugGrid .sug-item.on').map(x => +x.dataset.id);
    if (ids.length > 0) {
      try {
        const r = await api('/api/channels/' + kind + '/bulk-add', { method:'POST', body: { ids } });
        toast('تمت إضافة ' + (r.added || 0) + (r.failed ? ' — فشل ' + r.failed : ''), 'ok');
        if (r.errors?.length) setTimeout(() => toast(r.errors[0], ''), 500);
        await loadChannels(kind); renderApp(); return;
      } catch (e) { toast(e.message, 'bad'); return; }
    }
  }
  if (!val) return toast('اكتب القيمة', 'bad');
  try {
    const body = kind === 'kick' ? { slug: val, msg: '', btn_text: btnText } : kind === 'tw' ? { username: val, msg: '', btn_text: btnText, filters: readTwFilters() } : { channel_id: val, name: customName, msg: '', btn_text: btnText };
    const res = await api('/api/channels/' + kind, { method:'POST', body });
    toast(res.from_suggestion ? 'تمت الإضافة (من مقترحات الإدارة)' : 'تمت الإضافة', 'ok');
    if (res.warn) setTimeout(() => toast(res.warn, ''), 600);
    await loadChannels(kind); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

/* ═══ TWITTER FILTERS ═══ */
function twFiltersHTML(f) {
  f = f || {};
  const chk = (id, label, sub, on) => `<label class="tw-opt"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><div><b>${label}</b>${sub ? `<small>${sub}</small>` : ''}</div></label>`;
  const j = v => esc((v || []).join(', '));
  return `<div class="tw-filters">
    <div class="sh-sub" style="margin:16px 0 8px">${IC.sparkle} <b>فلترة التغريدات</b> — اختيارية، لا شيء مفعّل افتراضياً</div>
    ${chk('__fRt', 'تجاهل إعادة التغريد (RT)', '', f.skip_retweets)}
    ${chk('__fRp', 'تجاهل الردود', '', f.skip_replies)}
    ${chk('__fQt', 'تجاهل الاقتباسات', '', f.skip_quotes)}
    ${chk('__fMd', 'أرسل التغريدات التي فيها صورة أو فيديو فقط', '', f.only_media)}
    ${chk('__fYt', 'تجاهل التغريدات التي تحتوي رابط يوتيوب', 'مثال على الفلترة: لتفادي التعارض مع صفحة يوتيوب', f.block_youtube)}
    <label class="fld"><span>كلمات تمنع الإرسال (افصل بفاصلة)</span><input type="text" id="__fBw" value="${j(f.block_words)}" placeholder="إعلان, مسابقة"></label>
    <label class="fld"><span>أرسل فقط إذا احتوت إحدى هذه الكلمات</span><input type="text" id="__fRw" value="${j(f.require_words)}" placeholder="اختياري"></label>
    <label class="fld"><span>روابط/نطاقات تمنع الإرسال</span><input type="text" id="__fBd" value="${j(f.block_domains)}" placeholder="twitch.tv, discord.gg"></label>
    <label class="fld"><span>أقل عدد أحرف للتغريدة</span><input type="number" id="__fMc" value="${f.min_chars || ''}" placeholder="0"></label>
  </div>`;
}
function readTwFilters() {
  const v = id => (document.getElementById(id) || {}).value || '';
  const c = id => !!(document.getElementById(id) || {}).checked;
  return { skip_retweets: c('__fRt'), skip_replies: c('__fRp'), skip_quotes: c('__fQt'), only_media: c('__fMd'), block_youtube: c('__fYt'),
           block_words: v('__fBw'), require_words: v('__fRw'), block_domains: v('__fBd'), min_chars: parseInt(v('__fMc') || '0', 10) || 0 };
}
async function editTwFilters(r) {
  let cur = {};
  try { cur = JSON.parse(r.filters || '{}') || {}; } catch (e) {}
  const ok = await modal({ title: 'فلترة تغريدات @' + r.username, sub: 'التغريدة التي لا تطابق الفلترة لا تُرسل لقنواتك', html: twFiltersHTML(cur), okText: 'حفظ', wide: true });
  if (!ok) return;
  try {
    await api('/api/channels/tw/' + r.id, { method:'PATCH', body: { filters: readTwFilters() } });
    toast('تم حفظ الفلترة', 'ok'); await loadChannels('tw'); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

}

/* ═══ TG VERIFY ═══ */
async function openTgVerify() {
  if (!isLogged()) return;
  if (!canWrite()) return toast('الموقع في صيانة — لا يمكن التوثيق', 'bad');
  if (!S.boot.has_telegram) {
    return modal({ title:'تيليجرام غير مضبوط', sub:'توكن تيليجرام غير موجود في السيرفر — تواصل مع الإدارة', okText:'حسناً', cancel:false });
  }
  const lim = S.limits.tg || { used:0, limit:1, remaining:1 };
  if (lim.remaining <= 0) {
    return modal({ title:'وصلت الحد', sub:`الحد الأقصى ${lim.limit} قناة تيليجرام.${S.me.user.is_member ? '' : ' اربط حسابك وانضم للقناة الرسمية للحصول على صلاحيات مضاعفة.'}`, okText:'حسناً', cancel:false });
  }
  const html = `
    <div class="callout green">${IC.shieldCheck}<div><b>التوثيق عبر مشرف القناة</b><br><span class="mu">يصل رمز من 6 أرقام إلى مشرف القناة في تيليجرام (يحتاج أن يفتح البوت ويضغط Start مرة واحدة).</span></div></div>
    <div class="callout orange">${IC.warn}<div><b>قبل البدء:</b> أضف البوت <b>كمشرف</b> في القناة مع صلاحية نشر الرسائل.${botBtn('رابط البوت — أضفه لقناتك')}</div></div>
    <label class="fld"><span>قناة تيليجرام</span>
      <input type="text" id="__tgc" placeholder="@mychannel أو رابط t.me أو الرقم -100...">
      <small class="mu" style="display:block;margin-top:6px;font-size:11.5px">للقنوات الخاصة اكتب رقم القناة (يبدأ بـ -100)</small>
    </label>
    <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:12.5px;color:var(--muted)">
      <span>الحدود</span><span style="font-family:var(--font-en);color:#8db1ff;font-weight:900">${lim.used} / ${lim.limit}</span>
    </div>`;
  const r = await modal({ title:'توثيق قناة تيليجرام', sub:'تأكيد أنك تملك القناة', html, okText:'متابعة', wide: true });
  if (!r) return;
  const chatInput = ($('#__tgc')?.value || '').trim();
  if (!chatInput) return toast('أدخل قناة تيليجرام', 'bad');

  let result;
  try {
    result = await api('/api/tg/verify/start', { method:'POST', body: { chat_id: chatInput } });
  } catch (e) {
    return showTgErr(e, 'تعذّر الوصول للقناة');
  }

  const verifyId = result.verify_id;
  const chatName = result.chat_name;
  const chatAvatar = result.chat_avatar;
  const admins = result.admins || [];
  const autoId = result.auto_admin_id;

  if (admins.length === 1) {
    await tgVerifySendAndWait(verifyId, autoId, chatName, chatAvatar, admins[0].name);
  } else {
    await tgVerifyPickAdmin(verifyId, admins, chatName, chatAvatar);
  }
}

async function tgVerifyPickAdmin(verifyId, admins, chatName, chatAvatar) {
  const adminHTML = admins.map(a => `
    <label class="tg-pick-item" data-admin-id="${esc(a.id)}">
      <div class="av">${esc((a.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if">
        <b>${esc(a.name)}${a.is_owner ? IC.crown : ''}</b>
        <small>${esc(a.username || '')} ${a.is_owner ? '· المالك' : '· مشرف كامل'}</small>
      </div>
      <div class="ck">${IC.check}</div>
    </label>`).join('');
  const html = `

async function tgVerifyWait(verifyId, chatName, chatAvatar, adminName) {
  const html = `
    <div class="tgv-step done"><b>${IC.check}</b> تم إرسال الطلب</div>
    <div class="tgv-chat">
      <div class="av">${chatAvatar ? `<img src="${esc(chatAvatar)}" onerror="this.remove()">` : esc((chatName||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(chatName || 'قناة تيليجرام')}</b><small>بانتظار تأكيد ${esc(adminName || 'المشرف')}...</small></div>
    </div>
    <div style="text-align:center;padding:16px 0">
      <div class="tgv-spinner"></div>
      <div class="mu" style="margin-top:12px;font-size:13px;line-height:1.8">
        أرسلنا رسالة إلى <b style="color:var(--text)">${esc(adminName || 'المشرف')}</b> في تيليجرام<br>
        عندما يضغط <b style="color:var(--green)">نعم</b> سيحصل على رمز 6 أرقام<br>
        <span style="font-size:12px;color:var(--muted-2)">اطلب منه الرمز والصقه في الخطوة التالية</span>
      </div>
    </div>
    <div class="tgv-timer" id="__vtimer">⏱ <span id="__vtsec">600</span> ثانية متبقية</div>`;
  let done = false, left = 600, timer = null, pollInterval = null, polls = 0;
  const stop = () => { clearInterval(timer); clearInterval(pollInterval); };
  const mp = modal({ title:'بانتظار التأكيد', sub:'تحقق من تيليجرام', html, okText:'لدي الرمز بالفعل', cancelText:'إلغاء الطلب', wide: true });
  mp.then(async (v) => {
    if (done) return;
    done = true; stop();
    if (v === true) { await tgVerifyCode(verifyId, chatName, chatAvatar); return; }
    try { await api('/api/tg/verify/' + verifyId + '/cancel', { method:'POST' }); } catch (e) {}
    toast('تم إلغاء الطلب', 'ok');
  });
  timer = setInterval(() => {
    left--;
    const s2 = document.getElementById('__vtsec'); if (s2) s2.textContent = left;
    if (left <= 0) { stop(); if (!done) { done = true; toast('انتهت مدة التوثيق', 'bad'); } }
  }, 1000);
  pollInterval = setInterval(async () => {
    if (done) return;
    polls++;
    if (polls > 200) { stop(); return; }
    try {
      const r = await api('/api/tg/verify/' + verifyId);
      if (r.status === 'confirmed') {
        done = true; stop();
        await tgVerifyCode(verifyId, chatName, chatAvatar);
      } else if (r.status === 'cancelled' || r.status === 'expired' || r.status === 'failed') {
        done = true; stop();
        toast(r.status === 'cancelled' ? 'تم إلغاء التوثيق من المشرف' : 'انتهت مدة التوثيق', 'bad');
      }
    } catch (e) {}
  }, 3000);
}

async function tgLinkAuto() {
  let res;
  try { res = await api('/api/link-tg/start', { method:'POST', body:{} }); }
  catch (e) { return showTgErr(e, 'تعذّر بدء الربط'); }
  let ok = false, stop = false;
  const html = `
    <div style="text-align:center;padding:10px 0 4px"><div class="tgv-spinner"></div></div>
    <div class="mu" style="text-align:center;font-size:13px;line-height:1.9;margin:10px 0">افتح تيليجرام واضغط <b style="color:var(--text)">Start</b> في البوت — ننتظرك هنا وسيتحدّث حسابك تلقائياً.</div>
    <a class="btn pri wide" id="__tglOpen" href="${esc(res.link)}" target="_blank" rel="noopener">${IC.tg} فتح البوت في تيليجرام</a>
    <div class="mu" dir="ltr" style="text-align:center;font-size:11.5px;margin-top:10px;word-break:break-all">${esc(res.link)}</div>
    <div class="tgv-timer" style="margin-top:12px">الرابط صالح لمدة 10 دقائق</div>`;
  const poll = async () => {
    const t0 = Date.now();
    while (!stop && Date.now() - t0 < 600000) {
      await new Promise(r => setTimeout(r, 2000));
      if (stop) break;
      try {
        const st = await api('/api/link-tg/' + res.link_id + '/status');
        if (st.status === 'used') { ok = true; const b = $('#__mc'); if (b) b.click(); break; }
        if (st.status === 'expired' || st.status === 'none') break;
      } catch (e) {}
    }
  };
  const mp = modal({ title:'بانتظار تأكيدك في تيليجرام', html, noOk:true, cancelText:'إلغاء', wide:true, onReady: () => { poll(); } });
  await mp; stop = true;
  if (ok) {
    await loadMe(); renderApp();
    toast(S.me.user.is_member ? 'تم الربط والعضوية مؤكدة — صلاحياتك مضاعفة' : 'تم ربط حساب تيليجرام بنجاح', 'ok');
  }
}

    tg: { mode: (document.querySelector('input[name=tgm]:checked') || {}).value || 'none', ids: $$('#__tgList input[data-tg]:checked').map(x => +x.dataset.tg) },
    users: { mode: (document.querySelector('input[name=usm]:checked') || {}).value || 'none', ids: $$('#__usList input[data-user]:checked').map(x => +x.dataset.user) },
  };
  try {
    const res = await api('/api/send', { method:'POST', body });
    const r = res.result || {};
    let msg = [];
    if (r.tg_sent || r.tg_failed) msg.push('تيليجرام: نجح ' + r.tg_sent + ' · فشل ' + r.tg_failed);
    if (r.users) msg.push('المستخدمون: ' + r.users);
    toast(msg.join(' · ') || 'تم', 'ok');
  } catch (e) { toast(e.message, 'bad'); }
}

  if (rBtn) rBtn.onclick = async () => {

    try { await api('/api/discord/refresh', { method:'POST' }); toast('تم التحديث', 'ok'); await loadFeeds(); renderApp(); }
    catch (e) { toast(e.message, 'bad'); }
    rBtn.disabled = false;
  };

      let ibCount = 0;

          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">

            <span class="pill">${esc(src)}</span>

          <div style="display:flex;gap:7px;flex-wrap:wrap">

              <button class="btn sm danger" data-fa="del">${IC.trash}</button>
            ` : ''}
          </div>
        </div>`;
      card.querySelectorAll('[data-fa]').forEach(b => {
        b.onclick = async () => {
          const act = b.dataset.fa;
          if (act === 'del') {
            const ok = await dlgConfirm('حذف الربط؟', 'تأكيد', true); if (!ok) return;
            try { await api('/api/discord/feeds/' + f.id, { method:'DELETE' }); toast('تم', 'ok'); await loadFeeds(); renderApp(); }
            catch (e) { toast(e.message, 'bad'); }
          } else if (act === 'toggle') {
            try { await api('/api/discord/feeds/' + f.id, { method:'PATCH', body: { enabled: !f.enabled } }); toast(f.enabled ? 'تم الإيقاف' : 'تم التفعيل', 'ok'); await loadFeeds(); renderApp(); }
            catch (e) { toast(e.message, 'bad'); }
          } else if (act === 'edit') { await editFeed(f); }
          else if (act === 'sub') { await manageFeedSub(f); }

      });
      grid.appendChild(card);
    });

}

async function manageFeedSub(f) {
  const myTgs = S.myTgs || [];
  if (!myTgs.length) {
    return modal({ title:'لا توجد قنوات', sub:'أضف قناة تيليجرام أولاً لتستقبل الرسائل فيها', okText:'حسناً', cancel:false });
  }

  const tgHTML = myTgs.map(t => `
    <label class="tg-pick-item ${mySubs.indexOf(t.id) >= 0 ? 'on' : ''}">
      <div class="av">${t.avatar ? `<img src="${esc(t.avatar)}" onerror="this.remove()">` : esc((t.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(t.name)}</b><small>${esc(t.username || '')}</small></div>
      <input type="checkbox" data-tgid="${t.id}" ${mySubs.indexOf(t.id) >= 0 ? 'checked' : ''} style="width:20px;height:20px">
    </label>`).join('');
  const name = (S.knownChannels[f.channel_id]?.name) || f.channel_name || f.channel_id;
  const html = `
    <div style="padding:14px;background:rgba(var(--blue-rgb),.06);border:1px solid var(--blue-line);border-radius:14px;margin-bottom:14px;font-size:12.5px;line-height:1.7">

    <label class="fld"><span>قنواتك في تيليجرام</span></label>
    <div class="tg-pick-grid" id="__subList">${tgHTML}</div>`;
  const r = await modal({
    title:'متابعة الرابط', sub:'اختر قنواتك', html, okText:'حفظ', wide: true,
    onReady: () => {
      $$('#__subList .tg-pick-item').forEach(item => {
        item.onclick = (e) => {
          if (e.target.tagName === 'INPUT') return;

          item.classList.toggle('on', cb.checked);

      });
    }
  });

  try {
    await api('/api/discord/feeds/' + f.id + '/subscribe', { method:'POST', body: { tg_channel_ids: ids } });
    toast('تم الحفظ', 'ok');
    await loadFeeds(); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

async function editFeed(f) {
  await loadBots();
  let ignoreBots = [];
  try { ignoreBots = JSON.parse(f.ignore_bots || '[]'); } catch (e) {}
  let keywordRules = [];
  try { keywordRules = JSON.parse(f.keyword_rules || '[]'); } catch (e) {}
  if (!Array.isArray(keywordRules)) keywordRules = [];
  const botList = S.knownBots || [];
  const botListHTML = botList.length ? botList.map(b => `
    <label class="bot-item ${ignoreBots.indexOf(b.id) >= 0 ? 'on' : ''}">
      <div class="av">${b.avatar ? `<img src="${esc(b.avatar)}" onerror="this.remove()">` : esc((b.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(b.name||b.id)}</b><small>ID: ${esc(b.id)} · ${b.seen_count || 0} رسالة</small></div>
      <span class="st">${ignoreBots.indexOf(b.id) >= 0 ? 'مستثنى' : 'مقبول'}</span>

    </label>`).join('') : '<div class="mu center" style="padding:14px;font-size:12.5px">لم يتم رصد بوتات بعد</div>';
  const kwHTML = `
    <div id="__kwList">${keywordRules.map((rule, idx) => renderKwRule(rule, idx)).join('')}</div>
    <button type="button" class="btn sm" id="__addKw" style="margin-top:10px">${IC.plus} إضافة قاعدة صورة</button>`;
  const html = `
    <div class="switch-row">
      <div class="sw-txt"><b>نسخ الأصل (بدون قالب)</b><small>يستخدم نص الرسالة الأصلي مباشرة</small></div>
      <label class="sw"><input type="checkbox" id="__useOrig" ${f.use_original !== 0 ? 'checked' : ''}><i></i></label>
    </div>
    <label class="fld"><span>القالب (يُستخدم إذا لم يفعل "نسخ الأصل")</span>
      <textarea id="__tp" rows="5" class="mono">${esc(f.template || '')}</textarea></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px;margin-bottom:10px">
      <span class="mu" style="font-size:11.5px">المتغيرات:</span>
      <span class="pill">{author_no_at}</span><span class="pill">{content}</span>
      <span class="pill">{title}</span><span class="pill">{description}</span>
      <span class="pill">{channel}</span><span class="pill">{url}</span>
    </div>
    <label class="fld"><span>نص الزر</span><input type="text" id="__bt" value="${esc(f.btn_text || 'عرض الروم')}"></label>
    <label class="fld"><span>رابط الزر المخصص (اختياري)</span>
      <input type="text" id="__ru" value="${esc(f.room_url || '')}" placeholder="https://discord.com/channels/..."></label>
    <label class="fld"><span>صورة ثابتة (اختياري)</span>
      <input type="text" id="__fi" value="${esc(f.fixed_image || '')}" placeholder="https://..."></label>
    <label class="fld" style="margin-top:20px"><span>قواعد الصور بالكلمات المفتاحية</span></label>
    <div class="mu" style="font-size:11.5px;margin-bottom:8px">لو الرسالة تحتوي الكلمة، يستبدل الصورة المرفقة بالصورة المحددة</div>
    ${kwHTML}
    <label class="fld" style="margin-top:20px"><span>البوتات المستثناة (لن يقرأ رسائلها)</span></label>
    <div class="bot-list" id="__botList">${botListHTML}</div>
    <div class="switch-row" style="margin-top:20px">
      <div class="sw-txt"><b>AI Rewrite (Groq)</b><small>يعيد صياغة الرسالة قبل الإرسال</small></div>
      <label class="sw"><input type="checkbox" id="__useAi" ${f.use_ai ? 'checked' : ''} ${!S.aiStatus.available ? 'disabled' : ''}><i></i></label>
    </div>
    <label class="fld"><span>AI Prompt (اختياري)</span>
      <textarea id="__aiPrompt" rows="3" placeholder="أعد صياغة الرسالة بأسلوب إخباري موجز...">${esc(f.ai_prompt || '')}</textarea></label>
    ${!S.aiStatus.available ? '<div class="ai-status warn">' + IC.warn + ' Groq غير مضبوط — أضف API key من لوحة التحكم</div>' : ''}
    <div class="tpl-preview" id="__tplPrev"></div>`;
  const r = await modal({
    title: 'تخصيص الربط', sub: 'كل الإعدادات المخصصة لهذا الروم',
    html, okText: 'حفظ', xwide: true,
    onReady: () => {
      const ta = $('#__tp'), prev = $('#__tplPrev');
      const update = () => {
        const tpl = ta.value.trim() || '<b>{author_no_at}</b>\n\n<b>{content}</b>';
        const sample = tpl
          .replace(/\{name\}/g, 'DRB7H').replace(/\{author\}/g, 'DRB7H').replace(/\{author_no_at\}/g, 'DRB7H')
          .replace(/\{content\}/g, 'محتوى')
          .replace(/\{title\}/g, 'اسم المقطع').replace(/\{description\}/g, 'الوصف')
          .replace(/\{channel\}/g, 'twitter').replace(/\{url\}/g, 'https://...');
        prev.innerHTML = '<div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:var(--font-en)">PREVIEW</div>' + sample.replace(/\n/g, '<br>');
      };
      ta.oninput = update; update();
      $$('#__botList .bot-item').forEach(item => {

          const cb = item.querySelector('input[type="checkbox"]');
          cb.checked = !cb.checked;
          item.classList.toggle('on', cb.checked);
          item.querySelector('.st').textContent = cb.checked ? 'مستثنى' : 'مقبول';
        };
      });
      bindKwRules();
      $('#__addKw').onclick = () => {
        keywordRules.push({ keywords: [], image: '', caption: '' });
        $('#__kwList').innerHTML = keywordRules.map((rr, i) => renderKwRule(rr, i)).join('');
        bindKwRules();
      };
      function bindKwRules() {
        $$('#__kwList .kw-rule').forEach((elr, idx) => {
          const rule = keywordRules[idx];
          elr.querySelector('[data-kwdel]').onclick = () => {
            keywordRules.splice(idx, 1);
            $('#__kwList').innerHTML = keywordRules.map((rr, i) => renderKwRule(rr, i)).join('');
            bindKwRules();
          };
          const kwInput = elr.querySelector('input[data-kwin]');
          const kwBtn = elr.querySelector('[data-kwadd]');
          const addKw = () => {
            const vv = (kwInput.value || '').trim();
            if (!vv) return;
            if (!Array.isArray(rule.keywords)) rule.keywords = [];
            rule.keywords.push(vv);
            kwInput.value = '';
            elr.querySelector('.kw-tags').innerHTML = renderKwTags(rule.keywords, idx);
            bindKwTags();
          };
          kwBtn.onclick = addKw;
          kwInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addKw(); } };
          const imgInput = elr.querySelector('input[data-kwimg]');
          imgInput.oninput = () => {
            rule.image = imgInput.value.trim();
            const prev = elr.querySelector('.kw-img-prev');
            if (rule.image) prev.innerHTML = `<img src="${esc(rule.image)}" onerror="this.style.display='none'">`;
            else prev.textContent = 'لا صورة';
          };
          const capInput = elr.querySelector('textarea[data-kwcap]');
          if (capInput) capInput.oninput = () => { rule.caption = capInput.value.trim(); };
          
          const upBtn = elr.querySelector('[data-kwimgup]');
          if (upBtn) upBtn.onclick = () => {
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'image/*';
            inp.onchange = async () => {
              const file = inp.files[0]; if (!file) return;
              if (file.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
              const fd = new FormData(); fd.append('file', file);
              try {
                const res = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'include' });
                const j = await res.json();
                if (!res.ok) throw new Error(j.error || 'فشل');
                rule.image = j.url;
                imgInput.value = j.url;
                elr.querySelector('.kw-img-prev').innerHTML = `<img src="${esc(j.url)}">`;
                toast('تم الرفع', 'ok');
              } catch (err) { toast(err.message, 'bad'); }
            };
            inp.click();
          };
          function bindKwTags() {
            elr.querySelectorAll('.kw-tag button').forEach(bb => {
              bb.onclick = () => {
                const k = +bb.dataset.kwi;
                rule.keywords.splice(k, 1);
                elr.querySelector('.kw-tags').innerHTML = renderKwTags(rule.keywords, idx);
                bindKwTags();
              };
            });
          }
          bindKwTags();
        });
      }
    }
  });
  if (r === null || r === false) return;
  const tpl = ($('#__tp')?.value || '').trim();
  const btnText = ($('#__bt')?.value || 'عرض الروم').trim();
  const newIgBots = $$('#__botList input[data-botid]:checked').map(x => x.dataset.botid);
  const fixedImage = ($('#__fi')?.value || '').trim();
  const roomUrl = ($('#__ru')?.value || '').trim();
  const useOrig = $('#__useOrig')?.checked ? 1 : 0;
  const useAi = $('#__useAi')?.checked ? 1 : 0;
  const aiPrompt = ($('#__aiPrompt')?.value || '').trim();
  const finalRules = keywordRules.filter(rule => rule.keywords && rule.keywords.length > 0);
  try {
    await api('/api/discord/feeds/' + f.id, { method:'PATCH', body: {
      template: tpl, btn_text: btnText, ignore_bots: newIgBots,
      keyword_rules: finalRules, fixed_image: fixedImage, room_url: roomUrl,
      use_original: useOrig, use_ai: useAi, ai_prompt: aiPrompt,
    }});
    toast('تم الحفظ', 'ok');
    await loadFeeds(); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

function renderKwTags(keywords, ruleIdx) {
  if (!Array.isArray(keywords) || !keywords.length) return '<span class="mu" style="font-size:11.5px">لا كلمات بعد</span>';
  return keywords.map((k, i) => `<span class="kw-tag">${esc(k)} <button type="button" data-kwi="${i}">×</button></span>`).join('');
}

function renderKwRule(rule, idx) {
  return `
    <div class="kw-rule" data-kwidx="${idx}">
      <div class="kw-rule-head">
        <b>قاعدة #${idx + 1}</b>
        <button type="button" data-kwdel style="background:transparent;border:1px solid rgba(239,68,68,.4);color:var(--red);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:11px">${IC.trash}</button>
      </div>
      <div class="kw-rule-body">
        <div>
          <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px">الكلمات المفتاحية (Enter للإضافة)</div>
          <div class="kw-tags">${renderKwTags(rule.keywords || [], idx)}</div>
          <div class="kw-tag-input">
            <input type="text" data-kwin placeholder="مثال: مافيه">
            <button type="button" class="btn sm pri" data-kwadd style="min-width:auto;padding:8px 12px">${IC.plus}</button>
          </div>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px">الصورة المرسلة عند المطابقة</div>
          <div class="kw-img-row">
            <div class="kw-img-prev">${rule.image ? `<img src="${esc(rule.image)}" onerror="this.style.display='none'">` : 'لا صورة'}</div>
            <input type="text" data-kwimg value="${esc(rule.image || '')}" placeholder="https://...">
            <button type="button" class="btn sm" data-kwimgup style="min-width:auto;padding:8px 12px">${IC.upload}</button>
          </div>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px">رسالة ثابتة (تستبدل النص الأصلي)</div>
          <textarea data-kwcap class="mono" rows="2" style="width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font-size:12.5px;resize:vertical" placeholder="اتركه فارغاً للاحتفاظ بالنص الأصلي">${esc(rule.caption || '')}</textarea>
        </div>
      </div>
    </div>`;
}

async function openAddFeed() {
  if (!canDiscord() || !isOwner()) return toast('خاص بالمالك فقط', 'bad');
  await loadBots();
  const known = S.knownChannels || {};
  const chs = Object.entries(known);
  if (!chs.length) return modal({ title:'لا رومات', sub:'البوت لم يكتشف رومات. تأكد من DISCORD_GUILD_ID ثم اضغط تحديث', okText:'حسناً', cancel:false });
  const linked = new Set(S.feeds.map(f => f.channel_id));
  const available = chs.filter(([id]) => !linked.has(id));
  if (!available.length) return modal({ title:'كل الرومات مربوطة', okText:'حسناً', cancel:false });
  const botList = S.knownBots || [];
  const botListHTML = botList.length ? botList.map(b => `
    <label class="bot-item">
      <div class="av">${b.avatar ? `<img src="${esc(b.avatar)}" onerror="this.remove()">` : esc((b.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(b.name||b.id)}</b><small>ID: ${esc(b.id)} · ${b.seen_count || 0}</small></div>
      <span class="st">مقبول</span>
      <input type="checkbox" data-botid="${b.id}" style="display:none">
    </label>`).join('') : '<div class="mu center" style="padding:14px;font-size:12.5px">لم يتم رصد بوتات بعد</div>';
  const html = `

async function openPasswordModal() {
  const html = `
    <label class="fld"><span>كلمة المرور الحالية</span><input type="password" id="__pw0" autocomplete="current-password"></label>
    <label class="fld"><span>كلمة المرور الجديدة</span><input type="password" id="__pw1" autocomplete="new-password" placeholder="6 أحرف على الأقل"></label>
    <label class="fld"><span>تأكيد كلمة المرور</span><input type="password" id="__pw2" autocomplete="new-password"></label>`;
  const r = await modal({ title:'تغيير كلمة المرور', html, okText:'حفظ', small:true });
  if (!r) return;
  const o = $('#__pw0')?.value || '', n = $('#__pw1')?.value || '', n2 = $('#__pw2')?.value || '';
  if (!o || !n) return toast('أكمل الحقول', 'bad');
  if (n.length < 6) return toast('كلمة المرور 6 أحرف على الأقل', 'bad');
  if (n !== n2) return toast('تأكيد كلمة المرور غير مطابق', 'bad');
  try { await api('/api/me/password', { method:'POST', body:{ old:o, new:n } }); toast('تم تغيير كلمة المرور', 'ok'); await loadAccountInfo(); if (S.view === 'account') renderAccountBody($('#view')); }
  catch (e) { toast(e.message, 'bad'); }
}

async function changeProfileAvatar() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
    const fd = new FormData(); fd.append('file', f);
    try {
      const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || 'فشل');
      await api('/api/me/profile', { method:'PATCH', body: { avatar: j.url } });
      S.me.user.avatar = j.url; toast('تم تحديث الصورة', 'ok');
      const old = $('#accMenu'); if (old) old.remove(); renderApp();
    } catch (e) { toast(e.message, 'bad'); }
  };
  inp.click();
}

async function changeProfileDisplay() {
  const cur = S.me.user.display || S.me.user.username;
  const nv = await modal({ title: 'تعديل الاسم', input: true, inputLabel: 'الاسم', inputValue: cur, okText: 'حفظ' });
  if (nv === null || !nv.trim()) return;
  try {
    await api('/api/me/profile', { method:'PATCH', body: { display: nv.trim() } });
    S.me.user.display = nv.trim(); toast('تم', 'ok');
    const old = $('#accMenu'); if (old) old.remove(); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

        }).join('')}
      </div>
    </div>`;

      <button class="adm-back" id="adBack">${IC.back}<span>${t ? 'الإدارة' : 'الموقع'}</span></button>
      <div class="adm-ttl">${t && sec ? esc(sec.n) : 'لوحة الإدارة'}</div>

    </div>

  $('#adBack').onclick = () => { if (t) { S.admin.tab = ''; renderAdmin(); window.scrollTo(0, 0); } else backHome(); };

}
function backHome() {
  S.view = 'home';
  if (isAdminPath()) { try { history.pushState({}, '', '/'); } catch (e) {} }
  renderApp();
}
function renderAdminContent() {
  const c = $('#adContent'); if (!c) return;
  if (S.admin.tab === 'stats') return renderAdminStats(c);
  if (S.admin.tab === 'users') return renderAdminUsers(c);
  if (S.admin.tab === 'news') return renderAdminNews(c);
  if (S.admin.tab === 'defaults') return renderAdminDefaults(c);
  if (S.admin.tab === 'twitter') return renderAdminTwitter(c);
  if (S.admin.tab === 'suggestions') return renderAdminSuggestions(c);
  if (S.admin.tab === 'sec') return renderAdminSec(c);
  if (S.admin.tab === 'appearance') return renderAdminAppearance(c);
  if (S.admin.tab === 'ai') return renderAdminAI(c);
  if (S.admin.tab === 'settings') return renderAdminSettings(c);
  if (S.admin.tab === 'system') return renderAdminSystem(c);
}

async function renderAdminTwitter(c) {
  let st = {};
  try { st = await api('/api/admin/twitter'); } catch (e) { return toast(e.message, 'bad'); }
  const cls = !st.configured ? 'bad' : (st.last_error || st.paused) ? 'bad' : 'ok';
  const txt = !st.configured ? 'لم يُضف مفتاح تويتر بعد — لن تُجلب أي تغريدات'
    : st.paused ? 'الجلب متوقف مؤقتاً بسبب حد الطلبات'
    : st.last_error ? st.last_error
    : 'المفتاح مضبوط' + (st.last_ok ? ' · آخر جلب ناجح ' + fmtTime(st.last_ok) : '');
  const pct = st.daily_cap > 0 ? Math.min(100, Math.round(st.reads_today / st.daily_cap * 100)) : 0;
  const intervals = [[120,'كل 2 دقيقة'],[300,'كل 5 دقائق (موصى به)'],[600,'كل 10 دقائق'],[900,'كل 15 دقيقة'],[1800,'كل 30 دقيقة']];
  c.innerHTML = `
    <div class="ai-status ${cls}">${cls === 'ok' ? IC.check : IC.warn} ${esc(txt)}</div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">${IC.tw} مفتاح X API (Bearer Token)</div>
      <label class="fld"><span>Bearer Token ${st.source === 'env' ? '(محجوز — من متغيرات البيئة)' : st.key_hint ? '(الحالي: ' + esc(st.key_hint) + ')' : ''}</span>
        <input type="password" id="__twkey" placeholder="الصق المفتاح هنا" autocomplete="off" ${st.source === 'env' ? 'disabled' : ''}></label>
      <label class="fld"><span>معدّل الفحص</span>
        <select id="__twint">${intervals.map(i => `<option value="${i[0]}" ${+st.interval === i[0] ? 'selected' : ''}>${i[1]}</option>`).join('')}</select></label>
      <label class="fld"><span>الحد اليومي للتغريدات المقروءة (حماية للرصيد — 0 = بلا حد)</span>
        <input type="number" id="__twcap" value="${st.daily_cap ?? 500}"></label>
      <div style="font-size:12px;color:var(--muted);margin:-4px 0 12px">اليوم: <b style="color:var(--text)">${st.reads_today || 0}</b> / ${st.daily_cap || '∞'}</div>
      ${st.daily_cap > 0 ? `<div class="limit-bar ${pct >= 100 ? 'full' : pct >= 80 ? 'warn' : ''}" style="margin-bottom:14px"><b style="width:${pct}%"></b></div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn pri" id="__twsave">${IC.check} حفظ</button>
        <button class="btn" id="__twtest">${IC.refresh} اختبار الاتصال</button>
        ${st.source === 'db' ? `<button class="btn danger" id="__twclr">${IC.trash} حذف المفتاح</button>` : ''}
      </div>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:10px">${IC.info} كيف أحصل على المفتاح؟</div>
      <ol style="padding:0 20px;font-size:13px;line-height:2;color:var(--text-2)">
        <li>ادخل <a href="https://console.x.com" target="_blank" style="color:var(--blue)">console.x.com</a> وأنشئ تطبيقاً (App).</li>
        <li>من <b>Keys and Tokens</b> انسخ <b>Bearer Token</b>.</li>
        <li>الصقه هنا ثم اضغط <b>حفظ</b> ثم <b>اختبار الاتصال</b>.</li>
      </ol>
      <div class="mu" style="font-size:12px;line-height:1.8;margin-top:8px">
        • X API بنظام الدفع حسب الاستخدام — تُحاسب على كل تغريدة تُقرأ، راجع الأسعار في لوحة X.<br>
        • النظام يجلب <b>الجديد فقط</b> ويشارك الطلب الواحد بين كل من أضاف نفس الحساب، فالتكلفة قليلة.<br>
        • الحسابات المضافة حالياً: <b>${st.accounts || 0}</b> (فريد: <b>${st.unique_accounts || 0}</b>)
      </div>
    </div>`;
  const saveBody = () => { const b = { interval: $('#__twint').value, daily_cap: $('#__twcap').value }; const k = $('#__twkey'); if (k && k.value.trim()) b.api_key = k.value.trim(); return b; };
  $('#__twsave').onclick = async () => {
    try { await api('/api/admin/twitter', { method:'POST', body: saveBody() }); toast('تم الحفظ', 'ok'); await loadAdminData(); renderAdminTwitter(c); }
    catch (e) { toast(e.message, 'bad'); }
  };
  $('#__twtest').onclick = async () => {
    const b = $('#__twtest'); b.disabled = true;
    try {
      await api('/api/admin/twitter', { method:'POST', body: saveBody() });
      const r = await api('/api/admin/twitter', { method:'POST', body: { test: true } });
      toast(r.ok ? r.detail : (r.error || 'فشل الاتصال'), r.ok ? 'ok' : 'bad');
      renderAdminTwitter(c);
    } catch (e) { toast(e.message, 'bad'); b.disabled = false; }
  };
  const clr = $('#__twclr');
  if (clr) clr.onclick = async () => {
    const ok = await dlgConfirm('حذف مفتاح تويتر؟ سيتوقف جلب التغريدات.', 'تأكيد', true); if (!ok) return;
    try { await api('/api/admin/twitter', { method:'POST', body: { api_key: '' } }); toast('تم', 'ok'); renderAdminTwitter(c); } catch (e) { toast(e.message, 'bad'); }
  };
}

async function editNews(n) {
  const isNew = !n;
  const html = `
    <label class="fld"><span>العنوان</span><input type="text" id="__nt" value="${esc(n?.title || '')}" placeholder="مثال: تحديث جديد"></label>
    <label class="fld"><span>النوع</span>
      <select id="__nk">
        <option value="news" ${n?.kind==='news'?'selected':''}>خبر عام</option>
        <option value="update" ${n?.kind==='update'?'selected':''}>🆕 تحديث</option>
        <option value="maintenance" ${n?.kind==='maintenance'?'selected':''}>صيانة</option>
        <option value="warning" ${n?.kind==='warning'?'selected':''}>تحذير</option>
      </select>
    </label>
    <label class="fld"><span>المحتوى</span><textarea id="__nb" rows="6" placeholder="نص الخبر...">${esc(n?.body || '')}</textarea></label>
    <label class="fld"><span>صورة (رابط اختياري)</span><input type="text" id="__ni" value="${esc(n?.image || '')}" placeholder="https://..."></label>
    <div style="display:flex;gap:8px;margin-top:-8px;margin-bottom:8px"><button type="button" class="btn sm" id="__nimgUp">${IC.camera} رفع صورة</button><input type="file" id="__nimgFile" accept="image/*" style="display:none"></div>
    <div class="img-preview-box ${n?.image ? '' : 'empty'}" id="__nimgBox">${n?.image ? `<img src="${esc(n.image)}">` : '<div>لا صورة</div>'}</div>`;
  const r = await modal({ title: isNew ? 'خبر جديد' : 'تعديل الخبر', html, okText: isNew ? 'إضافة' : 'حفظ', wide: true,
    onReady: () => {
      $('#__nimgUp').onclick = () => $('#__nimgFile').click();
      $('#__nimgFile').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
        const fd = new FormData(); fd.append('file', f);
        try {
          const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
          const j = await res.json();
          if (!res.ok) throw new Error(j.error || 'فشل');
          $('#__ni').value = j.url;
          const box = $('#__nimgBox'); box.classList.remove('empty');
          box.innerHTML = `<img src="${esc(j.url)}">`;
          toast('تم الرفع', 'ok');
        } catch (err) { toast(err.message, 'bad'); }
      };
    }
  });
  if (!r) return;
  const body = {
    title: ($('#__nt')?.value || '').trim(),
    body: ($('#__nb')?.value || '').trim(),
    image: ($('#__ni')?.value || '').trim(),
    kind: $('#__nk')?.value || 'news',
  };
  if (!body.title) return toast('العنوان مطلوب', 'bad');
  try {
    if (isNew) await api('/api/admin/news', { method:'POST', body });
    else await api('/api/admin/news/' + n.id, { method:'PATCH', body });
    toast('تم الحفظ', 'ok');
    await loadAdminData();
    await loadNews();
    renderAdminContent();
  } catch (e) { toast(e.message, 'bad'); }
}

        applyGlass(Object.assign({}, gvals)); toast('تم حفظ الزجاج لكل الموقع', 'ok');
      } catch (e) { toast(e.message, 'bad'); }
    };
    $('#__gReset').onclick = () => { Object.assign(gvals, glassDefaults()); renderAdminAppearance(c); window.rlGlassVars(gvals); };
    $('#__uiSave').onclick = async () => {
      try {
        await api('/api/settings', { method:'POST', body:{ ui_mode_prompt: $('#__uiPrompt').checked ? '1' : '0', ui_default_mode: $('#__uiDef').value } });
        S.boot.ui_mode_prompt = $('#__uiPrompt').checked; S.boot.ui_default_mode = $('#__uiDef').value; toast('تم الحفظ', 'ok');
      } catch (e) { toast(e.message, 'bad'); }
    };
    $('#__laIns').onclick = () => { $('#__laCode').value = LOGIN_ANIM_PRESETS[+$('#__laPre').value].code; };
    $('#__laPrev').onclick = () => { const code = $('#__laCode').value; if (!code.trim()) return toast('الصق كود الانميشن أولاً', 'bad'); showIntroAnim(code, +$('#__laSecs').value || 3, true); };
    $('#__laSave').onclick = async () => {
      try {
        const code = $('#__laCode').value;
        await api('/api/admin/login-anim', { method:'POST', body:{ enabled: $('#__laOn').checked, code, secs: +$('#__laSecs').value || 3 } });
        if (S.me) S.me.login_anim = $('#__laOn').checked && !!code.trim();
        toast('تم حفظ انميشن الدخول', 'ok');
      } catch (e) { toast(e.message, 'bad'); }
    };
    $('#__laDel').onclick = async () => {
      const ok = await dlgConfirm('حذف كود الانميشن وإيقافه؟', 'تأكيد', true); if (!ok) return;

    };

  $('#__logoUp').onclick = () => $('#__logoFile').click();

    const f = e.target.files[0]; if (!f) return;
    if (f.size > 500 * 1024) return toast('أكبر من 500KB', 'bad');
    const fd = new FormData(); fd.append('file', f);
    try {
      const res = await fetch('/api/admin/site-logo', { method:'POST', body: fd, credentials:'include' });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || 'فشل');
      S.boot.site_logo = j.url; toast('تم الرفع', 'ok'); renderAdminAppearance(c);
    } catch (err) { toast(err.message, 'bad'); }
  };
  $('#__logoDel').onclick = async () => {
    const ok = await dlgConfirm('حذف الشعار؟', 'تأكيد', true); if (!ok) return;
    try { await api('/api/admin/site-logo', { method:'DELETE' }); S.boot.site_logo = ''; toast('تم', 'ok'); renderAdminAppearance(c); } catch (e) { toast(e.message, 'bad'); }
  };
  $$('#__themes .theme-item').forEach(item => {
    item.onclick = async () => {
      const tid = item.dataset.tid;
      try {
        await api('/api/settings', { method:'POST', body: { site_theme: tid } });
        S.settings.site_theme = tid; S.boot.theme = { id: tid };
        if (tid === 'custom') applyTheme({ c1: s.site_c1 || '#030508', c2: s.site_c2 || '#0a0f18', ac: s.site_ac || '#0b55ea' });
        else { const t = themeDefs.find(x => x.id === tid); if (t) applyTheme(t); }
        toast('تم التطبيق', 'ok'); renderAdminAppearance(c);
      } catch (e) { toast(e.message, 'bad'); }
    };
  });
  const sc = $('#__saveCustom');
  if (sc) sc.onclick = async () => {
    try {
      await api('/api/settings', { method:'POST', body: { site_c1: $('#__c1').value, site_c2: $('#__c2').value, site_ac: $('#__ac').value, site_theme: 'custom' } });
      applyTheme({ c1: $('#__c1').value, c2: $('#__c2').value, ac: $('#__ac').value });
      toast('تم', 'ok');
    } catch (e) { toast(e.message, 'bad'); }
  };
}

async function renderAdminAI(c) {
  await loadSettings();
  try { S.aiStatus = await api('/api/ai/status'); } catch (e) {}
  const s = S.settings;
  const st = S.aiStatus;
  const statusCls = st.available ? 'ok' : 'bad';
  const statusText = st.available
    ? 'Groq مفعّل — ' + st.model + (st.source === 'env' ? ' (من متغيرات البيئة)' : ' (من قاعدة البيانات)')
    : 'Groq غير مضبوط';
  c.innerHTML = `
    <div class="sec-h"><div class="sec-title">Groq AI <span>.</span></div></div>
    <div class="ai-status ${statusCls}">${st.available ? IC.check : IC.warn} ${esc(statusText)}</div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">إعدادات Groq</div>
      <label class="fld"><span>API Key ${st.source === 'env' ? '(محجوز - من متغيرات البيئة)' : ''}</span>
        <input type="password" id="__gkey" placeholder="gsk_..." ${st.source === 'env' ? 'disabled' : ''}>
      </label>
      <div class="mu" style="font-size:11.5px;margin-top:-6px;margin-bottom:12px">
        احصل على مفتاح من <a href="https://console.groq.com/keys" target="_blank" style="color:var(--blue)">console.groq.com</a>
      </div>
      <label class="fld"><span>الموديل</span>
        <select id="__gmodel">
          <option value="llama-3.3-70b-versatile" ${s.groq_model === 'llama-3.3-70b-versatile' ? 'selected' : ''}>Llama 3.3 70B (الأفضل)</option>
          <option value="llama-3.1-8b-instant" ${s.groq_model === 'llama-3.1-8b-instant' ? 'selected' : ''}>Llama 3.1 8B (أسرع)</option>
          <option value="mixtral-8x7b-32768" ${s.groq_model === 'mixtral-8x7b-32768' ? 'selected' : ''}>Mixtral 8x7B</option>
          <option value="gemma2-9b-it" ${s.groq_model === 'gemma2-9b-it' ? 'selected' : ''}>Gemma2 9B</option>
        </select>
      </label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="btn pri" id="__gsave">${IC.check} حفظ</button>
        <button class="btn" id="__gtest">${IC.sparkle} اختبار</button>
        ${st.source === 'db' ? `<button class="btn danger" id="__gclear">${IC.trash} حذف المفتاح</button>` : ''}
      </div>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">اختبار سريع</div>
      <label class="fld"><span>نص للتجربة</span>
        <textarea id="__gtestText" rows="3">الآن بث مباشر على قناة كيك، انضم للمشاهدة!</textarea>
      </label>
      <button class="btn ai wide" id="__gtestRun">${IC.ai} إعادة صياغة بـ Groq</button>
      <div class="tpl-preview" id="__gtestOut" style="display:none"></div>
    </div>`;
  $('#__gsave').onclick = async () => {
    const body = { model: $('#__gmodel').value };
    const key = $('#__gkey')?.value.trim();
    if (key && st.source !== 'env') body.api_key = key;
    try {
      await api('/api/admin/groq', { method:'POST', body });
      toast('تم الحفظ', 'ok'); await loadSettings(); renderAdminAI(c);
    } catch (e) { toast(e.message, 'bad'); }
  };
  $('#__gtest').onclick = async () => {
    try {
      const r = await api('/api/admin/groq', { method:'POST', body: { test: true } });
      if (r.test && r.test !== 'فشل الاختبار') { toast('Groq يعمل', 'ok'); }
      else { toast('فشل الاختبار', 'bad'); }
      renderAdminAI(c);
    } catch (e) { toast(e.message, 'bad'); }
  };
  const gc = $('#__gclear');
  if (gc) gc.onclick = async () => {
    const ok = await dlgConfirm('حذف مفتاح Groq؟', 'تأكيد', true); if (!ok) return;
    try { await api('/api/admin/groq', { method:'POST', body: { api_key: '' } }); toast('تم', 'ok'); renderAdminAI(c); } catch (e) { toast(e.message, 'bad'); }
  };
  const gr = $('#__gtestRun');
  if (gr) gr.onclick = async () => {
    const text = ($('#__gtestText')?.value || '').trim();
    if (!text) return toast('اكتب نص', 'bad');
    if (!st.available) return toast('Groq غير مضبوط', 'bad');
    gr.disabled = true; gr.textContent = 'جاري...';
    try {
      const r = await api('/api/ai/rewrite', { method:'POST', body: { text, prompt: '' } });
      const out = $('#__gtestOut');
      out.style.display = 'block';
      out.innerHTML = '<div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:var(--font-en)">AI OUTPUT</div>' + esc(r.text).replace(/\n/g, '<br>');
    } catch (e) { toast(e.message, 'bad'); }
    gr.disabled = false; gr.innerHTML = IC.ai + ' إعادة صياغة';
  };
}

      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">البوت</div>
      <label class="fld"><span>اسم البوت المخصص</span><input type="text" id="__bn" value="${esc(s.bot_name_custom||'')}"></label>
      <label class="fld"><span>رابط دعوة البوت</span><input type="text" id="__bi" value="${esc(s.bot_invite_url||'')}"></label>
      <label class="fld"><span>رابط البوت في تيليجرام (يظهر للمستخدمين في التعليمات)</span><input type="text" id="__btl" dir="ltr" value="${esc(s.bot_tg_link||'')}" placeholder="https://t.me/YourBot"></label>
      <div class="mu" style="font-size:11.5px;margin-top:-6px">${S.boot.bot_link ? 'الرابط الحالي: <span dir="ltr">' + esc(S.boot.bot_link) + '</span> — اتركه فارغاً ليُكتشف تلقائياً من التوكن.' : 'لم يُكتشف يوزر البوت تلقائياً — اكتب الرابط هنا يدوياً.'}</div>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">${ICN('mail')}رسائل تيليجرام</div>
      <label class="fld"><span>رسالة التحقق (لتوثيق القناة)</span>
        <textarea id="__ttv" rows="4" class="mono">${esc(s.tpl_tg_verify||'')}</textarea>
      </label>
      <div class="mu" style="font-size:11.5px;margin-top:-6px">المتغيرات: <code>{site_user}</code> <code>{chat_name}</code></div>
      <label class="fld"><span>رسالة النجاح (بعد توثيق القناة)</span>
        <textarea id="__tts" rows="4" class="mono">${esc(s.tpl_tg_success||'')}</textarea>
      </label>
      <label class="fld"><span>رسالة ربط الحساب (تحتوي رمز)</span>
        <textarea id="__ttl" rows="4" class="mono">${esc(s.tpl_tg_link||'')}</textarea>
      </label>
      <div class="mu" style="font-size:11.5px;margin-top:-6px">المتغير: <code>{code}</code></div>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">الحدود العامة والزوار</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <label class="fld"><span>حد كيك (المالك)</span><input type="number" id="__lk" value="${esc(s.lim_kick||'10')}"></label>
        <label class="fld"><span>حد يوتيوب (المالك)</span><input type="number" id="__ly" value="${esc(s.lim_yt||'5')}"></label>
        <label class="fld"><span>حد تيليجرام (المالك)</span><input type="number" id="__lt" value="${esc(s.lim_tg||'3')}"></label>
      </div>
      <label style="display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:800;cursor:pointer"><input type="checkbox" id="__gm" ${s.guest_mode==='1'?'checked':''}> السماح بالتصفح كزائر</label>
    </div>
    <button class="btn pri wide" id="adSaveSettings" style="margin-bottom:20px">${IC.check} حفظ الإعدادات</button>`;
  $('#adSaveSettings').onclick = async () => {
    try {
      await api('/api/settings', { method:'POST', body: {
        registration_enabled: $('#__regen').checked ? '1' : '0',
        default_lim_kick: $('#__dlk').value, default_lim_yt: $('#__dly').value, default_lim_tg: $('#__dlt').value,
        bonus_lim_kick: $('#__blk').value, bonus_lim_yt: $('#__bly').value, bonus_lim_tg: $('#__blt').value,
        default_lim_tw: $('#__dltw').value, bonus_lim_tw: $('#__bltw').value,
        required_channel_id: $('#__rchid').value.trim(), required_channel_name: $('#__rchnm').value.trim(),
        required_channel_url: $('#__rchurl').value.trim(), required_channel_msg: $('#__rchmsg').value.trim(),
        signup_welcome_title: $('#__swt').value.trim(), signup_welcome_text: $('#__swx').value.trim(),
        site_name: $('#__sn').value, site_sub: $('#__ss').value, hero_title: $('#__ht').value, hero_accent: $('#__ha').value, hero_text: $('#__hx').value,
        btn_kick: $('#__bk').value, btn_yt: $('#__by').value, btn_tg: $('#__btg').value, btn_discord: $('#__bdc').value, btn_tw: $('#__btw').value,
        tpl_kick: $('#__tk').value, tpl_yt: $('#__ty').value, tpl_discord: $('#__td').value, tpl_tw: $('#__ttw').value,
        tpl_tg_verify: $('#__ttv').value, tpl_tg_success: $('#__tts').value, tpl_tg_link: $('#__ttl').value,
        bot_name_custom: $('#__bn').value, bot_invite_url: $('#__bi').value, bot_tg_link: $('#__btl').value.trim(),
        lim_kick: $('#__lk').value, lim_yt: $('#__ly').value, lim_tg: $('#__lt').value,
        guest_mode: $('#__gm').checked ? '1' : '0',
      }});
      toast('تم الحفظ', 'ok'); await loadSettings();
      try { const bb = await api('/api/boot'); S.boot.bot_link = bb.bot_link; S.boot.bot_username = bb.bot_username; } catch (e2) {}
    } catch (e) { toast(e.message, 'bad'); }
  };
}

async function renderAdminSystem(c) {
  await loadSettings();
  const s = S.settings || {};
  const isMnt = s.maintenance === '1';
  const stats = S.admin.stats || {};
  c.innerHTML = `
    <div class="sec-h"><div class="sec-title">النظام <span>.</span></div></div>
    <div class="ad-user-card" style="${isMnt ? 'border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.05)' : ''}">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;gap:10px">${IC.wrench} وضع الصيانة ${isMnt ? '<span class="pill bad">مفعّل</span>' : '<span class="pill ok">معطّل</span>'}</div>
      <div class="mu" style="font-size:12.5px;line-height:1.7;margin-bottom:12px">
        ${ICN('check')}<b>لم يعد يقفل الموقع</b> — يظهر شريط تنبيه أحمر أعلى الصفحة للمستخدمين، وتُقيَّد عمليات الإضافة/الإرسال. المالك يمكنه العمل بحرية.
      </div>
      <label class="fld"><span>عنوان النافذة</span><input type="text" id="__mttl" value="${esc(s.maintenance_title||'صيانة مؤقتة')}"></label>
      <label class="fld"><span>نص الصيانة</span><textarea id="__mtxt" rows="3">${esc(s.maintenance_text||'الموقع في صيانة مؤقتة — نرجع قريباً')}</textarea></label>
      <button class="btn ${isMnt?'ghost':'pri'} wide" id="__mtoggle" style="margin-bottom:8px">${isMnt ? IC.x + ' إيقاف' : IC.check + ' تفعيل'}</button>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:8px">${IC.refresh} أدوات</div>
      <button class="btn ghost wide" id="__refreshDC" style="margin-bottom:8px">${IC.refresh} تحديث كاش ديسكورد</button>
      <button class="btn ghost wide" id="__setupWH">${IC.link} إعادة ضبط Webhook تيليجرام</button>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:10px">معلومات تيليجرام</div>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.9">
        Public URL: <b style="font-family:var(--font-en);color:var(--text)">${esc(stats.public_url || 'غير مضبوط')}</b><br>
        Webhook: <b style="color:${stats.webhook_set?'var(--green)':'var(--red)'}">${stats.webhook_set?'مفعّل':'غير مفعّل (يعمل polling)'}</b><br>
        قنوات معروفة للبوت: <b style="color:var(--purple)">${stats.tg_known||0}</b><br>
        <span class="mu" style="font-size:11.5px">لتفعيل Webhook أضف متغير <code>PUBLIC_URL</code> في Railway</span>
      </div>
    </div>`;
  $('#__mtoggle').onclick = async () => {
    try {
      const nv = !isMnt;
      await api('/api/admin/maintenance', { method:'POST', body: { enabled: nv, text: $('#__mtxt').value, title: $('#__mttl').value } });
      toast(nv ? 'تم تفعيل الصيانة' : 'تم إيقاف', 'ok');
      await loadSettings();
      S.maintenance = nv;
      renderAdminSystem(c);
    } catch (e) { toast(e.message, 'bad'); }
  };
  $('#__refreshDC').onclick = async () => {
    try { const r = await api('/api/discord/refresh', { method:'POST' }); toast('تم — ' + (r.channels||0) + ' روم', 'ok'); await loadFeeds(); } catch (e) { toast(e.message, 'bad'); }
  };
  $('#__setupWH').onclick = async () => {
    try { const r = await api('/api/telegram/setup-webhook', { method:'POST' }); toast(r.ok ? 'تم ضبط Webhook' : 'فشل: ' + (r.description || ''), r.ok ? 'ok' : 'bad'); } catch (e) { toast(e.message, 'bad'); }
  };
}

/* ═══ EVENT DELEGATION ═══ */
document.addEventListener('click', e => {
  const item = e.target.closest('.sug-item');
  if (item) {
    item.classList.toggle('on');
    const grid = item.closest('.sug-grid');
    if (grid) {
      const sel = grid.querySelectorAll('.sug-item.on').length;
      const counter = document.getElementById('sugCount');
      if (counter) counter.textContent = sel + ' محددة';
    }
    return;
  }
  const toggleAll = e.target.closest('#sugToggleAll');
  if (toggleAll) {
    const grid = document.getElementById('sugGrid');
    if (grid) {
      const items = grid.querySelectorAll('.sug-item');
      const allOn = Array.from(items).every(x => x.classList.contains('on'));
      items.forEach(x => x.classList.toggle('on', !allOn));
      const counter = document.getElementById('sugCount');
      if (counter) counter.textContent = (allOn ? 0 : items.length) + ' محددة';
    }
  }
});

window.addEventListener('popstate', () => {
  if (!isLogged()) return;
  if (isAdminPath() && isOwner()) { S.view = 'admin'; S.admin.tab = ''; }
  else if (S.view === 'admin') { S.view = 'home'; }
  else return;
  renderApp();
});

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') { const m = $('#modal'); if (m && m.classList.contains('on')) m.classList.remove('on'); }
});

console.log('[RL] all functions loaded, calling boot()...');
boot().catch(e => { console.error('[RL] boot error:', e); });
console.log('[RL] script end');
</script>
