<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030508">
<title>Respect Live</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0b55ea;--blue2:#1b67ff;--blue-rgb:11,85,234;
  --bg:#030508;--bg-2:#05070d;--panel:#0a0f18;
  --card:linear-gradient(155deg,#0d1320 0%,#050810 100%);
  --text:#f4f6fa;--text-2:#c8cfdd;--muted:#7c8799;--muted-2:#5a6473;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --blue-line:rgba(var(--blue-rgb),.28);--blue-line-2:rgba(var(--blue-rgb),.45);
  --green:#10b981;--red:#ef4444;--gold:#f5b400;--orange:#f59e0b;--purple:#8b5cf6;
  --glow-sm:0 0 20px rgba(var(--blue-rgb),.25);
  --glow:0 0 30px rgba(var(--blue-rgb),.35);
  --shadow-sm:0 4px 16px rgba(0,0,0,.35);
  --shadow:0 12px 34px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --font-ar:'Tajawal',system-ui,sans-serif;
  --font-en:'Orbitron',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,.61,.36,1);
  --r:20px;--r-sm:14px;--r-xs:10px;
  --pad:clamp(16px,5vw,28px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;touch-action:manipulation;}
html{scroll-behavior:smooth;background:var(--bg);-webkit-text-size-adjust:100%;}
/* إصلاح: زيادة المساحة السفلية لمنع تغطية الشريط للمحتوى */
body{background:var(--bg);color:var(--text);font-family:var(--font-ar);font-size:15px;line-height:1.7;min-height:100vh;overflow-x:hidden;padding-bottom:calc(140px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;position:relative;overscroll-behavior-y:none;}
body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background-image:linear-gradient(rgba(var(--blue-rgb),.035) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--blue-rgb),.035) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 95% 85% at 50% 35%,#000 35%,transparent 92%);mask-image:radial-gradient(ellipse 95% 85% at 50% 35%,#000 35%,transparent 92%)}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(circle at 10% 15%,rgba(var(--blue-rgb),.10),transparent 40%),radial-gradient(circle at 92% 68%,rgba(var(--blue-rgb),.08),transparent 42%),radial-gradient(circle at 50% 110%,rgba(var(--blue-rgb),.06),transparent 55%)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit;font-size:16px!important;}
img{display:block;max-width:100%}
svg{width:20px;height:20px;flex-shrink:0;display:inline-block;vertical-align:middle}
::selection{background:rgba(var(--blue-rgb),.35);color:#fff}
#splash{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(var(--blue-rgb),.20),transparent 62%),var(--bg);transition:opacity .75s var(--ease),transform .75s var(--ease)}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:26px}
.sp-logo{width:104px;height:104px;border-radius:28px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;box-shadow:0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.5);animation:spGlow 2.4s ease-in-out infinite;overflow:hidden}
.sp-logo img{width:100%;height:100%;object-fit:cover}
.sp-logo svg{width:52px;height:52px}
@keyframes spGlow{0%,100%{box-shadow:0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.45)}50%{box-shadow:0 0 0 26px rgba(var(--blue-rgb),0),0 20px 60px rgba(var(--blue-rgb),.6)}}
.sp-dots{display:flex;gap:9px}
.sp-dots i{width:10px;height:10px;border-radius:50%;background:var(--blue);animation:spBounce 1.5s ease-in-out infinite;box-shadow:0 0 12px rgba(var(--blue-rgb),.6)}
.sp-dots i:nth-child(2){animation-delay:.18s}
.sp-dots i:nth-child(3){animation-delay:.36s}
@keyframes spBounce{0%,80%,100%{transform:scale(.35);opacity:.35}40%{transform:scale(1);opacity:1}}
.sp-foot{font-family:var(--font-en);font-size:11px;letter-spacing:4px;font-weight:800;color:var(--muted);opacity:0;animation:fadeIn .8s .9s forwards}
@keyframes fadeIn{to{opacity:1}}
.page{display:none}
.page.on{display:block;animation:pageIn .45s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.top{position:sticky;top:0;z-index:50;padding:calc(14px + env(safe-area-inset-top)) var(--pad) 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(3,5,8,.94) 60%,rgba(3,5,8,0));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid transparent;transition:border-color .3s ease,background .3s ease}
.top.scrolled{border-bottom-color:var(--line);background:linear-gradient(rgba(3,5,8,.97) 90%,rgba(3,5,8,.85))}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.brand-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;flex-shrink:0;box-shadow:0 0 16px rgba(var(--blue-rgb),.42);overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-logo svg{width:22px;height:22px;color:#fff}
.brand-txt{min-width:0}
.brand-name{font-family:var(--font-en);font-size:15px;font-weight:900;letter-spacing:2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name span{color:var(--blue);text-shadow:var(--glow-sm)}
.brand-sub{font-family:var(--font-en);font-size:9px;font-weight:800;letter-spacing:2px;color:var(--muted);margin-top:2px}
.hdr-acts{display:flex;align-items:center;gap:8px}
.hdr-btn{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--text);transition:.22s var(--ease-soft)}
.hdr-btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.hdr-btn:active{transform:scale(.95)}
.hdr-btn svg{width:19px;height:19px}
.hdr-btn .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg);font-family:var(--font-en);line-height:1}
.avatar-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;font-family:var(--font-en);font-weight:900;font-size:15px;cursor:pointer;position:relative;flex-shrink:0;box-shadow:0 0 16px rgba(var(--blue-rgb),.42);transition:.22s var(--ease-soft);overflow:hidden}
.avatar-btn img{width:100%;height:100%;object-fit:cover}
.avatar-btn:hover{transform:scale(1.06)}
.avatar-btn:active{transform:scale(.95)}
.avatar-btn .st{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.avatar-btn.guest{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);box-shadow:none}
.avatar-btn.guest svg{width:19px;height:19px}

/* إصلاح: الشريط السفلي */
.tabbar{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94%,500px);height:68px;background:rgba(10,15,24,.98);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line-2);border-radius:36px;display:flex;justify-content:space-around;align-items:center;z-index:999;padding:0 8px;box-shadow:0 20px 44px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}
.tabbar button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative;transition:.28s var(--ease-soft)}
.tabbar button svg{width:22px;height:22px;color:currentColor;transition:.28s var(--ease-soft)}
.tabbar button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.tabbar button:active{transform:scale(.92)}
.tabbar button.on{color:var(--blue2)}
.tabbar button.on svg{transform:translateY(-2px) scale(1.15);filter:drop-shadow(0 0 8px var(--blue))}
.tabbar button.on::after{content:"";position:absolute;bottom:0px;left:50%;transform:translateX(-50%);width:20px;height:3px;background:var(--blue);border-radius:3px;box-shadow:var(--glow-sm)}

.mnt-banner{position:fixed;top:0;left:0;right:0;z-index:2000;padding:12px 16px;background:linear-gradient(90deg,rgba(239,68,68,.96),rgba(220,38,38,.96));color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(239,68,68,.4);animation:mntSlideDown .4s var(--ease)}
@keyframes mntSlideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.mnt-banner svg{width:18px;height:18px;flex-shrink:0}
.mnt-banner b{font-family:var(--font-en);letter-spacing:1px}
.mnt-banner small{opacity:.9;font-weight:600;font-size:11.5px}
.login-page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;position:relative;animation:pageIn .6s var(--ease) both}
.login-card{position:relative;width:min(430px,100%);padding:38px 30px 32px;background:var(--card);border:1px solid var(--line-2);border-radius:26px;box-shadow:var(--shadow-lg),0 0 80px rgba(var(--blue-rgb),.10)}
.login-card::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);box-shadow:var(--glow);border-radius:2px}
.login-logo{width:92px;height:92px;border-radius:26px;margin:0 auto 20px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;box-shadow:0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.45);animation:spGlow 2.6s infinite;overflow:hidden}
.login-logo img{width:100%;height:100%;object-fit:cover}
.login-logo svg{width:46px;height:46px}
.login-head{text-align:center;margin-bottom:20px}
.login-head h1{font-family:var(--font-en);font-size:22px;letter-spacing:3px;font-weight:900;margin-bottom:8px}
.login-head h1 span{color:var(--blue);text-shadow:var(--glow-sm)}
.login-head p{color:var(--muted);font-size:12.5px;letter-spacing:.3px}
.auth-tabs{display:flex;gap:6px;margin-bottom:20px;padding:5px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px}
.auth-tabs button{flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:900;color:var(--muted);transition:.22s var(--ease-soft)}
.auth-tabs button.on{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(var(--blue-rgb),.35)}
.fld{display:block;margin:14px 0}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:9px;font-weight:800;letter-spacing:.3px}
input[type="text"],input[type="password"],input[type="number"],input[type="email"],input[type="search"],input[type="url"],textarea,select{-webkit-appearance:none;appearance:none;display:block;width:100%;font-family:inherit;font-weight:600;color:var(--text);background:rgba(5,8,16,.85);border:1.5px solid var(--line-2);border-radius:14px;padding:14px 16px;min-height:52px;line-height:1.4;transition:border-color .22s var(--ease-soft),box-shadow .22s var(--ease-soft),background .22s var(--ease-soft);outline:none}
input::placeholder,textarea::placeholder{color:var(--muted-2);font-weight:500}
input:hover,textarea:hover,select:hover{border-color:var(--line-2)}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:rgba(8,12,22,.9);box-shadow:0 0 0 4px rgba(var(--blue-rgb),.14),0 0 20px rgba(var(--blue-rgb),.20)}
textarea{resize:vertical;min-height:110px;line-height:1.7;font-family:inherit}
textarea.mono{font-family:monospace;direction:ltr;text-align:left}
select{cursor:pointer;background-image:none}
select option{background:var(--panel);color:var(--text)}
input[type="checkbox"]{-webkit-appearance:checkbox;appearance:checkbox;width:20px;height:20px;min-height:auto;padding:0;accent-color:var(--blue);cursor:pointer;display:inline-block;vertical-align:middle}
.err{color:#f87171;font-size:12.5px;text-align:center;min-height:20px;margin-top:12px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--line-2);color:var(--text);font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.22s var(--ease-soft);position:relative;overflow:hidden;min-height:48px}
.btn:hover{transform:translateY(-1px);border-color:var(--blue)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 28px rgba(var(--blue-rgb),.30)}
.btn.pri:hover{background:var(--blue2);box-shadow:0 14px 38px rgba(var(--blue-rgb),.45)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#dc2626}
.btn.ghost{background:transparent}
.btn.ai{background:linear-gradient(135deg,#8b5cf6,#6366f1);border-color:#8b5cf6;color:#fff}
.btn.ai:hover{box-shadow:0 14px 38px rgba(139,92,246,.5)}
.btn.sm{padding:9px 14px;font-size:12px;border-radius:11px;min-height:auto}
.btn.wide{width:100%;padding:15px}
.btn svg{width:15px;height:15px;flex-shrink:0}
.hero{padding:42px var(--pad) 32px;text-align:center;position:relative;animation:pageIn .55s var(--ease) both}
.hero-lbl{font-family:var(--font-en);font-size:11px;font-weight:900;letter-spacing:4px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:9px}
.hero-lbl span{color:var(--blue);font-size:14px;text-shadow:var(--glow-sm)}
.hero h1{font-family:var(--font-en);font-size:clamp(36px,9vw,64px);line-height:.92;letter-spacing:4px;font-weight:900;margin:22px 0 14px}
.hero h1 span{color:var(--blue);display:inline-block;transform:skewX(-8deg);text-shadow:var(--glow)}
.hero p{color:var(--muted);font-size:13.5px;max-width:560px;margin:0 auto;line-height:1.85;font-weight:500}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px var(--pad);animation:pageIn .6s var(--ease) .1s both}
@media(max-width:640px){.features{grid-template-columns:1fr}}
.feat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;transition:.28s var(--ease-soft);position:relative;overflow:hidden}
.feat:hover{transform:translateY(-3px);border-color:var(--blue-line);box-shadow:0 12px 34px rgba(var(--blue-rgb),.14)}
.feat-ico{width:56px;height:56px;border-radius:16px;background:rgba(var(--blue-rgb),.12);border:1px solid var(--blue-line);display:grid;place-items:center;color:var(--blue);margin:0 auto 14px}
.feat-ico svg{width:26px;height:26px}
.feat b{display:block;font-size:15px;font-weight:900;margin-bottom:6px}
.feat p{color:var(--muted);font-size:12.5px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:24px var(--pad);animation:pageIn .6s var(--ease) .15s both}
.stats .s{background:var(--panel);padding:18px 8px;text-align:center;transition:.24s var(--ease-soft)}
.stats .s:hover{background:rgba(var(--blue-rgb),.06)}
.stats .s b{display:block;font-family:var(--font-en);font-size:26px;font-weight:900;line-height:1;color:var(--text)}
.stats .s b.blue{color:var(--blue);text-shadow:var(--glow-sm)}
.stats .s small{display:block;font-family:var(--font-en);font-size:10px;font-weight:800;color:var(--muted);margin-top:6px;letter-spacing:1.5px}
@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}.stats .s:nth-child(4),.stats .s:nth-child(5){display:none}}
.live-strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * var(--pad));padding:4px var(--pad) 10px}
.live-strip::-webkit-scrollbar{display:none}
.live-card{flex:0 0 260px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.28s var(--ease-soft);position:relative}
.live-card:hover{border-color:var(--blue-line);transform:translateY(-2px)}
.live-card-cover{height:120px;background:linear-gradient(135deg,rgba(var(--blue-rgb),.3),rgba(0,0,0,.5));position:relative;overflow:hidden}
.live-card-cover img{width:100%;height:100%;object-fit:cover}
.live-card-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(3,5,8,.92))}
.live-card-body{padding:0 14px 14px;margin-top:-20px;position:relative;z-index:2}
.live-card-body b{display:block;font-size:14px;font-weight:900;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-card-body small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-card-body .v{color:#f87171;font-family:var(--font-en);font-weight:900;font-size:11px}
.sec{padding:22px var(--pad);animation:pageIn .45s var(--ease) both}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.sec-title{font-size:22px;font-weight:900;letter-spacing:.2px}
.sec-title span{color:var(--blue);transform:skewX(-8deg);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.ch{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:transform .32s var(--ease-soft),border-color .32s ease,box-shadow .32s ease;isolation:isolate}
.ch::after{content:"";position:absolute;inset:-40px;background-image:var(--ch-brand,none);background-size:cover;background-position:center;filter:blur(50px) saturate(1.8);opacity:.18;pointer-events:none;z-index:0;border-radius:var(--r)}
.ch:hover{transform:translateY(-3px);border-color:var(--blue-line);box-shadow:0 18px 44px rgba(var(--blue-rgb),.16)}
.ch>.ch-cover,.ch>.ch-head,.ch>.ch-acts{position:relative;z-index:1}
.ch-cover{height:118px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(var(--blue-rgb),.28),rgba(0,0,0,.5))}
.ch-cover img{width:100%;height:100%;object-fit:cover;transition:transform .55s var(--ease-soft)}
.ch:hover .ch-cover img{transform:scale(1.05)}
.ch-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(3,5,8,.92))}
.ch-badge{position:absolute;top:12px;right:12px;z-index:3;font-size:10.5px;padding:5px 11px;border-radius:9px;font-weight:900;font-family:var(--font-en);letter-spacing:.5px;display:inline-flex;align-items:center;gap:5px}
.ch-badge.live{background:var(--red);color:#fff;animation:chPulse 1.9s infinite}
.ch-badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.ch-badge.off{background:rgba(255,255,255,.14);color:var(--text);backdrop-filter:blur(8px)}
.ch-badge.nosend{background:rgba(245,158,11,.9);color:#fff;backdrop-filter:blur(8px);top:auto;bottom:12px;right:12px}
.ch-badge.verified{background:rgba(16,185,129,.95);color:#fff;top:12px;left:12px;right:auto}
@keyframes chPulse{70%{box-shadow:0 0 0 12px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.ch-head{display:flex;align-items:flex-end;gap:12px;padding:0 18px;margin-top:-28px;position:relative;z-index:2}
.ch-head img{width:56px;height:56px;border-radius:15px;object-fit:cover;border:3px solid var(--bg);background:var(--panel);flex-shrink:0;box-shadow:0 0 16px rgba(var(--blue-rgb),.35)}
.ch-head .ph{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;border:3px solid var(--bg);flex-shrink:0;color:#fff}
.ch-head .ph svg{width:26px;height:26px}
.ch-info{flex:1;min-width:0;padding-bottom:2px}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtTime = ts => {
  if (!ts) return '';
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return 'الآن';
  if (d < 3600) return 'قبل ' + Math.floor(d/60) + ' دقيقة';
  if (d < 86400) return 'قبل ' + Math.floor(d/3600) + ' ساعة';
  if (d < 604800) return 'قبل ' + Math.floor(d/86400) + ' يوم';
  return new Date(ts*1000).toLocaleDateString('ar-EG');
};

async function api(path, opts={}) {
  const o = { credentials:'include', method: opts.method || 'GET', headers: {} };
  if (opts.body !== undefined) { o.headers['content-type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  if (opts.form) o.body = opts.form;
  try {
    const r = await fetch(path, o);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const err = new Error(j.error || j.detail || 'خطأ في الاتصال'); err.status = r.status; throw err; }
    return j;
  } catch (e) { throw e; }
}

function toast(msg, kind) {
  const t = el('div', 'toast ' + (kind || ''));
  const icon = kind === 'ok' ? IC.check : kind === 'bad' ? IC.x : IC.info;
  t.innerHTML = icon + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(t);
  requestAnimationFrame(() => t.classList.add('on'));
  setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 400); }, 3600);
}

function modal(opts) {
  return new Promise(resolve => {
    const m = $('#modal'), sh = $('#sheet');
    sh.className = 'sheet' + (opts.small ? ' sm' : '') + (opts.wide ? ' wide' : '') + (opts.xwide ? ' xwide' : '');
    
    let html = '<div class="grab"></div>';
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px">`;
    html += `<div>`;
    if (opts.title) html += '<div class="sh-title">' + esc(opts.title) + '</div>';
    if (opts.sub) html += '<div class="sh-sub" style="margin-bottom:0">' + esc(opts.sub) + '</div>';
    html += `</div>`;
    if (opts.cancel !== false) html += `<button class="btn sm ghost" id="__mc" type="button" style="flex-shrink:0">${esc(opts.cancelText || 'إلغاء')}</button>`;
    html += `</div>`;

    if (opts.html) html += opts.html;
    if (opts.input) html += '<label class="fld"><span>' + esc(opts.inputLabel||'') + '</span><input type="text" id="__mi" value="' + esc(opts.inputValue||'') + '" placeholder="' + esc(opts.placeholder||'') + '"></label>';
    html += '<div class="row" style="justify-content:flex-end;margin-top:20px">';
    html += '<button class="btn ' + (opts.danger ? 'danger' : opts.ai ? 'ai' : 'pri') + '" id="__mo" type="button" style="min-width:120px">' + esc(opts.okText || 'تأكيد') + '</button></div>';
    
    sh.innerHTML = html;
    m.classList.add('on');
    const close = v => { m.classList.remove('on'); setTimeout(() => resolve(v), 320); };
    const okBtn = $('#__mo'), cBtn = $('#__mc');
    if (okBtn) okBtn.onclick = () => close(opts.input ? ($('#__mi').value || '') : true);
    if (cBtn) cBtn.onclick = () => opts.input ? close(null) : close(false);
    m.onclick = e => { if (e.target === m) close(opts.input ? null : false); };
    if (opts.input) setTimeout(() => { const i = $('#__mi'); if (i) i.focus(); }, 200);
    if (opts.onReady) setTimeout(opts.onReady, 60);
  });
}
const dlgConfirm = (msg, title, danger) => modal({ title: title || 'تأكيد', sub: msg, danger, okText:'تأكيد' });

const isOwner = () => S.me && S.me.user && S.me.user.role === 'owner';
const isLogged = () => !!(S.me && S.me.user);
const canDiscord = () => isLogged() && (isOwner() || !!S.me.user.can_discord);
const canWrite = () => isOwner() || !S.maintenance;

// إصلاح: إجبار الموقع على استخدام اللون الأزرق الافتراضي وتجاهل أي ثيم قديم محفوظ
function applyTheme(theme) {
  const root = document.documentElement.style;
  // الألوان الافتراضية الصحيحة
  root.setProperty('--bg', '#030508');
  root.setProperty('--panel', '#0a0f18');
  root.setProperty('--blue', '#0b55ea');
  root.setProperty('--blue2', '#1b67ff');
  root.setProperty('--blue-rgb', '11,85,234');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', '#030508');
}

async function boot() {
  try {
    const b = await api('/api/boot');
    S.boot = b;
    S.maintenance = !!b.maintenance;
    document.title = b.site_name || 'Respect Live';
    const sf = $('#spFoot'); if (sf) sf.textContent = (b.site_sub || 'STREAM MONITOR').toUpperCase();
    const sp = $('#spLogo');
    if (sp && b.site_logo) sp.innerHTML = '<img src="' + esc(b.site_logo) + '" alt="">';
    applyTheme(); // فرض الثيم الافتراضي
  } catch (e) {
    S.boot = { site_name:'Respect Live', site_sub:'STREAM MONITOR', guest_mode:true, guest_blur:14, has_telegram:false, has_push:false, has_groq:false, has_twitter:false };
  }
  try {
    const me = await api('/api/me');
    S.me = me;
    S.maintenance = !!me.maintenance;
    await loadAll();
    await checkPushStatus();
    renderApp();
    setTimeout(() => { if (S.newsUnread > 0) showNewsPopup(); }, 800);
  } catch (e) {
    S.guest = true;
    if (S.boot.guest_mode) { await loadPreview(); renderApp(); }
    else { renderAuth(); }
  }
  setTimeout(() => {
    const sp = $('#splash');
    if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 900); }
  }, 1300);
}

async function loadAll() {
  await Promise.all([loadChannels('kick'), loadChannels('yt'), loadChannels('tg'), loadChannels('twitter'), loadNotifs(), loadSettings(), loadHomeStats(), loadNews()]);
  if (canDiscord()) await loadFeeds();
  try { S.aiStatus = await api('/api/ai/status'); } catch (e) {}
}
async function loadPreview() {
  try { S.preview = await api('/api/guest-preview'); }
  catch (e) { S.preview = { counts:{ kick:0, yt:0, tg:0, tw:0 }, live:[] }; }
}
async function loadChannels(kind) {
  try {
    const r = await api('/api/channels/' + kind);
    S.channels[kind] = r.rows || [];
    if (r.limits) S.limits[kind] = r.limits;
  } catch (e) { S.channels[kind] = []; }
}
async function loadFeeds() {
  if (!canDiscord()) { S.feeds = []; return; }
  try {
    const r = await api('/api/discord/feeds');
    S.feeds = r.rows || [];
    S.knownChannels = r.known_channels || {};
    S.knownGuilds = r.guilds || {};
    S.watching = r.watching || [];
    S.autoDiscovery = !!r.auto_discovery;
    S.botReady = !!r.bot_ready;
    S.botInfo = r.bot_info || {};
    S.myTgs = r.my_tgs || [];
    S.isOwnerView = !!r.is_owner;
  } catch (e) { S.feeds = []; S.knownChannels = {}; S.knownGuilds = {}; S.isOwnerView = false; }
}
async function loadBots() {
  if (!canDiscord()) { S.knownBots = []; return; }
  try { const r = await api('/api/discord/bots'); S.knownBots = r.rows || []; }
  catch (e) { S.knownBots = []; }
}
async function loadNotifs() {
  try { const r = await api('/api/notifs'); S.notifs = r.rows || []; S.unread = r.unread || 0; updateBadge(); }
  catch (e) { S.notifs = []; S.unread = 0; }
}
async function loadSettings() {
  try { S.settings = await api('/api/settings'); } catch (e) { S.settings = {}; }
}
async function loadHomeStats() {
  try { S.homeStats = await api('/api/home-stats'); } catch (e) { S.homeStats = null; }
}
async function loadNews() {
  try { const r = await api('/api/news'); S.news = r.rows || []; S.newsUnread = r.unread_count || 0; }
  catch (e) { S.news = []; S.newsUnread = 0; }
}
function updateBadge() {
  const b = $('#notifBadge'); if (!b) return;
  if (S.unread > 0) { b.textContent = S.unread > 99 ? '99+' : S.unread; b.style.display = 'grid'; }
  else b.style.display = 'none';
}

      fd.append('password', form.p.value);
      if (isReg && form.d) fd.append('display', form.d.value.trim());
      const endpoint = isReg ? '/api/register' : '/api/login';
      const body = isReg ? fd : new FormData();
      if (!isReg) { body.append('u', form.u.value.trim()); body.append('p', form.p.value); }
      const r = await fetch(endpoint, { method:'POST', body, credentials:'include' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || j.detail || (isReg ? 'فشل التسجيل' : 'فشل الدخول'));
      if (isReg && j.message) {
        try { sessionStorage.setItem('rl_welcome', j.message); } catch (e) {}
      }
      location.reload();
    } catch (e2) { err.textContent = e2.message; toast(e2.message, 'bad'); btn.disabled = false; }
  };
  const skip = $('#skipBtn');
  if (skip) skip.onclick = async () => { S.guest = true; await loadPreview(); renderApp(); };
}

function renderView() {
  const v = $('#view'); if (!v) return;
  if (S.view === 'home') return viewHome(v);
  if (S.view === 'notifs') return viewNotifs(v);
  if (S.view === 'news') return viewNews(v);
  if (S.view === 'dc') { if (!canDiscord()) { S.view = 'home'; return renderView(); } return viewDiscord(v); }
  if (S.view === 'admin') return openAdmin();
  if (S.view === 'account') return viewAccount(v);
  return viewChannels(v, S.view);
}

async function changeProfileAvatar() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
    const fd = new FormData(); fd.append('file', f);
    try {
      const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || 'فشل');
      await api('/api/me/profile', { method:'PATCH', body: { avatar: j.url } });
      S.me.user.avatar = j.url; toast('تم تحديث الصورة', 'ok'); renderApp();
    } catch (e) { toast(e.message, 'bad'); }
  };
  inp.click();
}

async function changeProfileDisplay() {
  const cur = S.me.user.display || S.me.user.username;
  const nv = await modal({ title: 'تعديل الاسم', input: true, inputLabel: 'الاسم', inputValue: cur, okText: 'حفظ' });
  if (nv === null || !nv.trim()) return;
  try {
    await api('/api/me/profile', { method:'PATCH', body: { display: nv.trim() } });
    S.me.user.display = nv.trim(); toast('تم', 'ok'); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

async function doLogout() {
  const ok = await dlgConfirm('تسجيل الخروج؟', 'تأكيد', true); if (!ok) return;
  try { await api('/api/logout', { method:'POST' }); } catch (e) {}
  location.reload();
}

async function openSuggestion() {
  const r = await modal({ title:'إرسال اقتراح', html:'<label class="fld"><span>نص الاقتراح</span><textarea id="__sg" rows="6" maxlength="1000"></textarea></label>', okText:'إرسال' });
  if (!r) return;
  const text = ($('#__sg')?.value || '').trim();
  if (!text) return toast('اكتب نص', 'bad');
  try { await api('/api/suggestions', { method:'POST', body: { text } }); toast('تم الإرسال', 'ok'); }
  catch (e) { toast(e.message, 'bad'); }
}

        <button type="button" class="btn ghost danger" id="__tglUnlink">${IC.x} إلغاء الربط</button>
      </div>`;
    const r = await modal({ title:'حساب تيليجرام مربوط', html, okText:'تم', cancel:false,
      onReady: () => {
        $('#__tglCheck').onclick = async () => {
          try {
            const res = await api('/api/link-tg/refresh-membership', { method:'POST' });

            renderApp();
          } catch (e) { toast(e.message, 'bad'); }
        };

          try { await api('/api/link-tg/unlink', { method:'POST' }); toast('تم الإلغاء', 'ok'); await loadMe(); const m = $('#modal'); if (m) m.classList.remove('on'); renderApp(); }
          catch (e) { toast(e.message, 'bad'); }
        };
      }
    });
    return;
  }
  
  const html = `
    <div style="padding:16px;background:rgba(var(--blue-rgb),.06);border:1px solid var(--blue-line);border-radius:14px;margin-bottom:20px;font-size:13px;line-height:1.8;text-align:center;">
      <b style="color:var(--blue);display:block;margin-bottom:8px;font-size:15px">${IC.link} ربط سريع وآمن</b>
      <span class="mu">سنقوم بتوجيهك إلى البوت في تيليجرام. بمجرد ضغط "Start"، سيتم ربط حسابك تلقائياً في الموقع!</span>
    </div>
    <button type="button" class="btn pri wide" id="__tgGo" style="padding:16px;font-size:15px">${IC.tg} فتح البوت وربط الحساب</button>
    <div id="__tgStatus" style="text-align:center;margin-top:16px;font-size:13px;font-weight:800;color:var(--muted);display:none">
      <div class="tgv-spinner" style="margin:0 auto 8px"></div>
      بانتظار الربط...
    </div>
  `;
  
  await modal({ 
    title:'ربط حساب تيليجرام', 
    sub:'للحصول على صلاحيات مضاعفة', 
    html, 
    okText:'إغلاق', 
    cancelText:'إلغاء',
    wide: true,
    onReady: () => {
      let pollInterval = null;
      $('#__tgGo').onclick = async () => {
        try {
          const res = await api('/api/link-tg/deeplink', { method:'POST' });
          window.open(res.url, '_blank');
          
          $('#__tgGo').style.display = 'none';
          $('#__tgStatus').style.display = 'block';
          
          pollInterval = setInterval(async () => {
            try {
              const check = await api('/api/link-tg/check/' + res.token);
              if (check.status === 'used') {
                clearInterval(pollInterval);
                await loadMe();
                renderApp();
                const m = $('#modal'); if (m) m.classList.remove('on');
                if (check.is_member) {
                  toast('🎉 تم الربط والعضوية مؤكدة — صلاحياتك مضاعفة!', 'ok');

                }
              }
            } catch (err) {}
          }, 3000);
          
        } catch (e) { toast(e.message, 'bad'); }
      };
      
      const observer = new MutationObserver((mutations) => {
        if (!$('#modal').classList.contains('on')) {
          if (pollInterval) clearInterval(pollInterval);
          observer.disconnect();
        }
      });
      observer.observe($('#modal'), { attributes: true, attributeFilter: ['class'] });
    }
  });
}

    await Promise.all([loadChannels('kick'), loadChannels('yt'), loadChannels('tg'), loadChannels('twitter')]);

      <div class="tg-pick-grid" id="__usList">${usersHTML}</div>` : ''}`;
  const result = await modal({
    title: 'إرسال رسالة', sub: 'أرسل لقنوات TG أو المستخدمين',
    html, okText: 'إرسال', wide: true,
    onReady: () => {
      $('#__imgUp').onclick = () => $('#__imgFile').click();
      $('#__imgFile').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
        const fd = new FormData(); fd.append('file', f);
        try {
          const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
          const j = await res.json();
          if (!res.ok) throw new Error(j.error || 'فشل');
          $('#__img').value = j.url; toast('تم الرفع', 'ok');
        } catch (err) { toast(err.message, 'bad'); }
      };
      $$('#__tgList .tg-pick-item,#__usList .tg-pick-item').forEach(item => {
        item.onclick = (e) => {
          if (e.target.tagName === 'INPUT') return;
          const cb = item.querySelector('input[type="checkbox"]');
          cb.checked = !cb.checked;
          item.classList.toggle('on', cb.checked);
        };
      });
    }
  });
  if (!result) return;
  const text = ($('#__txt')?.value || '').trim();
  const image = ($('#__img')?.value || '').trim();
  const btnT = ($('#__btnT')?.value || '').trim();
  const btnU = ($('#__btnU')?.value || '').trim();
  if (!text && !image) return toast('اكتب نص أو ارفع صورة', 'bad');
  const body = {
    text, image, btn_text: btnT, btn_url: btnU,
    tg: { mode: (document.querySelector('input[name=tgm]:checked') || {}).value || 'none', ids: $$('#__tgList input[data-tg]:checked').map(x => +x.dataset.tg) },
    users: { mode: (document.querySelector('input[name=usm]:checked') || {}).value || 'none', ids: $$('#__usList input[data-user]:checked').map(x => +x.dataset.user) },
  };
  try {
    const res = await api('/api/send', { method:'POST', body });
    const r = res.result || {};
    let msg = [];
    if (r.tg_sent || r.tg_failed) msg.push('TG: ' + r.tg_sent + ' ✓ / ' + r.tg_failed + ' ✗');
    if (r.users) msg.push('المستخدمون: ' + r.users);
    toast(msg.join(' · ') || 'تم', 'ok');
  } catch (e) { toast(e.message, 'bad'); }
}

      <div class="if"><b>${esc(t.name)}</b><small>${esc(t.username || '')}</small></div>

async function editFeed(f) {

  let keywordRules = [];
  try { keywordRules = JSON.parse(f.keyword_rules || '[]'); } catch (e) {}

    <label class="bot-item ${ignoreBots.indexOf(b.id) >= 0 ? 'on' : ''}">

      <div class="if"><b>${esc(b.name||b.id)}</b><small>ID: ${esc(b.id)} · ${b.seen_count || 0} رسالة</small></div>

  const kwHTML = `
    <div id="__kwList">${keywordRules.map((rule, idx) => renderKwRule(rule, idx)).join('')}</div>
    <button type="button" class="btn sm" id="__addKw" style="margin-top:10px">${IC.plus} إضافة قاعدة صورة</button>`;
  const html = `
    <div class="switch-row">
      <div class="sw-txt"><b>نسخ الأصل (بدون قالب)</b><small>يستخدم نص الرسالة الأصلي مباشرة</small></div>
      <label class="sw"><input type="checkbox" id="__useOrig" ${f.use_original !== 0 ? 'checked' : ''}><i></i></label>
    </div>
    <label class="fld"><span>القالب (يُستخدم إذا لم يفعل "نسخ الأصل")</span>
      <textarea id="__tp" rows="5" class="mono">${esc(f.template || '')}</textarea></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px;margin-bottom:10px">
      <span class="mu" style="font-size:11.5px">المتغيرات:</span>
      <span class="pill">{author_no_at}</span><span class="pill">{content}</span>
      <span class="pill">{title}</span><span class="pill">{description}</span>
      <span class="pill">{channel}</span><span class="pill">{url}</span>
    </div>
    <label class="fld"><span>نص الزر</span><input type="text" id="__bt" value="${esc(f.btn_text || 'عرض الروم')}"></label>
    <label class="fld"><span>رابط الزر المخصص (اختياري)</span>
      <input type="text" id="__ru" value="${esc(f.room_url || '')}" placeholder="https://discord.com/channels/..."></label>
    <label class="fld"><span>صورة ثابتة (اختياري)</span>
      <input type="text" id="__fi" value="${esc(f.fixed_image || '')}" placeholder="https://..."></label>
    <label class="fld" style="margin-top:20px"><span>قواعد الصور بالكلمات المفتاحية</span></label>
    <div class="mu" style="font-size:11.5px;margin-bottom:8px">لو الرسالة تحتوي الكلمة → يستبدل الصورة المرفقة بالصورة المحددة</div>
    ${kwHTML}
    <label class="fld" style="margin-top:20px"><span>البوتات المستثناة (لن يقرأ رسائلها)</span></label>
    <div class="bot-list" id="__botList">${botListHTML}</div>
    <div class="switch-row" style="margin-top:20px">
      <div class="sw-txt"><b>AI Rewrite (Groq)</b><small>يعيد صياغة الرسالة قبل الإرسال</small></div>
      <label class="sw"><input type="checkbox" id="__useAi" ${f.use_ai ? 'checked' : ''} ${!S.aiStatus.available ? 'disabled' : ''}><i></i></label>
    </div>
    <label class="fld"><span>AI Prompt (اختياري)</span>
      <textarea id="__aiPrompt" rows="3" placeholder="أعد صياغة الرسالة بأسلوب إخباري موجز...">${esc(f.ai_prompt || '')}</textarea></label>
    ${!S.aiStatus.available ? '<div class="ai-status warn">⚠️ Groq غير مضبوط — أضف API key من لوحة التحكم</div>' : ''}
    <div class="tpl-preview" id="__tplPrev"></div>`;
  const r = await modal({
    title: 'تخصيص الربط', sub: 'كل الإعدادات المخصصة لهذا الروم',
    html, okText: 'حفظ', xwide: true,
    onReady: () => {
      const ta = $('#__tp'), prev = $('#__tplPrev');
      const update = () => {
        const tpl = ta.value.trim() || '<b>{author_no_at}</b>\n\n<b>{content}</b>';
        const sample = tpl
          .replace(/\{name\}/g, 'DRB7H').replace(/\{author\}/g, 'DRB7H').replace(/\{author_no_at\}/g, 'DRB7H')
          .replace(/\{content\}/g, '🔥🔥 محتوى')
          .replace(/\{title\}/g, 'اسم المقطع').replace(/\{description\}/g, 'الوصف')
          .replace(/\{channel\}/g, 'twitter').replace(/\{url\}/g, 'https://...');
        prev.innerHTML = '<div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:var(--font-en)">PREVIEW</div>' + sample.replace(/\n/g, '<br>');
      };
      ta.oninput = update; update();
      $$('#__botList .bot-item').forEach(item => {
        item.onclick = () => {
          const cb = item.querySelector('input[type="checkbox"]');
          cb.checked = !cb.checked;
          item.classList.toggle('on', cb.checked);
          item.querySelector('.st').textContent = cb.checked ? 'مستثنى' : 'مقبول';
        };
      });
      bindKwRules();
      $('#__addKw').onclick = () => {
        keywordRules.push({ keywords: [], image: '', caption: '' });
        $('#__kwList').innerHTML = keywordRules.map((rr, i) => renderKwRule(rr, i)).join('');
        bindKwRules();
      };
      function bindKwRules() {
        $$('#__kwList .kw-rule').forEach((elr, idx) => {
          const rule = keywordRules[idx];
          elr.querySelector('[data-kwdel]').onclick = () => {
            keywordRules.splice(idx, 1);
            $('#__kwList').innerHTML = keywordRules.map((rr, i) => renderKwRule(rr, i)).join('');
            bindKwRules();
          };
          const kwInput = elr.querySelector('input[data-kwin]');
          const kwBtn = elr.querySelector('[data-kwadd]');
          const addKw = () => {
            const vv = (kwInput.value || '').trim();
            if (!vv) return;
            if (!Array.isArray(rule.keywords)) rule.keywords = [];
            rule.keywords.push(vv);
            kwInput.value = '';
            elr.querySelector('.kw-tags').innerHTML = renderKwTags(rule.keywords, idx);
            bindKwTags();
          };
          kwBtn.onclick = addKw;
          kwInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addKw(); } };
          const imgInput = elr.querySelector('input[data-kwimg]');
          imgInput.oninput = () => {
            rule.image = imgInput.value.trim();
            const prev = elr.querySelector('.kw-img-prev');
            if (rule.image) prev.innerHTML = `<img src="${esc(rule.image)}" onerror="this.style.display='none'">`;
            else prev.textContent = 'لا صورة';
          };
          const capInput = elr.querySelector('textarea[data-kwcap]');
          if (capInput) capInput.oninput = () => { rule.caption = capInput.value.trim(); };
          
          const upBtn = elr.querySelector('[data-kwimgup]');
          if (upBtn) upBtn.onclick = () => {
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'image/*';
            inp.onchange = async () => {
              const file = inp.files[0]; if (!file) return;
              if (file.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
              const fd = new FormData(); fd.append('file', file);
              try {
                const res = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'include' });
                const j = await res.json();
                if (!res.ok) throw new Error(j.error || 'فشل');
                rule.image = j.url;
                imgInput.value = j.url;
                elr.querySelector('.kw-img-prev').innerHTML = `<img src="${esc(j.url)}">`;
                toast('تم الرفع', 'ok');
              } catch (err) { toast(err.message, 'bad'); }
            };
            inp.click();
          };
          function bindKwTags() {
            elr.querySelectorAll('.kw-tag button').forEach(bb => {
              bb.onclick = () => {
                const k = +bb.dataset.kwi;
                rule.keywords.splice(k, 1);
                elr.querySelector('.kw-tags').innerHTML = renderKwTags(rule.keywords, idx);
                bindKwTags();
              };
            });
          }
          bindKwTags();
        });
      }
    }
  });
  if (r === null || r === false) return;
  const tpl = ($('#__tp')?.value || '').trim();
  const btnText = ($('#__bt')?.value || 'عرض الروم').trim();
  const newIgBots = $$('#__botList input[data-botid]:checked').map(x => x.dataset.botid);
  const fixedImage = ($('#__fi')?.value || '').trim();
  const roomUrl = ($('#__ru')?.value || '').trim();
  const useOrig = $('#__useOrig')?.checked ? 1 : 0;
  const useAi = $('#__useAi')?.checked ? 1 : 0;
  const aiPrompt = ($('#__aiPrompt')?.value || '').trim();
  const finalRules = keywordRules.filter(rule => rule.keywords && rule.keywords.length > 0);
  try {
    await api('/api/discord/feeds/' + f.id, { method:'PATCH', body: {
      template: tpl, btn_text: btnText, ignore_bots: newIgBots,
      keyword_rules: finalRules, fixed_image: fixedImage, room_url: roomUrl,

async function openAddFeed() {
  if (!canDiscord() || !isOwner()) return toast('خاص بالمالك فقط', 'bad');
  await loadBots();
  const known = S.knownChannels || {};
  const chs = Object.entries(known);
  if (!chs.length) return modal({ title:'لا رومات', sub:'البوت لم يكتشف رومات. تأكد من DISCORD_GUILD_ID ثم اضغط تحديث', okText:'حسناً', cancel:false });
  const linked = new Set(S.feeds.map(f => f.channel_id));
  const available = chs.filter(([id]) => !linked.has(id));
  if (!available.length) return modal({ title:'كل الرومات مربوطة', okText:'حسناً', cancel:false });
  const botList = S.knownBots || [];
  const botListHTML = botList.length ? botList.map(b => `
    <label class="bot-item">
      <div class="av">${b.avatar ? `<img src="${esc(b.avatar)}" onerror="this.remove()">` : esc((b.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(b.name||b.id)}</b><small>ID: ${esc(b.id)} · ${b.seen_count || 0}</small></div>
      <span class="st">مقبول</span>
      <input type="checkbox" data-botid="${b.id}" style="display:none">
    </label>`).join('') : '<div class="mu center" style="padding:14px;font-size:12.5px">لم يتم رصد بوتات بعد</div>';
  const html = `
    <label class="fld"><span>اختر الروم</span><select id="__chList">${available.map(([id, info]) => `<option value="${esc(id)}">#${esc(info.name)} — ${esc(info.guild||'')}</option>`).join('')}</select></label>
    <label class="fld"><span>نوع المصدر</span><select id="__src"><option value="generic">عام</option><option value="twitter">تويتر</option><option value="youtube">يوتيوب</option></select></label>
    <div class="switch-row"><div class="sw-txt"><b>نسخ الأصل</b><small>بدون قالب</small></div><label class="sw"><input type="checkbox" id="__useOrig" checked><i></i></label></div>
    <label class="fld"><span>القالب (اختياري)</span><textarea id="__tpl" rows="4" class="mono" placeholder="<b>{author_no_at}</b>&#10;&#10;<b>{content}</b>"></textarea></label>
    <label class="fld"><span>نص الزر</span><input type="text" id="__bt" value="عرض الروم"></label>
    <label class="fld" style="margin-top:20px"><span>البوتات المستثناة</span></label>
    <div class="bot-list" id="__botList">${botListHTML}</div>`;
  const r = await modal({ title:'ربط روم', sub:'سيتم إنشاء الاشتراكات لاحقاً من قبل المستخدمين', html, okText:'ربط', xwide: true,
    onReady: () => {
      $$('#__botList .bot-item').forEach(item => {
        item.onclick = () => {
          const cb = item.querySelector('input[type="checkbox"]');
          cb.checked = !cb.checked;
          item.classList.toggle('on', cb.checked);
          item.querySelector('.st').textContent = cb.checked ? 'مستثنى' : 'مقبول';
        };
      });
    }
  });
  if (!r) return;
  const cid = $('#__chList').value;
  if (!cid) return toast('اختر الروم', 'bad');
  const tpl = ($('#__tpl')?.value || '').trim();
  const btn = ($('#__bt')?.value || 'عرض الروم').trim();
  const igBots = $$('#__botList input[data-botid]:checked').map(x => x.dataset.botid);
  try {
    await api('/api/discord/feeds', { method:'POST', body: {
      channel_id: cid, channel_name: known[cid]?.name || '',
      template: tpl, btn_text: btn, source_type: $('#__src').value,
      ignore_bots: igBots,
      use_original: $('#__useOrig')?.checked ? 1 : 0,
    }});
    toast('تم الربط', 'ok');
    await loadFeeds(); renderApp();

}

    </div>`).join('');

function limitBarHTML(kind) {
  const l = S.limits[kind] || { used:0, limit:10, remaining:10 };
  const pct = l.limit > 0 ? Math.min(100, (l.used / l.limit) * 100) : 0;
  let cls = 'limit-bar';
  if (pct >= 100) cls += ' full';
  else if (pct >= 80) cls += ' warn';
  return { html: `<div class="${cls}"><b style="width:${pct}%"></b></div>`, text: `${l.used} / ${l.limit}`, isFull: l.remaining <= 0 };
}

    ${kind === 'kick' && r.live && r.title ? `<div class="ch-live"><div>${esc(r.title)}</div><span>${r.viewers||0} 👁</span></div>` : ''}
    <div class="ch-acts">
      ${kind === 'kick' ? `<a class="btn sm" href="https://kick.com/${esc(r.slug)}" target="_blank">${IC.play} مشاهدة</a>` : ''}
      ${kind === 'yt' ? `<a class="btn sm" href="https://youtube.com/channel/${esc(r.channel_id)}" target="_blank">${IC.play} زيارة</a>` : ''}
      ${kind === 'twitter' ? `<a class="btn sm" href="https://twitter.com/${esc(r.username)}" target="_blank">${IC.tw} زيارة</a>` : ''}
      ${kind === 'tg' && r.username ? `<a class="btn sm" href="https://t.me/${esc(r.username.replace('@',''))}" target="_blank">${IC.tg} زيارة</a>` : ''}
      ${kind === 'tg' ? `<button class="btn sm" data-act="info" style="color:var(--orange)">${IC.info} معلومات</button>` : ''}
      ${kind !== 'tg' ? `<button class="btn sm ghost" data-act="edit">${IC.edit} تخصيص</button>` : ''}
      ${kind === 'tg' || kind === 'yt' || kind === 'twitter' ? `<button class="btn sm ghost" data-act="refresh">${IC.refresh}</button>` : ''}
      ${kind !== 'tg' ? `<button class="btn sm ghost" data-act="autosend">${r.auto_send===0?'🔕':'🔔'}</button>` : ''}
      <button class="btn sm ghost" data-act="toggle">${r.enabled?'إيقاف':'تفعيل'}</button>
      <button class="btn sm danger" data-act="del">${IC.trash}</button>
    </div>`;
  card.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const act = b.dataset.act;
      if (act === 'del') {
        const ok = await dlgConfirm('حذف القناة نهائياً؟', 'تأكيد', true); if (!ok) return;
        try { await api('/api/channels/' + kind + '/' + r.id, { method:'DELETE' }); toast('تم الحذف', 'ok'); await loadChannels(kind); renderApp(); }
        catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'toggle') {
        try { await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { enabled: !r.enabled } }); toast(r.enabled ? 'تم الإيقاف' : 'تم التفعيل', 'ok'); await loadChannels(kind); renderApp(); }
        catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'autosend') {
        const nv = r.auto_send === 0 ? 1 : 0;
        try { await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { auto_send: nv } }); toast(nv ? 'الإرسال مفعّل' : 'الإرسال موقوف', 'ok'); await loadChannels(kind); renderApp(); }
        catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'edit') { await editChannelMsg(kind, r); }
      else if (act === 'info') { await showTgInfo(r.id, title); }
      else if (act === 'refresh') {
        try {
          await api('/api/channels/' + kind + '/' + r.id + '/refresh', { method:'POST' });
          toast('تم التحديث', 'ok');
          await loadChannels(kind); renderApp();
        } catch (e2) { toast(e2.message, 'bad'); }
      }
    };
  });
  return card;
}

async function editChannelMsg(kind, r) {
  const curImg = r.msg && r.msg.match(/\{img:([^}]+)\}/);
  const curMsg = r.msg ? r.msg.replace(/\{img:[^}]+\}/g, '').trim() : '';
  let uploadedImage = curImg ? curImg[1] : '';
  const defaultTpl = kind === 'kick' ? (S.me.tpl_kick || '') : (kind === 'yt' ? (S.me.tpl_yt || '') : (S.me.tpl_twitter || ''));
  const defaultBtn = kind === 'kick' ? (S.me.btn_kick || 'شاهد البث') : (kind === 'yt' ? (S.me.btn_yt || 'شاهد الفيديو') : (S.me.btn_tw || 'عرض التغريدة'));

  const html = `
    <label class="fld"><span>نص الرسالة</span>
      <textarea id="__msg" rows="6" placeholder="اتركه فارغاً للقالب العام">${esc(curMsg)}</textarea></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px;margin-bottom:12px">
      <span class="mu" style="font-size:11.5px">المتغيرات:</span>
      <span class="pill">{name}</span><span class="pill">{title}</span><span class="pill">{content}</span><span class="pill">{url}</span>
    </div>
    <label class="fld"><span>نص زر المشاهدة</span>
      <input type="text" id="__btn" value="${esc(r.btn_text || '')}" placeholder="${esc(defaultBtn)}"></label>
    ${kind === 'twitter' ? `
      <label class="fld"><span>فلترة الكلمات (تجاهل التغريدة إذا احتوت)</span>
        <input type="text" id="__filter" value="${esc(r.filter_kw || '')}" placeholder="مثال: youtube.com, يوتيوب"></label>
      <div class="mu" style="font-size:11.5px;margin-top:-6px;margin-bottom:12px">افصل بين الكلمات بفاصلة ( , ).</div>
    ` : ''}
    <label class="fld" style="margin-top:6px"><span>صورة مرفقة (اختياري)</span></label>
    <div class="img-preview-box ${uploadedImage ? '' : 'empty'}" id="__imgBox">
      ${uploadedImage ? `<img src="${esc(uploadedImage)}" alt="">` : '<div>لا توجد صورة</div>'}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button type="button" class="btn sm" id="__upBtn">${IC.camera} رفع</button>
      <button type="button" class="btn sm ghost" id="__clrBtn">${IC.x} مسح</button>
      <input type="file" id="__upFile" accept="image/*" style="display:none">
    </div>
    <div class="tpl-preview" id="__tplPrev"></div>`;

  const r2 = await modal({
    title:'تخصيص رسالة الإشعار',
    sub:'اتركه فارغاً للقالب العام',
    html, okText:'حفظ', wide: true,
    onReady: () => {
      const ta = $('#__msg'), prev = $('#__tplPrev');
      const update = () => {
        const tpl = ta.value.trim() || defaultTpl;
        const sample = tpl
          .replace(/\{name\}/g, r.name || 'اسم القناة')
          .replace(/\{title\}/g, kind === 'kick' ? 'عنوان البث' : 'عنوان الفيديو')
          .replace(/\{content\}/g, 'نص التغريدة هنا...')
          .replace(/\{url\}/g, kind === 'kick' ? 'https://kick.com/' + (r.slug||'') : (kind === 'twitter' ? 'https://twitter.com/...' : 'https://youtube.com/watch?v=...'));
        prev.innerHTML = '<div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:var(--font-en)">PREVIEW</div>' + sample.replace(/\n/g, '<br>');
      };
      ta.oninput = update; update();
      $('#__upBtn').onclick = () => $('#__upFile').click();
      $('#__upFile').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
        const fd = new FormData(); fd.append('file', f);
        try {
          const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
          const j = await res.json();
          if (!res.ok) throw new Error(j.error || 'فشل');
          uploadedImage = j.url;
          const box = $('#__imgBox'); box.classList.remove('empty');
          box.innerHTML = `<img src="${esc(uploadedImage)}" alt="">`;
          toast('تم الرفع', 'ok');
        } catch (err) { toast(err.message, 'bad'); }
      };
      $('#__clrBtn').onclick = () => {
        uploadedImage = '';
        const box = $('#__imgBox'); box.classList.add('empty');
        box.innerHTML = '<div>لا توجد صورة</div>';
      };
    }
  });
  if (r2 === null || r2 === false) return;
  let finalMsg = ($('#__msg')?.value || '').trim();
  if (uploadedImage) finalMsg = (finalMsg ? finalMsg + '\n' : '') + `{img:${uploadedImage}}`;
  const btnText = ($('#__btn')?.value || '').trim();
  const filterKw = kind === 'twitter' ? ($('#__filter')?.value || '').trim() : undefined;
  
  try {
    const body = { msg: finalMsg, btn_text: btnText };
    if (filterKw !== undefined) body.filter_kw = filterKw;
    await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body });
    toast('تم الحفظ', 'ok');
    await loadChannels(kind); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

async function openAddChannel(kind) {
  if (!isLogged()) return;
  if (!canWrite()) return toast('الموقع في صيانة — لا يمكن الإضافة', 'bad');
  if (kind === 'tg') return openTgVerify();
  let suggestions = [];
  try { const r = await api('/api/channels/' + kind + '/suggestions'); suggestions = r.rows || []; } catch (e) {}
  const lim = S.limits[kind] || { used:0, limit:10, remaining:10 };
  const labels = {
    kick: { title:'إضافة قناة كيك', label:'slug', ph:'xqc' },
    yt:   { title:'إضافة قناة يوتيوب', label:'@handle أو UC...', ph:'@MrBeast' },
    twitter: { title:'إضافة حساب تويتر', label:'@username', ph:'@elonmusk' },
  }[kind];
  const noTg = !S.boot.has_telegram;
  const botWarn = noTg
    ? `<div style="padding:12px 14px;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.3);border-radius:12px;margin-bottom:12px;font-size:12.5px;line-height:1.7">⚠️ <b>توكن تيليجرام غير مضبوط</b> — لن تُرسل أي إشعارات تلقائية.</div>`
    : '';
  const sugHTML = suggestions.length ? `
    <div style="margin-top:22px;padding-top:20px;border-top:1px solid var(--line)">
      <div class="sh-sub" style="margin-bottom:6px">${IC.plus} مُقترحات الإدارة</div>
      <div class="sug-grid" id="sugGrid">${suggestions.map(s => `
        <div class="sug-item" data-id="${s.id}">
          <div class="av">${s.avatar ? `<img src="${esc(s.avatar)}" onerror="this.remove()">` : esc((s.name||'?').charAt(0).toUpperCase())}</div>
          <div class="if"><b>${esc(s.name || s.identifier)}</b><small>${esc(s.identifier)}</small></div>
          <div class="ck">${IC.check}</div>
        </div>`).join('')}</div>
      <div class="sug-toolbar"><span id="sugCount">0</span><button type="button" id="sugToggleAll">تحديد الكل</button></div>
    </div>` : '';
  const html = `
    <div style="padding:12px 14px;background:rgba(var(--blue-rgb),.06);border:1px solid var(--blue-line);border-radius:12px;margin-bottom:12px;font-size:12.5px;font-weight:800">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>الحدود</span><span style="color:var(--blue);font-family:var(--font-en)">${lim.used} / ${lim.limit}</span></div>
      <div class="limit-bar"><b style="width:${lim.limit > 0 ? Math.min(100, (lim.used/lim.limit)*100) : 0}%"></b></div>
    </div>
    ${botWarn}
    <label class="fld"><span>${esc(labels.label)}</span><input type="text" id="__ci" placeholder="${esc(labels.ph)}"></label>
    <label class="fld"><span>الاسم (اختياري)</span><input type="text" id="__cn"></label>
    <label class="fld"><span>نص الزر (اختياري)</span><input type="text" id="__bt" placeholder="${kind==='kick'?'شاهد البث':(kind==='twitter'?'عرض التغريدة':'شاهد الفيديو')}"></label>
    ${sugHTML}`;
  const result = await modal({ title: labels.title, html, okText: 'إضافة', wide: suggestions.length > 0 });
  if (result === false || result === null) return;
  const val = ($('#__ci')?.value || '').trim();
  const customName = ($('#__cn')?.value || '').trim();
  const btnText = ($('#__bt')?.value || '').trim();
  if (suggestions.length) {
    const ids = $$('#sugGrid .sug-item.on').map(x => +x.dataset.id);
    if (ids.length > 0) {
      try {
        const r = await api('/api/channels/' + kind + '/bulk-add', { method:'POST', body: { ids } });
        toast('تمت إضافة ' + (r.added || 0) + (r.failed ? ' — فشل ' + r.failed : ''), 'ok');
        if (r.errors?.length) setTimeout(() => toast(r.errors[0], ''), 500);
        await loadChannels(kind); renderApp(); return;
      } catch (e) { toast(e.message, 'bad'); return; }
    }
  }
  if (!val) return toast('اكتب القيمة', 'bad');
  try {
    const body = kind === 'kick' ? { slug: val, msg: '', btn_text: btnText } : 
                 kind === 'twitter' ? { username: val, msg: '', btn_text: btnText } :
                 { channel_id: val, name: customName, msg: '', btn_text: btnText };
    const res = await api('/api/channels/' + kind, { method:'POST', body });
    toast('تمت الإضافة', 'ok');
    if (res.warn) setTimeout(() => toast(res.warn, ''), 600);
    await loadChannels(kind); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

async function openTgVerify() {
  if (!isLogged()) return;
  if (!canWrite()) return toast('الموقع في صيانة — لا يمكن التوثيق', 'bad');
  if (!S.boot.has_telegram) {
    return modal({ title:'تيليجرام غير مضبوط', sub:'توكن تيليجرام غير موجود في السيرفر — تواصل مع الإدارة', okText:'حسناً', cancel:false });
  }
  const lim = S.limits.tg || { used:0, limit:1, remaining:1 };
  if (lim.remaining <= 0) {
    return modal({ title:'وصلت الحد', sub:`الحد الأقصى ${lim.limit} قناة تيليجرام.${S.me.user.is_member ? '' : ' اربط حسابك وانضم للقناة الرسمية للحصول على صلاحيات مضاعفة.'}`, okText:'حسناً', cancel:false });
  }
  const html = `
    <div class="tgv-box">
      <b style="color:var(--blue);display:inline-flex;align-items:center;gap:6px;margin-bottom:8px">${IC.shieldCheck} خطوات التوثيق</b>
      <div class="tgv-step active" data-step="1"><b>1</b> أدخل يوزر القناة</div>
      <div class="tgv-step" data-step="2"><b>2</b> البوت يكتشف المالك/المشرف الأقوى</div>
      <div class="tgv-step" data-step="3"><b>3</b> المشرف يؤكد ويحصل على رمز 6 أرقام</div>
    </div>
    <div style="padding:12px 14px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);border-radius:12px;margin-bottom:14px;font-size:12px;line-height:1.7">
      ⚠️ <b>قبل البدء:</b><br>
      • البوت يجب أن يكون مشرفاً في القناة<br>
      • المشرف المستلم يجب أن يفتح البوت ويضغط <code>/start</code> أول مرة
    </div>
    <label class="fld"><span>قناة تيليجرام</span>
      <input type="text" id="__tgc" placeholder="@mychannel أو رابط t.me">
      <small class="mu" style="display:block;margin-top:6px;font-size:11.5px">أدخل يوزر القناة أو رابطها</small>
    </label>
    <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:12.5px;color:var(--muted)">
      <span>الحدود</span><span style="font-family:var(--font-en);color:var(--blue);font-weight:900">${lim.used} / ${lim.limit}</span>
    </div>`;
  const r = await modal({ title:'توثيق قناة تيليجرام', sub:'البوت سيتحقق من مالك القناة تلقائياً', html, okText:'متابعة', wide: true });
  if (!r) return;
  const chatInput = ($('#__tgc')?.value || '').trim();
  if (!chatInput) return toast('أدخل قناة تيليجرام', 'bad');

  let result;
  try {
    result = await api('/api/tg/verify/start', { method:'POST', body: { chat_id: chatInput } });
  } catch (e) {
    return toast(e.message, 'bad');
  }

  const verifyId = result.verify_id;
  const chatName = result.chat_name;
  const chatAvatar = result.chat_avatar;
  const admins = result.admins || [];
  const autoId = result.auto_admin_id;

  if (admins.length === 1) {
    await tgVerifySendAndWait(verifyId, autoId, chatName, chatAvatar, admins[0].name);
  } else {
    await tgVerifyPickAdmin(verifyId, admins, chatName, chatAvatar);
  }
}

async function tgVerifyPickAdmin(verifyId, admins, chatName, chatAvatar) {
  const adminHTML = admins.map(a => `
    <label class="tg-pick-item" data-admin-id="${esc(a.id)}">
      <div class="av">${esc((a.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if">
        <b>${esc(a.name)}${a.is_owner ? ' 👑' : ''}</b>
        <small>${esc(a.username || '')} ${a.is_owner ? '· المالك' : '· مشرف كامل'}</small>
      </div>
      <div class="ck">${IC.check}</div>
    </label>`).join('');
  const html = `
    <div class="tgv-step done"><b>${IC.check}</b> تم إرسال الطلب</div>
    <div class="tgv-chat">
      <div class="av">${chatAvatar ? `<img src="${esc(chatAvatar)}" onerror="this.remove()">` : esc((chatName||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(chatName)}</b><small>${admins.length} مشرف بصلاحيات كاملة</small></div>
    </div>
    <div style="padding:12px 14px;background:rgba(var(--blue-rgb),.06);border:1px solid var(--blue-line);border-radius:12px;margin-bottom:14px;font-size:12.5px;line-height:1.7">
      اختر المشرف الذي تريد أن يستلم رمز التوثيق<br>
      <span class="mu" style="font-size:11.5px">يجب أن يكون قد فتح البوت وضغط /start</span>
    </div>
    <label class="fld"><span>المشرفون</span></label>
    <div class="tg-pick-grid" id="__adminList">${adminHTML}</div>`;
  const r = await modal({ title:'اختر المشرف', sub:'سيستلم رسالة التأكيد', html, okText:'إرسال الرمز', wide: true,
    onReady: () => {
      $$('#__adminList .tg-pick-item').forEach(item => {
        item.onclick = () => {
          $$('#__adminList .tg-pick-item').forEach(x => x.classList.remove('on'));
          item.classList.add('on');
        };
      });
      const ownerItem = admins.find(a => a.is_owner);
      const targetId = ownerItem ? ownerItem.id : admins[0].id;
      const targetEl = document.querySelector('[data-admin-id="' + targetId + '"]');
      if (targetEl) targetEl.classList.add('on');
    }
  });
  if (!r) return;
  const selected = document.querySelector('#__adminList .tg-pick-item.on');
  if (!selected) return toast('اختر مشرفاً', 'bad');
  const adminId = selected.dataset.adminId;
  const adminName = (admins.find(a => a.id === adminId) || {}).name || '';
  await tgVerifySendAndWait(verifyId, adminId, chatName, chatAvatar, adminName);
}

async function tgVerifySendAndWait(verifyId, adminId, chatName, chatAvatar, adminName) {
  try {
    await api('/api/tg/verify/' + verifyId + '/send', { method:'POST', body: { admin_id: adminId } });
    toast('تم إرسال الرسالة — بانتظار تأكيد المشرف', 'ok');
  } catch (e) {
    return toast(e.message, 'bad');
  }
  await tgVerifyWait(verifyId, chatName, chatAvatar, adminName);
}

async function tgVerifyWait(verifyId, chatName, chatAvatar, adminName) {
  const html = `
    <div class="tgv-step done"><b>${IC.check}</b> تم إرسال الطلب</div>
    <div class="tgv-chat">
      <div class="av">${chatAvatar ? `<img src="${esc(chatAvatar)}" onerror="this.remove()">` : esc((chatName||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(chatName || 'قناة تيليجرام')}</b><small>بانتظار تأكيد ${esc(adminName || 'المشرف')}...</small></div>
    </div>
    <div style="text-align:center;padding:16px 0">
      <div class="tgv-spinner"></div>
      <div class="mu" style="margin-top:12px;font-size:13px;line-height:1.8">
        أرسلنا رسالة إلى <b style="color:var(--text)">${esc(adminName || 'المشرف')}</b> في تيليجرام<br>
        عندما يضغط <b style="color:var(--green)">✅ نعم</b> سيحصل على رمز 6 أرقام<br>
        <span style="font-size:12px;color:var(--muted-2)">اطلب منه الرمز والصقه في الخطوة التالية</span>
      </div>
    </div>
    <div class="tgv-timer" id="__vtimer">⏱ <span id="__vtsec">600</span> ثانية متبقية</div>
    <div style="text-align:center;margin-top:14px">
      <button class="btn sm ghost" id="__vcancel">إلغاء الطلب</button>
    </div>`;
  modal({ title:'بانتظار التأكيد', sub:'تحقق من تيليجرام', html, okText:'لدي الرمز بالفعل', cancel:false, wide: true });
  let left = 600;
  const timer = setInterval(() => {
    left--;
    const s = document.getElementById('__vtsec'); if (s) s.textContent = left;
    if (left <= 0) { clearInterval(timer); toast('انتهت مدة التوثيق', 'bad'); }
  }, 1000);
  setTimeout(() => {
    const c = document.getElementById('__vcancel');
    if (c) c.onclick = async () => {
      clearInterval(timer);
      try { await api('/api/tg/verify/' + verifyId + '/cancel', { method:'POST' }); } catch (e) {}
      const m = $('#modal'); if (m) m.classList.remove('on');
      toast('تم إلغاء الطلب', 'ok');
    };
  }, 100);
  let polls = 0;
  const pollInterval = setInterval(async () => {
    polls++;
    if (polls > 200) { clearInterval(pollInterval); clearInterval(timer); return; }
    try {
      const r = await api('/api/tg/verify/' + verifyId);
      if (r.status === 'confirmed') {
        clearInterval(pollInterval); clearInterval(timer);
        await tgVerifyCode(verifyId, chatName, chatAvatar);
      } else if (r.status === 'cancelled' || r.status === 'expired' || r.status === 'failed') {
        clearInterval(pollInterval); clearInterval(timer);
        toast(r.status === 'cancelled' ? 'تم إلغاء التوثيق من المشرف' : 'انتهت مدة التوثيق', 'bad');
      }
    } catch (e) {}
  }, 3000);
}

async function tgVerifyCode(verifyId, chatName, chatAvatar) {
  const html = `
    <div class="tgv-step done"><b>${IC.check}</b> تم إرسال الطلب</div>
    <div class="tgv-step done"><b>${IC.check}</b> تم التأكيد من تيليجرام</div>
    <div class="tgv-chat">
      <div class="av">${chatAvatar ? `<img src="${esc(chatAvatar)}" onerror="this.remove()">` : esc((chatName||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(chatName || 'قناة تيليجرام')}</b><small>أدخل الرمز لإكمال التوثيق</small></div>
    </div>
    <div style="text-align:center;padding:12px 0;font-size:13px;line-height:1.8" class="mu">
      افتح رسالة البوت في تيليجرام<br>
      انسخ الرمز المكوّن من <b style="color:var(--blue)">6 أرقام</b>
    </div>
    <div class="tgv-code">
      <input type="text" id="__vcode" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="off">
    </div>`;
  const r = await modal({ title:'إدخال الرمز', sub:'الرمز صالح لمدة 5 دقائق', html, okText:'تأكيد وإضافة', wide: true,
    onReady: () => {
      setTimeout(() => {
        const inp = document.getElementById('__vcode');
        if (inp) {
          inp.focus();
          inp.oninput = () => { inp.value = inp.value.replace(/\D/g,'').slice(0,6); };
        }
      }, 100);
    }
  });
  if (!r) return;
  const code = ($('#__vcode')?.value || '').trim();
  if (!/^\d{6}$/.test(code)) return toast('الرمز يجب أن يكون 6 أرقام', 'bad');
  try {
    await api('/api/tg/verify/' + verifyId + '/code', { method:'POST', body: { code } });
    toast('✅ تم توثيق القناة بنجاح', 'ok');
    await loadChannels('tg');
    S.view = 'tg';
    renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

async function editNews(n) {
  const isNew = !n;
  const html = `
    <label class="fld"><span>العنوان</span><input type="text" id="__nt" value="${esc(n?.title || '')}" placeholder="مثال: تحديث جديد"></label>
    <label class="fld"><span>النوع</span>
      <select id="__nk">
        <option value="news" ${n?.kind==='news'?'selected':''}>📰 خبر عام</option>
        <option value="update" ${n?.kind==='update'?'selected':''}>🆕 تحديث</option>
        <option value="maintenance" ${n?.kind==='maintenance'?'selected':''}>🔧 صيانة</option>
        <option value="warning" ${n?.kind==='warning'?'selected':''}>⚠️ تحذير</option>
      </select>
    </label>
    <label class="fld"><span>المحتوى</span><textarea id="__nb" rows="6" placeholder="نص الخبر...">${esc(n?.body || '')}</textarea></label>
    <label class="fld"><span>صورة (رابط اختياري)</span><input type="text" id="__ni" value="${esc(n?.image || '')}" placeholder="https://..."></label>
    <div style="display:flex;gap:8px;margin-top:-8px;margin-bottom:8px"><button type="button" class="btn sm" id="__nimgUp">${IC.camera} رفع صورة</button><input type="file" id="__nimgFile" accept="image/*" style="display:none"></div>
    <div class="img-preview-box ${n?.image ? '' : 'empty'}" id="__nimgBox">${n?.image ? `<img src="${esc(n.image)}">` : '<div>لا صورة</div>'}</div>`;
  const r = await modal({ title: isNew ? 'خبر جديد' : 'تعديل الخبر', html, okText: isNew ? 'إضافة' : 'حفظ', wide: true,
    onReady: () => {
      $('#__nimgUp').onclick = () => $('#__nimgFile').click();
      $('#__nimgFile').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
        const fd = new FormData(); fd.append('file', f);
        try {
          const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
          const j = await res.json();
          if (!res.ok) throw new Error(j.error || 'فشل');
          $('#__ni').value = j.url;
          const box = $('#__nimgBox'); box.classList.remove('empty');
          box.innerHTML = `<img src="${esc(j.url)}">`;
          toast('تم الرفع', 'ok');
        } catch (err) { toast(err.message, 'bad'); }
      };
    }
  });
  if (!r) return;
  const body = {
    title: ($('#__nt')?.value || '').trim(),
    body: ($('#__nb')?.value || '').trim(),
    image: ($('#__ni')?.value || '').trim(),
    kind: $('#__nk')?.value || 'news',
  };
  if (!body.title) return toast('العنوان مطلوب', 'bad');
  try {
    if (isNew) await api('/api/admin/news', { method:'POST', body });
    else await api('/api/admin/news/' + n.id, { method:'PATCH', body });
    toast('تم الحفظ', 'ok');
    await loadAdminData();
    await loadNews();
    renderAdminContent();
  } catch (e) { toast(e.message, 'bad'); }
}

      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">إعدادات Groq</div>
      <label class="fld"><span>API Key ${st.source === 'env' ? '(محجوز - من متغيرات البيئة)' : ''}</span>
        <input type="password" id="__gkey" placeholder="gsk_..." ${st.source === 'env' ? 'disabled' : ''}>
      </label>
      <div class="mu" style="font-size:11.5px;margin-top:-6px;margin-bottom:12px">
        احصل على مفتاح من <a href="https://console.groq.com/keys" target="_blank" style="color:var(--blue)">console.groq.com</a>
      </div>
      <label class="fld"><span>الموديل</span>
        <select id="__gmodel">
          <option value="llama-3.3-70b-versatile" ${s.groq_model === 'llama-3.3-70b-versatile' ? 'selected' : ''}>Llama 3.3 70B (الأفضل)</option>
          <option value="llama-3.1-8b-instant" ${s.groq_model === 'llama-3.1-8b-instant' ? 'selected' : ''}>Llama 3.1 8B (أسرع)</option>
          <option value="mixtral-8x7b-32768" ${s.groq_model === 'mixtral-8x7b-32768' ? 'selected' : ''}>Mixtral 8x7B</option>
          <option value="gemma2-9b-it" ${s.groq_model === 'gemma2-9b-it' ? 'selected' : ''}>Gemma2 9B</option>
        </select>
      </label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="btn pri" id="__gsave">${IC.check} حفظ</button>
        <button class="btn" id="__gtest">${IC.sparkle} اختبار</button>
        ${st.source === 'db' ? `<button class="btn danger" id="__gclear">${IC.trash} حذف المفتاح</button>` : ''}
      </div>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">اختبار سريع</div>
      <label class="fld"><span>نص للتجربة</span>
        <textarea id="__gtestText" rows="3">🔴 الآن بث مباشر على قناة كيك، انضم للمشاهدة!</textarea>
      </label>
      <button class="btn ai wide" id="__gtestRun">${IC.ai} إعادة صياغة بـ Groq</button>
      <div class="tpl-preview" id="__gtestOut" style="display:none"></div>
    </div>`;
  $('#__gsave').onclick = async () => {
    const body = { model: $('#__gmodel').value };
    const key = $('#__gkey')?.value.trim();
    if (key && st.source !== 'env') body.api_key = key;
    try {
      await api('/api/admin/groq', { method:'POST', body });
      toast('تم الحفظ', 'ok'); await loadSettings(); renderAdminAI(c);
    } catch (e) { toast(e.message, 'bad'); }
  };
  $('#__gtest').onclick = async () => {
    try {
      const r = await api('/api/admin/groq', { method:'POST', body: { test: true } });
      if (r.test && r.test !== 'فشل الاختبار') { toast('✓ Groq يعمل', 'ok'); }
      else { toast('فشل الاختبار', 'bad'); }
      renderAdminAI(c);
    } catch (e) { toast(e.message, 'bad'); }
  };
  const gc = $('#__gclear');
  if (gc) gc.onclick = async () => {
    const ok = await dlgConfirm('حذف مفتاح Groq؟', 'تأكيد', true); if (!ok) return;
    try { await api('/api/admin/groq', { method:'POST', body: { api_key: '' } }); toast('تم', 'ok'); renderAdminAI(c); } catch (e) { toast(e.message, 'bad'); }
  };
  const gr = $('#__gtestRun');
  if (gr) gr.onclick = async () => {
    const text = ($('#__gtestText')?.value || '').trim();
    if (!text) return toast('اكتب نص', 'bad');
    if (!st.available) return toast('Groq غير مضبوط', 'bad');
    gr.disabled = true; gr.textContent = 'جاري...';
    try {
      const r = await api('/api/ai/rewrite', { method:'POST', body: { text, prompt: '' } });
      const out = $('#__gtestOut');
      out.style.display = 'block';
      out.innerHTML = '<div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:var(--font-en)">AI OUTPUT</div>' + esc(r.text).replace(/\n/g, '<br>');
    } catch (e) { toast(e.message, 'bad'); }
    gr.disabled = false; gr.innerHTML = IC.ai + ' إعادة صياغة';
  };
}

document.addEventListener('click', e => {
  const item = e.target.closest('.sug-item');
  if (item) {
    item.classList.toggle('on');
    const grid = item.closest('.sug-grid');
    if (grid) {
      const sel = grid.querySelectorAll('.sug-item.on').length;
      const counter = document.getElementById('sugCount');
      if (counter) counter.textContent = sel + ' محددة';
    }
    return;
  }
  const toggleAll = e.target.closest('#sugToggleAll');
  if (toggleAll) {
    const grid = document.getElementById('sugGrid');
    if (grid) {
      const items = grid.querySelectorAll('.sug-item');
      const allOn = Array.from(items).every(x => x.classList.contains('on'));
      items.forEach(x => x.classList.toggle('on', !allOn));
      const counter = document.getElementById('sugCount');
      if (counter) counter.textContent = (allOn ? 0 : items.length) + ' محددة';
    }
  }
});

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') { const m = $('#modal'); if (m && m.classList.contains('on')) m.classList.remove('on'); }
});

boot().catch(e => { console.error('[RL] boot error:', e); });
