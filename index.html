<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030508">
<title>Respect Live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230b55ea'%3E%3Cpath d='M11.35 2.76a1 1 0 0 1 1.3 0l9 7.5a1 1 0 0 1 .35.74V20a2 2 0 0 1-2 2h-4.5a1 1 0 0 1-1-1v-4h-3v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2v-8.99a1 1 0 0 1 .35-.75l8-7.5z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0b55ea;--blue2:#1b67ff;--blue-rgb:11,85,234;
  --bg:#030508;--bg-2:#05070d;--panel:#0a0f18;
  --card:linear-gradient(155deg,#0d1320 0%,#050810 100%);
  --text:#f4f6fa;--text-2:#c8cfdd;--muted:#7c8799;--muted-2:#5a6473;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --blue-line:rgba(var(--blue-rgb),.28);--blue-line-2:rgba(var(--blue-rgb),.45);
  --green:#10b981;--red:#ef4444;--gold:#f5b400;--orange:#f59e0b;--purple:#8b5cf6;
  --glow-sm:0 0 20px rgba(var(--blue-rgb),.25);
  --glow:0 0 30px rgba(var(--blue-rgb),.35);
  --shadow-sm:0 4px 16px rgba(0,0,0,.35);
  --shadow:0 12px 34px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --font-ar:'Tajawal',system-ui,sans-serif;
  --font-en:'Orbitron',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,.61,.36,1);
  --r:20px;--r-sm:14px;--r-xs:10px;
  --pad:clamp(16px,5vw,28px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
html{scroll-behavior:smooth;background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ar);font-size:15px;line-height:1.7;min-height:100vh;overflow-x:hidden;padding-bottom:calc(112px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background-image:linear-gradient(rgba(var(--blue-rgb),.035) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--blue-rgb),.035) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 95% 85% at 50% 35%,#000 35%,transparent 92%);mask-image:radial-gradient(ellipse 95% 85% at 50% 35%,#000 35%,transparent 92%)}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(circle at 10% 15%,rgba(var(--blue-rgb),.10),transparent 40%),radial-gradient(circle at 92% 68%,rgba(var(--blue-rgb),.08),transparent 42%),radial-gradient(circle at 50% 110%,rgba(var(--blue-rgb),.06),transparent 55%)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
::selection{background:rgba(var(--blue-rgb),.35);color:#fff}
#splash{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(var(--blue-rgb),.20),transparent 62%),var(--bg);transition:opacity .75s var(--ease),transform .75s var(--ease)}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:26px}
.sp-logo{width:104px;height:104px;border-radius:28px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;box-shadow:0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.5);animation:spGlow 2.4s ease-in-out infinite}
.sp-logo svg{width:52px;height:52px}
@keyframes spGlow{0%,100%{box-shadow:0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.45)}50%{box-shadow:0 0 0 26px rgba(var(--blue-rgb),0),0 20px 60px rgba(var(--blue-rgb),.6)}}
.sp-dots{display:flex;gap:9px}
.sp-dots i{width:10px;height:10px;border-radius:50%;background:var(--blue);animation:spBounce 1.5s ease-in-out infinite;box-shadow:0 0 12px rgba(var(--blue-rgb),.6)}
.sp-dots i:nth-child(2){animation-delay:.18s}
.sp-dots i:nth-child(3){animation-delay:.36s}
@keyframes spBounce{0%,80%,100%{transform:scale(.35);opacity:.35}40%{transform:scale(1);opacity:1}}
.sp-foot{font-family:var(--font-en);font-size:11px;letter-spacing:4px;font-weight:800;color:var(--muted);opacity:0;animation:fadeIn .8s .9s forwards}
@keyframes fadeIn{to{opacity:1}}
.page{display:none}
.page.on{display:block;animation:pageIn .45s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.top{position:sticky;top:0;z-index:50;padding:calc(14px + env(safe-area-inset-top)) var(--pad) 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(3,5,8,.94) 60%,rgba(3,5,8,0));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid transparent;transition:border-color .3s ease,background .3s ease}
.top.scrolled{border-bottom-color:var(--line);background:linear-gradient(rgba(3,5,8,.97) 90%,rgba(3,5,8,.85))}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.brand-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;flex-shrink:0;box-shadow:0 0 16px rgba(var(--blue-rgb),.42)}
.brand-logo svg{width:22px;height:22px;color:#fff}
.brand-txt{min-width:0}
.brand-name{font-family:var(--font-en);font-size:15px;font-weight:900;letter-spacing:2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name span{color:var(--blue);text-shadow:var(--glow-sm)}
.brand-sub{font-family:var(--font-en);font-size:9px;font-weight:800;letter-spacing:2px;color:var(--muted);margin-top:2px}
.hdr-acts{display:flex;align-items:center;gap:8px}
.hdr-btn{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--text);transition:.22s var(--ease-soft)}
.hdr-btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.hdr-btn:active{transform:scale(.95)}
.hdr-btn svg{width:19px;height:19px}
.hdr-btn .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg);font-family:var(--font-en);line-height:1}
.avatar-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;font-family:var(--font-en);font-weight:900;font-size:15px;cursor:pointer;position:relative;flex-shrink:0;box-shadow:0 0 16px rgba(var(--blue-rgb),.42);transition:.22s var(--ease-soft)}
.avatar-btn:hover{transform:scale(1.06)}
.avatar-btn:active{transform:scale(.95)}
.avatar-btn .st{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.avatar-btn.guest{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);box-shadow:none}
.avatar-btn.guest svg{width:19px;height:19px}
.tabbar{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(92%,460px);height:66px;background:rgba(10,15,24,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:36px;display:flex;justify-content:space-around;align-items:center;z-index:100;padding:0 8px;box-shadow:0 20px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
.tabbar button{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative;transition:.28s var(--ease-soft)}
.tabbar button svg{width:22px;height:22px;color:currentColor;transition:.28s var(--ease-soft)}
.tabbar button:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tabbar button:active{transform:scale(.92)}
.tabbar button.on{color:var(--blue2)}
.tabbar button.on svg{transform:translateY(-2px) scale(1.15);filter:drop-shadow(0 0 8px var(--blue))}
.tabbar button.on::after{content:"";position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--blue);border-radius:3px;box-shadow:var(--glow-sm)}
.login-page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;position:relative;animation:pageIn .6s var(--ease) both}
.login-card{position:relative;width:min(430px,100%);padding:38px 30px 32px;background:var(--card);border:1px solid var(--line-2);border-radius:26px;box-shadow:var(--shadow-lg),0 0 80px rgba(var(--blue-rgb),.10)}
.login-card::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);box-shadow:var(--glow);border-radius:2px}
.login-logo{width:92px;height:92px;border-radius:26px;margin:0 auto 20px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;box-shadow:0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.45);animation:spGlow 2.6s infinite}
.login-logo svg{width:46px;height:46px}
.login-head{text-align:center;margin-bottom:28px}
.login-head h1{font-family:var(--font-en);font-size:22px;letter-spacing:3px;font-weight:900;margin-bottom:8px}
.login-head h1 span{color:var(--blue);text-shadow:var(--glow-sm)}
.login-head p{color:var(--muted);font-size:12.5px;letter-spacing:.3px}
.fld{display:block;margin:16px 0}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:9px;font-weight:800;letter-spacing:.3px}
input[type="text"],input[type="password"],input[type="number"],input[type="email"],input[type="search"],textarea,select{-webkit-appearance:none;appearance:none;display:block;width:100%;font-family:inherit;font-size:15px;font-weight:600;color:var(--text);background:rgba(5,8,16,.85);border:1.5px solid var(--line-2);border-radius:14px;padding:14px 16px;min-height:52px;line-height:1.4;transition:border-color .22s var(--ease-soft),box-shadow .22s var(--ease-soft),background .22s var(--ease-soft);outline:none}
input::placeholder,textarea::placeholder{color:var(--muted-2);font-weight:500}
input:hover,textarea:hover,select:hover{border-color:var(--line-2)}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:rgba(8,12,22,.9);box-shadow:0 0 0 4px rgba(var(--blue-rgb),.14),0 0 20px rgba(var(--blue-rgb),.20)}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--text);-webkit-box-shadow:0 0 0 1000px #0a0f18 inset;transition:background-color 9999s ease-out;caret-color:var(--text)}
textarea{resize:vertical;min-height:110px;line-height:1.7}
select{cursor:pointer;background-image:none}
select option{background:var(--panel);color:var(--text)}
input[type="checkbox"]{-webkit-appearance:checkbox;appearance:checkbox;width:20px;height:20px;min-height:auto;padding:0;accent-color:var(--blue);cursor:pointer;display:inline-block;vertical-align:middle}
.err{color:#f87171;font-size:12.5px;text-align:center;min-height:20px;margin-top:12px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--line-2);color:var(--text);font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.22s var(--ease-soft);position:relative;overflow:hidden;min-height:48px}
.btn:hover{transform:translateY(-1px);border-color:var(--blue)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 28px rgba(var(--blue-rgb),.30)}
.btn.pri:hover{background:var(--blue2);box-shadow:0 14px 38px rgba(var(--blue-rgb),.45)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#dc2626}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 14px;font-size:12px;border-radius:11px;min-height:auto}
.btn.wide{width:100%;padding:15px}
.btn svg{width:15px;height:15px;flex-shrink:0}
.hero{padding:38px var(--pad) 30px;text-align:center;position:relative;animation:pageIn .55s var(--ease) both}
.hero-lbl{font-family:var(--font-en);font-size:11px;font-weight:900;letter-spacing:4px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:9px}
.hero-lbl span{color:var(--blue);font-size:14px;text-shadow:var(--glow-sm)}
.hero h1{font-family:var(--font-en);font-size:clamp(36px,9vw,64px);line-height:.92;letter-spacing:4px;font-weight:900;margin:22px 0 14px}
.hero h1 span{color:var(--blue);display:inline-block;transform:skewX(-8deg);text-shadow:var(--glow)}
.hero p{color:var(--muted);font-size:13.5px;max-width:540px;margin:0 auto;line-height:1.85;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:24px var(--pad);animation:pageIn .6s var(--ease) .05s both}
.stats .s{background:var(--panel);padding:18px 8px;text-align:center;transition:.24s var(--ease-soft)}
.stats .s:hover{background:rgba(var(--blue-rgb),.06)}
.stats .s b{display:block;font-family:var(--font-en);font-size:26px;font-weight:900;line-height:1;color:var(--text)}
.stats .s b.blue{color:var(--blue);text-shadow:var(--glow-sm)}
.stats .s small{display:block;font-family:var(--font-en);font-size:10px;font-weight:800;color:var(--muted);margin-top:6px;letter-spacing:1.5px}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.sec{padding:22px var(--pad);animation:pageIn .45s var(--ease) both}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.sec-title{font-size:22px;font-weight:900;letter-spacing:.2px}
.sec-title span{color:var(--blue);transform:skewX(-8deg);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.ch{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:transform .32s var(--ease-soft),border-color .32s ease,box-shadow .32s ease}
.ch::before{content:"";position:absolute;top:10px;left:10px;width:14px;height:14px;border-top:2px solid var(--blue);border-left:2px solid var(--blue);opacity:.4;pointer-events:none;border-radius:4px 0 0 0}
.ch:hover{transform:translateY(-3px);border-color:var(--blue-line);box-shadow:0 18px 44px rgba(var(--blue-rgb),.16)}
.ch-cover{height:118px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(var(--blue-rgb),.28),rgba(0,0,0,.5))}
.ch-cover img{width:100%;height:100%;object-fit:cover;transition:transform .55s var(--ease-soft)}
.ch:hover .ch-cover img{transform:scale(1.05)}
.ch-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(3,5,8,.92))}
.ch-badge{position:absolute;top:12px;right:12px;z-index:3;font-size:10.5px;padding:5px 11px;border-radius:9px;font-weight:900;font-family:var(--font-en);letter-spacing:.5px;display:inline-flex;align-items:center;gap:5px}
.ch-badge.live{background:var(--red);color:#fff;animation:chPulse 1.9s infinite}
.ch-badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.ch-badge.off{background:rgba(255,255,255,.14);color:var(--text);backdrop-filter:blur(8px)}
@keyframes chPulse{70%{box-shadow:0 0 0 12px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.ch-head{display:flex;align-items:flex-end;gap:12px;padding:0 18px;margin-top:-28px;position:relative;z-index:2}
.ch-head img{width:56px;height:56px;border-radius:15px;object-fit:cover;border:3px solid var(--bg);background:var(--panel);flex-shrink:0;box-shadow:0 0 16px rgba(var(--blue-rgb),.35)}
.ch-head .ph{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;border:3px solid var(--bg);flex-shrink:0;color:#fff}
.ch-head .ph svg{width:26px;height:26px}
.ch-info{flex:1;min-width:0;padding-bottom:2px}
.ch-info b{display:block;font-size:15.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ch-info small{display:inline-block;font-size:10.5px;color:var(--muted);font-family:var(--font-en);letter-spacing:1px;border:1px solid var(--line);border-radius:20px;padding:3px 11px;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-live{margin:12px 18px 0;padding:11px 15px;border-radius:12px;background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.28);font-size:12.5px;display:flex;justify-content:space-between;gap:10px;font-weight:700;align-items:center}
.ch-live div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-live span{color:#f87171;white-space:nowrap;font-family:var(--font-en);font-weight:900;font-size:11.5px}
.ch-note{padding:0 18px;font-size:12.5px;color:var(--muted);margin:10px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.65}
.ch-acts{display:flex;gap:7px;flex-wrap:wrap;padding:14px 18px 18px}
.empty{text-align:center;padding:60px 24px;animation:pageIn .55s var(--ease) both}
.empty .em-icon{width:100px;height:100px;margin:0 auto 20px;color:var(--blue);opacity:.32;animation:emptyFloat 4s ease-in-out infinite}
.empty .em-icon svg{width:100%;height:100%}
@keyframes emptyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty h3{font-size:17px;font-weight:900;color:var(--text);margin-bottom:8px}
.empty p{font-size:13px;color:var(--muted);margin-bottom:20px;max-width:320px;margin-left:auto;margin-right:auto}
.guest-banner{margin:18px var(--pad);padding:16px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(var(--blue-rgb),.12),rgba(var(--blue-rgb),.02));border:1px solid var(--blue-line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:pageIn .5s var(--ease) both}
.guest-banner .gb-ico{width:46px;height:46px;border-radius:14px;background:rgba(var(--blue-rgb),.15);border:1px solid var(--blue-line-2);display:grid;place-items:center;color:var(--blue);flex-shrink:0}
.guest-banner .gb-ico svg{width:22px;height:22px}
.guest-banner .gb-txt{flex:1;min-width:160px;font-size:13.5px;font-weight:700;color:var(--text);line-height:1.6}
.guest-banner .gb-txt small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:3px}
.locked{position:relative}
.locked .lock-blur{filter:blur(14px) saturate(.7);pointer-events:none;user-select:none;transition:filter .3s ease}
.lock-cover{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(180deg,rgba(3,5,8,.15),rgba(3,5,8,.72));backdrop-filter:blur(2px);border-radius:var(--r)}
.lock-cover .lc-icon{width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;margin-bottom:14px;box-shadow:0 12px 34px rgba(var(--blue-rgb),.45);animation:lcFloat 3.4s ease-in-out infinite}
.lock-cover .lc-icon svg{width:32px;height:32px}
@keyframes lcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lock-cover h3{font-size:17px;font-weight:900;margin-bottom:6px}
.lock-cover p{font-size:13px;color:var(--muted);margin-bottom:18px;max-width:280px;line-height:1.7}

.modal.on{opacity:1;pointer-events:auto}

    document.title = b.site_name || 'Respect Live';
    const sf = $('#spFoot');
    if (sf) sf.textContent = (b.site_sub || 'STREAM MONITOR').toUpperCase();
  } catch (e) {
    S.boot = { site_name:'Respect Live', site_sub:'STREAM MONITOR', guest_mode:true, guest_blur:14 };
  }
  try {
    const me = await api('/api/me');
    S.me = me;
    await loadAll();
    renderApp();
  } catch (e) {
    S.guest = true;
    if (S.boot.guest_mode) {
      await loadPreview();
      renderApp();
    } else {
      renderAuth();
    }
  }
  setTimeout(() => {
    const sp = $('#splash');
    if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 900); }
  }, 1300);
}

async function loadAll() {
  await Promise.all([
    loadChannels('kick'), loadChannels('yt'), loadChannels('tg'),
    loadNotifs(), loadSettings()
  ]);
  if (canDiscord()) await loadFeeds();
}
async function loadPreview() {
  try { S.preview = await api('/api/guest-preview'); }
  catch (e) { S.preview = { counts:{ kick:0, yt:0, tg:0 }, live:[] }; }
}
async function loadChannels(kind) {
  try {
    const r = await api('/api/channels/' + kind);
    S.channels[kind] = r.rows || [];
    if (r.limits) S.limits[kind] = r.limits;
  } catch (e) { S.channels[kind] = []; }
}
async function loadFeeds() {
  if (!canDiscord()) { S.feeds = []; return; }
  try {
    const r = await api('/api/discord/feeds');
    S.feeds = r.rows || [];
    S.knownChannels = r.known_channels || {};
    S.watching = r.watching || [];
    S.autoDiscovery = !!r.auto_discovery;
  } catch (e) { S.feeds = []; S.knownChannels = {}; S.watching = []; }
}
async function loadNotifs() {
  try { const r = await api('/api/notifs'); S.notifs = r.rows || []; S.unread = r.unread || 0; }
  catch (e) { S.notifs = []; S.unread = 0; }
}
async function loadSettings() {
  try { S.settings = await api('/api/settings'); }
  catch (e) { S.settings = {}; }
}

function renderAuth() {

      <div class="login-card">
        <div class="login-logo">${IC.logo}</div>
        <div class="login-head">

            <input type="password" name="p" autocomplete="current-password" placeholder="أدخل كلمة المرور" required></label>
          <button class="btn pri wide" type="submit" id="authBtn" style="margin-top:8px">دخول</button>
          <div class="err" id="authErr"></div>

        ${S.boot.guest_mode ? `

          </div>` : ''}
      </div>
    </div>`;
  const form = $('#authForm'), btn = $('#authBtn'), err = $('#authErr');
  form.onsubmit = async (e) => {

    err.textContent = ''; btn.disabled = true;
    try {
      const fd = new FormData();
      fd.append('u', form.u.value.trim());
      fd.append('p', form.p.value);

      if (!r.ok) throw new Error(j.error || j.detail || 'فشل الدخول');
      location.reload();
    } catch (e2) { err.textContent = e2.message; toast(e2.message, 'bad'); btn.disabled = false; }
  };
  const skip = $('#skipBtn');
  if (skip) skip.onclick = async () => { S.guest = true; await loadPreview(); renderApp(); };
}

function renderApp() {

function renderView() {
  const v = $('#view');
  if (!v) return;
  if (S.view === 'home') return viewHome(v);
  if (S.view === 'notifs') return viewNotifs(v);
  if (S.view === 'dc') { if (!canDiscord()) { S.view = 'home'; return renderView(); } return viewDiscord(v); }
  if (S.view === 'acc') return openAccountMenu();
  if (S.view === 'admin') return openAdmin();
  return viewChannels(v, S.view);
}

        </div>
      </div>` : ''}`;

function limitBarHTML(kind) {
  const l = S.limits[kind] || { used:0, limit:10, remaining:10 };
  const pct = l.limit > 0 ? Math.min(100, (l.used / l.limit) * 100) : 0;
  let cls = 'limit-bar';
  if (pct >= 100) cls += ' full';
  else if (pct >= 80) cls += ' warn';
  return {
    html: `<div class="${cls}"><b style="width:${pct}%"></b></div>`,
    text: `استخدمت ${l.used} من ${l.limit} — المتبقي ${l.remaining}`,
    isFull: l.remaining <= 0
  };
}

function viewChannels(v, kind) {
  const rows = isLogged() ? (S.channels[kind] || []) : (S.preview?.live || []);
  const titleMap = { kick:'قنوات كيك', yt:'قنوات يوتيوب', tg:'قنوات تيليجرام' };

      ${isLogged() ? `

        ${isLogged() && !lim.isFull ? `<button class="btn pri" id="emptyAdd">${IC.plus} إضافة قناة</button>` : ''}
        ${!isLogged() ? `<button class="btn pri" id="emptyLogin">تسجيل الدخول</button>` : ''}
      </div>`;
    const eb = $('#emptyAdd'); if (eb) eb.onclick = () => openAddChannel(kind);
    const elb = $('#emptyLogin'); if (elb) elb.onclick = () => { S.guest = false; renderAuth(); };

}

function chCard(kind, r) {
  const card = el('div', 'ch');
  if (!isLogged()) {
    card.innerHTML = `
      <div class="lock-blur" style="padding:14px">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
          <div style="width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2))"></div>
          <div style="flex:1"><div style="height:16px;background:rgba(255,255,255,.15);border-radius:6px;margin-bottom:6px;width:70%"></div><div style="height:12px;background:rgba(255,255,255,.08);border-radius:6px;width:50%"></div></div>
        </div>
        <div style="height:140px;background:rgba(255,255,255,.05);border-radius:12px"></div>
      </div>
      <div class="lock-cover">
        <div class="lc-icon" style="width:52px;height:52px">${IC.lock}</div>
        <h3>سجّل دخولك</h3>
        <p>لرؤية تفاصيل هذه القناة</p>
        <button class="btn pri sm" onclick="window.__goLogin()">دخول سريع</button>
      </div>`;
    return card;
  }
  let slug = '', title = '';
  if (kind === 'kick') { slug = '@' + (r.slug||''); title = r.name || r.slug || ''; }
  else if (kind === 'yt') { slug = r.channel_id||''; title = r.name || r.channel_id || ''; }
  else { slug = r.chat_id||''; title = r.name || r.chat_id || ''; }
  const liveBadge = kind === 'kick' && r.live && r.enabled
    ? '<span class="ch-badge live">مباشر</span>'
    : (!r.enabled ? '<span class="ch-badge off">موقوف</span>' : '');
  const cover = r.banner || r.avatar || '';
  const avatarHTML = r.avatar
    ? `<img src="${esc(r.avatar)}" alt="" onerror="this.style.display='none'">`
    : `<div class="ph">${IC[kind]}</div>`;
  card.innerHTML = `
    <div class="ch-cover">${cover ? `<img src="${esc(cover)}" alt="" onerror="this.remove()">` : ''}${liveBadge}</div>
    <div class="ch-head">${avatarHTML}<div class="ch-info"><b>${esc(title)}</b><small>${esc(slug)}</small></div></div>
    ${kind === 'kick' && r.live && r.title ? `<div class="ch-live"><div>${esc(r.title)}</div><span>${r.viewers||0} 👁</span></div>` : ''}
    ${r.msg ? `<div class="ch-note">${esc(stripTags(r.msg))}</div>` : ''}
    <div class="ch-acts">
      ${kind === 'kick' ? `<a class="btn sm" href="https://kick.com/${esc(r.slug)}" target="_blank" rel="noopener">${IC.play} مشاهدة</a>` : ''}
      ${kind === 'yt' ? `<a class="btn sm" href="https://youtube.com/channel/${esc(r.channel_id)}" target="_blank" rel="noopener">${IC.play} زيارة</a>` : ''}
      ${kind !== 'tg' ? `<button class="btn sm ghost" data-act="edit">${IC.edit} رسالة</button>` : ''}
      <button class="btn sm ghost" data-act="toggle">${r.enabled?'إيقاف':'تفعيل'}</button>
      <button class="btn sm danger" data-act="del">${IC.trash}</button>
    </div>`;
  card.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const act = b.dataset.act;
      if (act === 'del') {
        const ok = await dlgConfirm('حذف هذه القناة نهائياً؟', 'حذف قناة', true);
        if (!ok) return;
        try {
          await api('/api/channels/' + kind + '/' + r.id, { method:'DELETE' });
          toast('تم الحذف', 'ok');
          await loadChannels(kind);
          renderApp();
        } catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'toggle') {
        try {
          await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { enabled: !r.enabled } });
          toast(r.enabled ? 'تم الإيقاف' : 'تم التفعيل', 'ok');
          await loadChannels(kind);
          renderApp();
        } catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'edit') {
        const msg = await modal({
          title:'تخصيص رسالة الإشعار',
          sub:'المتغيرات: {name} {title} {url}',
          html:'<label class="fld"><span>نص الرسالة</span><textarea id="__msg" rows="5">' + esc(r.msg || '') + '</textarea></label>',
          okText:'حفظ'
        });
        if (msg === null || msg === false) return;
        try {
          await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { msg: $('#__msg').value } });
          toast('تم الحفظ', 'ok');
          await loadChannels(kind);
          renderApp();
        } catch (e2) { toast(e2.message, 'bad'); }
      }
    };
  });
  return card;
}
window.__goLogin = () => { S.guest = false; renderAuth(); };

async function openAddChannel(kind) {
  if (!isLogged()) return;
  let suggestions = [];
  try { const r = await api('/api/channels/' + kind + '/suggestions'); suggestions = r.rows || []; }
  catch (e) {}

  const lim = S.limits[kind] || { used:0, limit:10, remaining:10 };
  const labels = {
    kick: { title:'إضافة قناة كيك', label:'اسم القناة (slug)', ph:'xqc' },
    yt:   { title:'إضافة قناة يوتيوب', label:'Channel ID (@handle أو UC...)', ph:'@MrBeast' },
    tg:   { title:'إضافة قناة تيليجرام', label:'@username أو chat_id', ph:'@mychannel' }
  }[kind];

  const sugHTML = suggestions.length ? `
    <div style="margin-top:22px;padding-top:20px;border-top:1px solid var(--line)">
      <div class="sh-sub" style="margin-bottom:6px">${IC.plus} قنوات مُقترحة من الإدارة — اختر ما تريد وأضفه دفعة واحدة</div>
      <div class="sug-grid" id="sugGrid">
        ${suggestions.map(s => `
          <div class="sug-item" data-id="${s.id}">
            <div class="av">${s.avatar ? `<img src="${esc(s.avatar)}" onerror="this.remove()">` : esc((s.name||'?').charAt(0).toUpperCase())}</div>
            <div class="if"><b>${esc(s.name || s.identifier)}</b><small>${esc(s.identifier)}</small></div>
            <div class="ck">${IC.check}</div>
          </div>`).join('')}
      </div>
      <div class="sug-toolbar">
        <span id="sugCount">0 محددة</span>
        <button type="button" id="sugToggleAll">تحديد الكل</button>
      </div>
    </div>` : '';

  const html = `
    <div style="padding:12px 14px;background:rgba(var(--blue-rgb),.06);border:1px solid var(--blue-line);border-radius:12px;margin-bottom:12px;font-size:12.5px;font-weight:800">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span>حدودك</span>
        <span style="color:var(--blue);font-family:var(--font-en)">${lim.used} / ${lim.limit}</span>
      </div>
      <div class="limit-bar"><b style="width:${lim.limit > 0 ? Math.min(100, (lim.used/lim.limit)*100) : 0}%"></b></div>
      <div style="text-align:center;margin-top:8px;color:var(--muted);font-size:11.5px">المتبقي: ${lim.remaining}</div>
    </div>
    <label class="fld"><span>${esc(labels.label)} — أو اتركه فارغاً واختر من المقترحات</span>
      <input type="text" id="__ci" placeholder="${esc(labels.ph)}"></label>
    <label class="fld"><span>الاسم المخصص (اختياري)</span>
      <input type="text" id="__cn" placeholder="اسم مختصر"></label>
    ${sugHTML}`;

  const result = await modal({ title: labels.title, html, okText: 'إضافة', cancelText: 'إلغاء', wide: suggestions.length > 0 });
  if (result === false || result === null) return;

  const val = ($('#__ci')?.value || '').trim();
  const customName = ($('#__cn')?.value || '').trim();

  // أولاً: اذا فيه اقتراحات محددة → bulk-add
  if (suggestions.length) {
    const ids = $$('#sugGrid .sug-item.on').map(x => +x.dataset.id);
    if (ids.length > 0) {
      try {
        const r = await api('/api/channels/' + kind + '/bulk-add', { method:'POST', body: { ids } });
        const added = r.added || 0;
        const failed = r.failed || 0;
        toast('تمت إضافة ' + added + ' قناة' + (failed ? ' — فشل ' + failed : ''), failed && !added ? 'bad' : 'ok');
        if (r.errors && r.errors.length) setTimeout(() => toast(r.errors[0], 'bad'), 400);
        await loadChannels(kind);
        renderApp();
        return;
      } catch (e) { toast(e.message, 'bad'); return; }
    }
  }

  // ثانياً: إضافة يدوية
  if (!val) return toast('اكتب القيمة أو اختر من المقترحات', 'bad');
  try {
    const body = kind === 'kick' ? { slug: val, msg: '' }
               : kind === 'yt'   ? { channel_id: val, name: customName }
                                 : { chat_id: val, name: customName };
    await api('/api/channels/' + kind, { method:'POST', body });
    toast('تمت الإضافة', 'ok');
    await loadChannels(kind);
    renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

            ).join('')}

        </details>` : ''}

  const addBtn = $('#addFeedBtn'); if (addBtn) addBtn.onclick = openAddFeed;

      const name = (S.knownChannels[f.channel_id]?.name) || f.channel_name || f.channel_id;

        <div style="padding:18px">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
            <div style="width:46px;height:46px;border-radius:13px;background:rgba(var(--blue-rgb),.15);border:1px solid var(--blue-line);display:grid;place-items:center;color:var(--blue);flex-shrink:0">${IC.dc}</div>

              <div style="font-weight:900;font-size:15.5px">#${esc(name)}</div>
              <div style="font-family:var(--font-en);font-size:10.5px;color:var(--muted);margin-top:3px">ID: ${esc(f.channel_id)}</div>

          <div style="display:flex;gap:7px;flex-wrap:wrap">
            <button class="btn sm ghost" data-fa="edit">${IC.edit} تعديل القالب</button>
            <button class="btn sm ghost" data-fa="toggle">${f.enabled ? 'إيقاف' : 'تفعيل'}</button>
            <button class="btn sm danger" data-fa="del">${IC.trash} حذف</button>
          </div>
        </div>`;
      card.querySelectorAll('[data-fa]').forEach(b => {
        b.onclick = async () => {
          const act = b.dataset.fa;
          if (act === 'del') {
            const ok = await dlgConfirm('حذف هذا الربط؟', 'تأكيد', true);
            if (!ok) return;
            try {
              await api('/api/discord/feeds/' + f.id, { method:'DELETE' });
              toast('تم الحذف', 'ok');
              await loadFeeds();
              renderApp();
            } catch (e) { toast(e.message, 'bad'); }
          } else if (act === 'toggle') {
            try {
              await api('/api/discord/feeds/' + f.id, { method:'PATCH', body: { enabled: !f.enabled } });
              toast(f.enabled ? 'تم الإيقاف' : 'تم التفعيل', 'ok');
              await loadFeeds();
              renderApp();
            } catch (e) { toast(e.message, 'bad'); }
          } else if (act === 'edit') {
            const tpl = await modal({
              title:'تعديل القالب',
              sub:'المتغيرات: {author} {content} {channel} {source}',
              html:'<label class="fld"><span>القالب</span><textarea id="__tp" rows="5">' + esc(f.template || '') + '</textarea></label>',
              okText:'حفظ'
            });
            if (tpl === null || tpl === false) return;
            try {
              await api('/api/discord/feeds/' + f.id, { method:'PATCH', body: { template: $('#__tp').value } });
              toast('تم الحفظ', 'ok');
              await loadFeeds();
              renderApp();
            } catch (e) { toast(e.message, 'bad'); }
          }
        };
      });
      list.appendChild(card);
    });
  }
}

async function openAddFeed() {
  if (!canDiscord()) return;
  const known = S.knownChannels || {};
  const chs = Object.entries(known);

  if (!chs.length) {
    return modal({
      title:'لا توجد رومات متاحة',
      sub:'البوت لم يكتشف رومات بعد. تأكد من:\n• DISCORD_GUILD_ID صحيح\n• البوت مضاف للسيرفر\n• Message Content Intent مُفعّل',
      okText:'حسناً', cancel:false
    });
  }

  // فلتر الرومات التي لم تُربط بعد
  const linked = new Set(S.feeds.map(f => f.channel_id));
  const available = chs.filter(([id]) => !linked.has(id));

  if (!available.length) {
    return modal({ title:'كل الرومات مربوطة', sub:'ربطت كل الرومات المتاحة بالفعل', okText:'حسناً', cancel:false });
  }

  const html = `
    <label class="fld"><span>اختر الروم</span>
      <select id="__chList">
        ${available.map(([id, info]) =>
          `<option value="${esc(id)}">#${esc(info.name)} — ${esc(info.guild||'')}</option>`
        ).join('')}
      </select>
    </label>
    <label class="fld"><span>نوع المصدر (يساعد في اختيار القالب)</span>
      <select id="__src">
        <option value="generic">عام (كل الرسائل)</option>
        <option value="twitter">تويتر / X فقط</option>
        <option value="youtube">يوتيوب فقط</option>
      </select>
    </label>
    <label class="fld"><span>قالب مخصص (اختياري)</span>
      <textarea id="__tpl" rows="4" placeholder="<b>{author}</b>&#10;{content}"></textarea>
    </label>
    <div class="mu" style="font-size:12px;margin-top:-6px">المتغيرات: {author} {content} {channel} {source}</div>`;
  const r = await modal({ title:'ربط روم ديسكورد', sub:'كل رسالة جديدة في الروم تُرسل لقنواتك على تيليجرام', html, okText:'ربط' });
  if (!r) return;
  const cid = $('#__chList').value;
  if (!cid) return toast('اختر الروم', 'bad');
  try {
    await api('/api/discord/feeds', { method:'POST', body: {
      channel_id: cid,
      channel_name: known[cid]?.name || '',
      template: $('#__tpl').value.trim(),
      source_type: $('#__src').value
    }});
    toast('تم الربط', 'ok');
    await loadFeeds();
    renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

function viewNotifs(v) {
  v.innerHTML = `

      <div class="sec-h">
        <div class="sec-title">الإشعارات <span>.</span></div>

      </div>
      <div id="ntList"></div>
    </div>`;
  const l = $('#ntList');

    l.innerHTML = `<div class="empty"><div class="em-icon">${IC.bell}</div><h3>لا توجد إشعارات</h3><p>ستظهر هنا إشعارات البث والفيديو</p></div>`;
    return;
  }
  S.notifs.forEach(n => {
    const c = el('div', 'notif' + (n.is_read ? '' : ' un'));
    c.innerHTML = `
      ${n.image ? `<img src="${esc(n.image)}" alt="" onerror="this.remove()">` : ''}

        <b>${esc(n.title||'')}</b>

        <div class="nt-t">${fmtTime(n.ts)}</div>
      </div>`;
    if (!n.is_read) {
      c.onclick = async () => {
        try { await api('/api/notifs/read-all', { method:'POST' }); await loadNotifs(); renderApp(); } catch (e) {}
      };

function openAccountMenu() {
  if (!isLogged()) { if (S.guest) { S.guest = false; renderAuth(); } return; }
  const old = $('#accMenu'); if (old) old.remove();
  const m = el('div', 'acc-menu'); m.id = 'accMenu';
  const u = S.me.user;
  const lk = S.limits.kick, ly = S.limits.yt, lt = S.limits.tg;
  m.innerHTML = `
    <div class="acc-head">
      <div class="nm">${esc(u.display || u.username)}</div>
      <div class="mt">@${esc(u.username)} · ${u.role==='owner'?'الإدارة':'مستخدم'}</div>
      <div class="stats-mini">
        <span>${IC.kick} <b>${lk.used}/${lk.limit}</b></span>
        <span>${IC.yt} <b>${ly.used}/${ly.limit}</b></span>
        <span>${IC.tg} <b>${lt.used}/${lt.limit}</b></span>
      </div>
    </div>
    <button class="acc-item" data-a="suggest">${IC.msg} إرسال اقتراح</button>
    ${isOwner() ? `<button class="acc-item" data-a="admin">${IC.shield} لوحة الإدارة</button>` : ''}
    <div class="acc-sep"></div>
    <button class="acc-item danger" data-a="logout">${IC.logout} تسجيل الخروج</button>`;
  document.body.appendChild(m);
  requestAnimationFrame(() => m.classList.add('on'));
  m.querySelectorAll('[data-a]').forEach(b => {
    b.onclick = () => {
      m.classList.remove('on');
      setTimeout(() => m.remove(), 260);
      const a = b.dataset.a;
      if (a === 'logout') doLogout();
      else if (a === 'suggest') openSuggestion();
      else if (a === 'admin') { S.view = 'admin'; renderApp(); }
    };
  });
  setTimeout(() => {
    const close = e => {
      if (!m.contains(e.target) && e.target.id !== 'accBtn' && !e.target.closest('#accBtn')) {
        m.classList.remove('on'); setTimeout(() => m.remove(), 260);
        document.removeEventListener('click', close);
      }
    };
    document.addEventListener('click', close);
  }, 60);
}

async function doLogout() {
  const ok = await dlgConfirm('هل تريد تسجيل الخروج؟', 'تأكيد', true);
  if (!ok) return;
  try { await api('/api/logout', { method:'POST' }); } catch (e) {}
  location.reload();
}

async function openSuggestion() {
  const txt = await modal({

        can_discord: $('#__cd').checked,
      }});
      toast('تم الحفظ', 'ok');
      await loadAdminData();
      renderAdminContent();
    } catch (e) { toast(e.message, 'bad'); }
  } else if (act === 'ban') {
    try {
      await api('/api/admin/users/' + u.id, { method:'PATCH', body: { banned: !u.banned } });
      toast('تم', 'ok');
      await loadAdminData();
      renderAdminContent();
    } catch (e) { toast(e.message, 'bad'); }
  } else if (act === 'del') {
    const ok = await dlgConfirm('حذف المستخدم وكل بياناته؟', 'تأكيد', true);
    if (!ok) return;
    try {
      await api('/api/admin/users/' + u.id, { method:'DELETE' });
      toast('تم الحذف', 'ok');
      await loadAdminData();
      renderAdminContent();
    } catch (e) { toast(e.message, 'bad'); }
  }
}

function renderAdminDefaults(c) {
  const groups = { kick: [], yt: [], tg: [] };
  S.admin.defaults.forEach(d => { if (groups[d.kind]) groups[d.kind].push(d); });
  const kindLabel = k => k === 'kick' ? 'كيك' : k === 'yt' ? 'يوتيوب' : 'تيليجرام';

  c.innerHTML = `
    <div class="sec-h">
      <div class="sec-title">القنوات الافتراضية <span>(${S.admin.defaults.length})</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn pri sm" id="adBulkAdd">${IC.plus} إضافة جماعية</button>
        <button class="btn sm" id="adAddDef">${IC.plus} واحدة</button>
      </div>
    </div>
    <div class="sh-sub">هذي القنوات تظهر للمستخدمين كمقترحات — يختارون ويضيفون دفعة واحدة</div>
    ${['kick','yt','tg'].map(kind => {
      const list = groups[kind];
      return `
        <div class="ad-user-card">
          <div style="font-weight:900;font-size:14.5px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
            <span>${kindLabel(kind)}</span>
            <span class="pill">${list.length}</span>
          </div>
          ${list.length ? `<div id="adDef_${kind}"></div>` : '<div class="mu" style="font-size:12.5px;text-align:center;padding:12px">لا توجد قنوات</div>'}
        </div>`;
    }).join('')}`;

  ['kick','yt','tg'].forEach(kind => {
    const box = $('#adDef_' + kind); if (!box) return;
    groups[kind].forEach(d => {
      const row = el('div');
      row.style.cssText = 'padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap';
      row.innerHTML = `
        <div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;font-family:var(--font-en);font-weight:900;font-size:14px;flex-shrink:0;overflow:hidden">
          ${d.avatar ? `<img src="${esc(d.avatar)}" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()">` : esc((d.name||'?').charAt(0).toUpperCase())}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:900;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.name||d.identifier)}</div>
          <div style="font-family:var(--font-en);font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.identifier)}</div>
        </div>
        <span class="pill ${d.enabled?'ok':'bad'}">${d.enabled?'مفعّل':'موقوف'}</span>
        <div style="display:flex;gap:5px">
          <button class="btn sm ghost" data-da="edit">${IC.edit}</button>
          <button class="btn sm ghost" data-da="toggle">${d.enabled?'إيقاف':'تفعيل'}</button>
          <button class="btn sm danger" data-da="del">${IC.trash}</button>
        </div>`;
      row.querySelectorAll('[data-da]').forEach(b => {
        b.onclick = async () => {
          const act = b.dataset.da;
          if (act === 'del') {
            const ok = await dlgConfirm('حذف القناة الافتراضية؟', 'تأكيد', true);
            if (!ok) return;
            try {
              await api('/api/admin/default-channels/' + d.id, { method:'DELETE' });
              toast('تم', 'ok');
              await loadAdminData();
              renderAdminContent();
            } catch (e) { toast(e.message, 'bad'); }
          } else if (act === 'toggle') {
            try {
              await api('/api/admin/default-channels/' + d.id, { method:'PATCH', body: { enabled: !d.enabled } });
              await loadAdminData();
              renderAdminContent();
            } catch (e) { toast(e.message, 'bad'); }
          } else if (act === 'edit') {
            const nv = await modal({
              title:'تعديل الاسم',
              input: true,
              inputLabel: 'الاسم المعروض',
              inputValue: d.name || '',
              okText:'حفظ'
            });
            if (nv === null || nv === '') return;
            try {
              await api('/api/admin/default-channels/' + d.id, { method:'PATCH', body: { name: nv } });
              toast('تم', 'ok');
              await loadAdminData();
              renderAdminContent();
            } catch (e) { toast(e.message, 'bad'); }
          }
        };
      });
      box.appendChild(row);
    });
  });

  // إضافة جماعية
  $('#adBulkAdd').onclick = async () => {
    const html = `
      <label class="fld"><span>النوع</span>
        <select id="__bkind">
          <option value="kick">كيك</option>
          <option value="yt">يوتيوب</option>
          <option value="tg">تيليجرام</option>
        </select>
      </label>
      <label class="fld">
        <span>القنوات (سطر لكل قناة)</span>
        <textarea id="__btext" rows="10" placeholder="xqc&#10;kaicenat&#10;trainwreckstv | اسم مخصص"></textarea>
      </label>
      <div class="mu" style="font-size:11.5px;margin-top:-6px;line-height:1.8">
        • كيك: slug<br>
        • يوتيوب: @handle أو UC...<br>
        • تيليجرام: @username<br>
        • (اختياري): identifier | اسم مخصص
      </div>`;
    const r = await modal({ title:'إضافة جماعية', html, okText:'إضافة' });
    if (!r) return;
    const kind = $('#__bkind').value;
    const text = $('#__btext').value;
    if (!text.trim()) return toast('اكتب قنوات', 'bad');
    try {
      const res = await api('/api/admin/default-channels/bulk', { method:'POST', body: { kind, text } });
      const added = res.added || 0;
      const failed = res.failed || 0;
      toast('تمت إضافة ' + added + (failed ? ' — فشل ' + failed : ''), failed && !added ? 'bad' : 'ok');
      if (res.errors && res.errors.length) {
        setTimeout(() => toast(res.errors[0], ''), 500);
      }
      await loadAdminData();
      renderAdminContent();
    } catch (e) { toast(e.message, 'bad'); }
  };

  // إضافة واحدة
  $('#adAddDef').onclick = async () => {
    const ok = await modal({
      title:'إضافة قناة افتراضية',
      html:`
        <label class="fld"><span>النوع</span>
          <select id="__kd"><option value="kick">كيك</option><option value="yt">يوتيوب</option><option value="tg">تيليجرام</option></select>
        </label>
        <label class="fld"><span>المعرّف</span><input type="text" id="__id" placeholder="xqc أو UC... أو @channel"></label>
        <label class="fld"><span>الاسم المعروض (اختياري)</span><input type="text" id="__nm"></label>`,
      okText:'إضافة'
    });
    if (!ok) return;
    try {
      await api('/api/admin/default-channels', { method:'POST', body: {
        kind: $('#__kd').value,
        identifier: $('#__id').value.trim(),
        name: $('#__nm').value.trim(),
      }});
      toast('تمت الإضافة', 'ok');
      await loadAdminData();
      renderAdminContent();
    } catch (e) { toast(e.message, 'bad'); }
  };
}

function renderAdminSuggestions(c) {
  const rows = S.admin.suggestions || [];
  c.innerHTML = `
    <div class="sec-h"><div class="sec-title">الاقتراحات <span>(${rows.length})</span></div></div>
    ${rows.length ? '<div id="sugList"></div>' : `
      <div class="empty"><div class="em-icon">${IC.msg}</div><h3>لا توجد اقتراحات</h3><p>ستظهر هنا اقتراحات المستخدمين</p></div>`}`;
  const list = $('#sugList');
  if (!list) return;
  rows.forEach(s => {
    const card = el('div', 'ad-user-card');
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="av" style="width:36px;height:36px;font-size:14px">${esc((s.username||'؟').charAt(0).toUpperCase())}</div>
          <div>
            <b style="font-size:13.5px">${esc(s.username||'زائر')}</b>

          </div>
        </div>
        ${!s.is_read ? '<span class="pill warn">جديد</span>' : ''}
      </div>

      <div class="ad-user-acts" style="margin-top:10px">

    card.querySelectorAll('[data-sa]').forEach(b => {

          const ok = await dlgConfirm('حذف هذا الاقتراح؟', 'تأكيد', true);
          if (!ok) return;
          try {
            await api('/api/admin/suggestions/' + s.id, { method:'DELETE' });
            toast('تم', 'ok');
            await loadAdminData();
            renderAdminContent();
          } catch (e) { toast(e.message, 'bad'); }

          try {
            await api('/api/admin/suggestions/' + s.id, { method:'PATCH', body: { is_read: !s.is_read } });

            renderAdminContent();
          } catch (e) { toast(e.message, 'bad'); }

/* ═══════════════════════════════════════════════════════════
   Event delegation للاقتراحات
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const item = e.target.closest('.sug-item');
  if (item) {
    item.classList.toggle('on');
    const grid = item.closest('.sug-grid');
    if (grid) {
      const selected = grid.querySelectorAll('.sug-item.on').length;
      const counter = document.getElementById('sugCount');
      if (counter) counter.textContent = selected + ' محددة';
    }
    return;
  }
  const toggleAll = e.target.closest('#sugToggleAll');
  if (toggleAll) {
    const grid = document.getElementById('sugGrid');
    if (grid) {
      const items = grid.querySelectorAll('.sug-item');
      const allOn = Array.from(items).every(x => x.classList.contains('on'));
      items.forEach(x => x.classList.toggle('on', !allOn));
      const counter = document.getElementById('sugCount');
      if (counter) counter.textContent = (allOn ? 0 : items.length) + ' محددة';
    }
  }
});

boot();
