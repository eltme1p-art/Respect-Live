      <label class="fld"><span>قالب يوتيوب</span><textarea id="__ty" rows="3" class="mono">${esc(s.tpl_yt||'')}</textarea></label>
      <label class="fld"><span>قالب ديسكورد (عام)</span><textarea id="__td" rows="3" class="mono">${esc(s.tpl_discord||'')}</textarea></label>
      <label class="fld"><span>قالب تويتر</span><textarea id="__tt" rows="3" class="mono">${esc(s.tpl_twitter||'')}</textarea></label>
      <label class="fld"><span>قالب يوتيوب من ديسكورد</span><textarea id="__tyc" rows="3" class="mono">${esc(s.tpl_youtube_dc||'')}</textarea></label>
      <div class="mu" style="font-size:11.5px;margin-top:-4px">المتغيرات: {author} {author_no_at} {content} {title} {description} {url} {channel} {source} {site}</div>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">البوت</div>
      <label class="fld"><span>اسم البوت المخصص</span><input type="text" id="__bn" value="${esc(s.bot_name_custom||'')}"></label>
      <label class="fld"><span>رابط دعوة البوت</span><input type="text" id="__bi" value="${esc(s.bot_invite_url||'')}"></label>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:14px">الحدود والزوار</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <label class="fld"><span>حد كيك</span><input type="number" id="__lk" value="${esc(s.lim_kick||'10')}"></label>
        <label class="fld"><span>حد يوتيوب</span><input type="number" id="__ly" value="${esc(s.lim_yt||'5')}"></label>
        <label class="fld"><span>حد تيليجرام</span><input type="number" id="__lt" value="${esc(s.lim_tg||'3')}"></label>
      </div>
      <label style="display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:800;cursor:pointer"><input type="checkbox" id="__gm" ${s.guest_mode==='1'?'checked':''}> السماح بالتصفح كزائر</label>
    </div>
    <button class="btn pri wide" id="adSaveSettings" style="margin-bottom:20px">${IC.check} حفظ الإعدادات</button>`;
  $('#adSaveSettings').onclick = async () => {
    try {
      await api('/api/settings', { method:'POST', body: {
        site_name: $('#__sn').value, site_sub: $('#__ss').value, hero_title: $('#__ht').value, hero_accent: $('#__ha').value, hero_text: $('#__hx').value,
        btn_kick: $('#__bk').value, btn_yt: $('#__by').value, btn_tg: $('#__btg').value, btn_discord: $('#__bdc').value,
        tpl_kick: $('#__tk').value, tpl_yt: $('#__ty').value, tpl_discord: $('#__td').value, tpl_twitter: $('#__tt').value, tpl_youtube_dc: $('#__tyc').value,
        bot_name_custom: $('#__bn').value, bot_invite_url: $('#__bi').value,
        lim_kick: $('#__lk').value, lim_yt: $('#__ly').value, lim_tg: $('#__lt').value,
        guest_mode: $('#__gm').checked ? '1' : '0',
      }});
      toast('تم الحفظ', 'ok'); await loadSettings();
    } catch (e) { toast(e.message, 'bad'); }
  };
}

async function renderAdminSystem(c) {
  await loadSettings();
  const s = S.settings || {};
  const isMnt = s.maintenance === '1';
  const modeInfo = discordModeLabel(S.discordMode);
  const selfBot = S.discordMode === 'self-bot';
  const isDisabled = S.discordMode === 'disabled';
  const isFailed = S.discordMode === 'failed';

  c.innerHTML = `
    <div class="sec-h"><div class="sec-title">النظام <span>.</span></div></div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:12px">${IC.dc} حالة الديسكورد</div>
      <div class="dc-mode-row" style="margin-bottom:14px">
        <div class="dc-mode-card ${modeInfo.cls}">
          <div class="dc-label">MODE</div>
          <div class="dc-val">${esc(modeInfo.label)}</div>
          <div class="dc-sub">${esc(modeInfo.sub)}</div>
        </div>
        <div class="dc-mode-card ${S.discordEnabled?'bot':'disabled'}">
          <div class="dc-label">ENABLED</div>
          <div class="dc-val">${S.discordEnabled?'ON':'OFF'}</div>
          <div class="dc-sub">DISCORD_ENABLE</div>
        </div>
        <div class="dc-mode-card ${S.botReady?'bot':'failed'}">
          <div class="dc-label">READY</div>
          <div class="dc-val">${S.botReady?'YES':'NO'}</div>
          <div class="dc-sub">${S.botReady?'متصل':'غير متصل'}</div>
        </div>
      </div>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.9">
        <div>🔹 <b style="color:var(--purple)">Self-Bot:</b> يستخدم توكنك الشخصي — يقرأ كل الرسائل</div>
        <div>🔹 <b style="color:#8b9dff">Bot:</b> بوت رسمي — قد لا يقرأ رسائل البوتات</div>
        <div>🔹 <b style="color:var(--muted)">Disabled:</b> معطّل من <code>.env</code> (DISCORD_ENABLE=0)</div>
        <div>🔹 <b style="color:var(--red)">Failed:</b> فشل — تحقق من التوكن والمكتبات</div>
      </div>
      ${isDisabled ? `<div style="padding:10px 14px;background:rgba(124,135,153,.10);border:1px solid rgba(124,135,153,.3);border-radius:10px;font-size:12.5px;margin-top:10px">💡 لتشغيله: <code>DISCORD_ENABLE=1</code> في <code>.env</code> ثم أعد التشغيل</div>` : ''}
      ${isFailed ? `<div style="padding:10px 14px;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.3);border-radius:10px;font-size:12.5px;margin-top:10px">⚠️ تحقق من: <code>DISCORD_BOT_TOKEN</code> + ثبّت <code>discord.py-self</code> إذا تريد Self-Bot</div>` : ''}
      ${selfBot ? `<div style="padding:10px 14px;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.3);border-radius:10px;font-size:12.5px;margin-top:10px;color:var(--purple)">⚠️ Self-Bot مخالف لشروط ديسكورد — الحساب معرّض للحظر</div>` : ''}
    </div>
    <div class="ad-user-card" style="${isMnt ? 'border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.05)' : ''}">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;gap:10px">${IC.wrench} وضع الصيانة ${isMnt ? '<span class="pill bad">مفعّل</span>' : '<span class="pill ok">معطّل</span>'}</div>
      <div class="mu" style="font-size:12.5px;line-height:1.7;margin-bottom:12px">الزوار والمستخدمون يشوفون شاشة "صيانة" — الأدمن فقط يدخل.</div>
      <label class="fld"><span>نص الصيانة</span><textarea id="__mtxt" rows="3">${esc(s.maintenance_text||'الموقع في صيانة مؤقتة — نرجع قريباً')}</textarea></label>
      <button class="btn ${isMnt?'ghost':'pri'} wide" id="__mtoggle" style="margin-bottom:8px">${isMnt ? IC.x + ' إيقاف' : IC.check + ' تفعيل'}</button>
    </div>
    <div class="ad-user-card">
      <div style="font-weight:900;font-size:14.5px;margin-bottom:8px">${IC.refresh} أدوات</div>
      <button class="btn ghost wide" id="__refreshDC">${IC.refresh} تحديث كاش ديسكورد</button>
    </div>`;
  $('#__mtoggle').onclick = async () => {
    try {
      const nv = !isMnt;
      await api('/api/admin/maintenance', { method:'POST', body: { enabled: nv, text: $('#__mtxt').value } });
      toast(nv ? 'تم تفعيل الصيانة' : 'تم إيقاف', 'ok');
      S.settings.maintenance = nv ? '1' : '0';
      S.settings.maintenance_text = $('#__mtxt').value;
      renderAdminSystem(c);
    } catch (e) { toast(e.message, 'bad'); }
  };
  $('#__refreshDC').onclick = async () => {
    try { const r = await api('/api/discord/refresh', { method:'POST' }); toast('تم — ' + (r.channels||0) + ' روم', 'ok'); await loadFeeds(); } catch (e) { toast(e.message, 'bad'); }
  };
}

/* EVENT DELEGATION */
document.addEventListener('click', e => {
  const item = e.target.closest('.sug-item');
  if (item) {
    item.classList.toggle('on');
    const grid = item.closest('.sug-grid');
    if (grid) {
      const sel = grid.querySelectorAll('.sug-item.on').length;
      const counter = document.getElementById('sugCount');
      if (counter) counter.textContent = sel + ' محددة';
    }
    return;
  }
  const toggleAll = e.target.closest('#sugToggleAll');
  if (toggleAll) {
    const grid = document.getElementById('sugGrid');
    if (grid) {
      const items = grid.querySelectorAll('.sug-item');
      const allOn = Array.from(items).every(x => x.classList.contains('on'));
      items.forEach(x => x.classList.toggle('on', !allOn));
      const counter = document.getElementById('sugCount');
      if (counter) counter.textContent = (allOn ? 0 : items.length) + ' محددة';
    }
  }
});

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') { const m = $('#modal'); if (m && m.classList.contains('on')) m.classList.remove('on'); }
});

boot();
</script>
</body>
</html>
