<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030508">
<title>Respect Live</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0b55ea;--blue2:#1b67ff;--blue-rgb:11,85,234;
  --bg:#030508;--bg-2:#05070d;--panel:#0a0f18;
  --card:linear-gradient(155deg,#0d1320 0%,#050810 100%);
  --text:#f4f6fa;--text-2:#c8cfdd;--muted:#7c8799;--muted-2:#5a6473;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --blue-line:rgba(var(--blue-rgb),.28);--blue-line-2:rgba(var(--blue-rgb),.45);
  --green:#10b981;--red:#ef4444;--gold:#f5b400;--orange:#f59e0b;--purple:#8b5cf6;
  --glow-sm:0 0 20px rgba(var(--blue-rgb),.25);
  --glow:0 0 30px rgba(var(--blue-rgb),.35);
  --shadow-sm:0 4px 16px rgba(0,0,0,.35);
  --shadow:0 12px 34px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --font-ar:'Tajawal',system-ui,sans-serif;
  --font-en:'Orbitron',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,.61,.36,1);
  --r:20px;--r-sm:14px;--r-xs:10px;
  --pad:clamp(16px,5vw,28px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
html{scroll-behavior:smooth;background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ar);font-size:15px;line-height:1.7;min-height:100vh;overflow-x:hidden;padding-bottom:calc(112px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background-image:linear-gradient(rgba(var(--blue-rgb),.035) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--blue-rgb),.035) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 95% 85% at 50% 35%,#000 35%,transparent 92%);mask-image:radial-gradient(ellipse 95% 85% at 50% 35%,#000 35%,transparent 92%)}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(circle at 10% 15%,rgba(var(--blue-rgb),.10),transparent 40%),radial-gradient(circle at 92% 68%,rgba(var(--blue-rgb),.08),transparent 42%),radial-gradient(circle at 50% 110%,rgba(var(--blue-rgb),.06),transparent 55%)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
::selection{background:rgba(var(--blue-rgb),.35);color:#fff}
#splash{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(var(--blue-rgb),.20),transparent 62%),var(--bg);transition:opacity .75s var(--ease),transform .75s var(--ease)}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:26px}
.sp-logo{width:104px;height:104px;border-radius:28px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;box-shadow:0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.5);animation:spGlow 2.4s ease-in-out infinite;overflow:hidden}
.sp-logo img{width:100%;height:100%;object-fit:cover}
.sp-logo svg{width:52px;height:52px}
@keyframes spGlow{0%,100%{box-shadow:0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.45)}50%{box-shadow:0 0 0 26px rgba(var(--blue-rgb),0),0 20px 60px rgba(var(--blue-rgb),.6)}}
.sp-dots{display:flex;gap:9px}
.sp-dots i{width:10px;height:10px;border-radius:50%;background:var(--blue);animation:spBounce 1.5s ease-in-out infinite;box-shadow:0 0 12px rgba(var(--blue-rgb),.6)}
.sp-dots i:nth-child(2){animation-delay:.18s}
.sp-dots i:nth-child(3){animation-delay:.36s}
@keyframes spBounce{0%,80%,100%{transform:scale(.35);opacity:.35}40%{transform:scale(1);opacity:1}}
.sp-foot{font-family:var(--font-en);font-size:11px;letter-spacing:4px;font-weight:800;color:var(--muted);opacity:0;animation:fadeIn .8s .9s forwards}
@keyframes fadeIn{to{opacity:1}}
#maintenance{position:fixed;inset:0;z-index:9500;display:none;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle at 50% 40%,rgba(var(--blue-rgb),.20),transparent 62%),var(--bg)}
#maintenance.on{display:grid}
.mnt-wrap{max-width:520px;display:flex;flex-direction:column;align-items:center;gap:24px}
.mnt-gear{width:96px;height:96px;border-radius:26px;background:rgba(var(--blue-rgb),.15);border:1px solid var(--blue-line);display:grid;place-items:center;color:var(--blue);animation:mntSpin 4s linear infinite}
.mnt-gear svg{width:48px;height:48px}
@keyframes mntSpin{to{transform:rotate(360deg)}}
.mnt-title{font-family:var(--font-en);font-size:clamp(28px,7vw,48px);font-weight:900;letter-spacing:4px;margin-bottom:8px}
.mnt-title span{color:var(--blue);text-shadow:var(--glow)}
.mnt-text{color:var(--muted);font-size:15px;line-height:1.9;max-width:420px}
.mnt-bar{width:220px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:16px}
.mnt-bar b{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:99px;animation:mntSlide 1.8s ease-in-out infinite}
@keyframes mntSlide{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.page{display:none}
.page.on{display:block;animation:pageIn .45s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.top{position:sticky;top:0;z-index:50;padding:calc(14px + env(safe-area-inset-top)) var(--pad) 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(3,5,8,.94) 60%,rgba(3,5,8,0));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid transparent;transition:border-color .3s ease,background .3s ease}
.top.scrolled{border-bottom-color:var(--line);background:linear-gradient(rgba(3,5,8,.97) 90%,rgba(3,5,8,.85))}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.brand-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;flex-shrink:0;box-shadow:0 0 16px rgba(var(--blue-rgb),.42);overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-logo svg{width:22px;height:22px;color:#fff}
.brand-txt{min-width:0}
.brand-name{font-family:var(--font-en);font-size:15px;font-weight:900;letter-spacing:2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name span{color:var(--blue);text-shadow:var(--glow-sm)}
.brand-sub{font-family:var(--font-en);font-size:9px;font-weight:800;letter-spacing:2px;color:var(--muted);margin-top:2px}
.hdr-acts{display:flex;align-items:center;gap:8px}
.hdr-btn{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--text);transition:.22s var(--ease-soft)}
.hdr-btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.hdr-btn:active{transform:scale(.95)}
.hdr-btn svg{width:19px;height:19px}
.hdr-btn .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg);font-family:var(--font-en);line-height:1}
.avatar-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;font-family:var(--font-en);font-weight:900;font-size:15px;cursor:pointer;position:relative;flex-shrink:0;box-shadow:0 0 16px rgba(var(--blue-rgb),.42);transition:.22s var(--ease-soft);overflow:hidden}
.avatar-btn img{width:100%;height:100%;object-fit:cover}
.avatar-btn:hover{transform:scale(1.06)}
.avatar-btn:active{transform:scale(.95)}
.avatar-btn .st{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.avatar-btn.guest{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);box-shadow:none}
.avatar-btn.guest svg{width:19px;height:19px}
.tabbar{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(92%,460px);height:66px;background:rgba(10,15,24,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:36px;display:flex;justify-content:space-around;align-items:center;z-index:100;padding:0 8px;box-shadow:0 20px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
.tabbar button{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative;transition:.28s var(--ease-soft)}
.tabbar button svg{width:22px;height:22px;color:currentColor;transition:.28s var(--ease-soft)}
.tabbar button:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tabbar button:active{transform:scale(.92)}
.tabbar button.on{color:var(--blue2)}
.tabbar button.on svg{transform:translateY(-2px) scale(1.15);filter:drop-shadow(0 0 8px var(--blue))}
.tabbar button.on::after{content:"";position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--blue);border-radius:3px;box-shadow:var(--glow-sm)}
.login-page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;position:relative;animation:pageIn .6s var(--ease) both}
.login-card{position:relative;width:min(430px,100%);padding:38px 30px 32px;background:var(--card);border:1px solid var(--line-2);border-radius:26px;box-shadow:var(--shadow-lg),0 0 80px rgba(var(--blue-rgb),.10)}
.login-card::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);box-shadow:var(--glow);border-radius:2px}
.login-logo{width:92px;height:92px;border-radius:26px;margin:0 auto 20px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;box-shadow:0 0 0 0 rgba(var(--blue-rgb),.6),0 20px 60px rgba(var(--blue-rgb),.45);animation:spGlow 2.6s infinite;overflow:hidden}
.login-logo img{width:100%;height:100%;object-fit:cover}
.login-logo svg{width:46px;height:46px}
.login-head{text-align:center;margin-bottom:28px}
.login-head h1{font-family:var(--font-en);font-size:22px;letter-spacing:3px;font-weight:900;margin-bottom:8px}
.login-head h1 span{color:var(--blue);text-shadow:var(--glow-sm)}
.login-head p{color:var(--muted);font-size:12.5px;letter-spacing:.3px}
.fld{display:block;margin:16px 0}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:9px;font-weight:800;letter-spacing:.3px}
input[type="text"],input[type="password"],input[type="number"],input[type="email"],input[type="search"],input[type="url"],textarea,select{-webkit-appearance:none;appearance:none;display:block;width:100%;font-family:inherit;font-size:15px;font-weight:600;color:var(--text);background:rgba(5,8,16,.85);border:1.5px solid var(--line-2);border-radius:14px;padding:14px 16px;min-height:52px;line-height:1.4;transition:border-color .22s var(--ease-soft),box-shadow .22s var(--ease-soft),background .22s var(--ease-soft);outline:none}
input::placeholder,textarea::placeholder{color:var(--muted-2);font-weight:500}
input:hover,textarea:hover,select:hover{border-color:var(--line-2)}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:rgba(8,12,22,.9);box-shadow:0 0 0 4px rgba(var(--blue-rgb),.14),0 0 20px rgba(var(--blue-rgb),.20)}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--text);-webkit-box-shadow:0 0 0 1000px #0a0f18 inset;transition:background-color 9999s ease-out;caret-color:var(--text)}
textarea{resize:vertical;min-height:110px;line-height:1.7;font-family:inherit}
textarea.mono{font-family:monospace;font-size:13px;direction:ltr;text-align:left}
select{cursor:pointer;background-image:none}
select option{background:var(--panel);color:var(--text)}
input[type="checkbox"]{-webkit-appearance:checkbox;appearance:checkbox;width:20px;height:20px;min-height:auto;padding:0;accent-color:var(--blue);cursor:pointer;display:inline-block;vertical-align:middle}
input[type="color"]{-webkit-appearance:none;appearance:none;border:none;width:100%;height:52px;background:transparent;cursor:pointer;border-radius:14px;overflow:hidden;padding:0}
input[type="color"]::-webkit-color-swatch-wrapper{padding:4px}
input[type="color"]::-webkit-color-swatch{border:1.5px solid var(--line-2);border-radius:10px}
.err{color:#f87171;font-size:12.5px;text-align:center;min-height:20px;margin-top:12px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--line-2);color:var(--text);font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.22s var(--ease-soft);position:relative;overflow:hidden;min-height:48px}
.btn:hover{transform:translateY(-1px);border-color:var(--blue)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 28px rgba(var(--blue-rgb),.30)}
.btn.pri:hover{background:var(--blue2);box-shadow:0 14px 38px rgba(var(--blue-rgb),.45)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#dc2626}
.btn.ghost{background:transparent}
.btn.ai{background:linear-gradient(135deg,#8b5cf6,#6366f1);border-color:#8b5cf6;color:#fff}
.btn.ai:hover{box-shadow:0 14px 38px rgba(139,92,246,.5)}
.btn.sm{padding:9px 14px;font-size:12px;border-radius:11px;min-height:auto}
.btn.wide{width:100%;padding:15px}
.btn svg{width:15px;height:15px;flex-shrink:0}
.hero{padding:42px var(--pad) 32px;text-align:center;position:relative;animation:pageIn .55s var(--ease) both}
.hero-lbl{font-family:var(--font-en);font-size:11px;font-weight:900;letter-spacing:4px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:9px}
.hero-lbl span{color:var(--blue);font-size:14px;text-shadow:var(--glow-sm)}
.hero h1{font-family:var(--font-en);font-size:clamp(36px,9vw,64px);line-height:.92;letter-spacing:4px;font-weight:900;margin:22px 0 14px}
.hero h1 span{color:var(--blue);display:inline-block;transform:skewX(-8deg);text-shadow:var(--glow)}
.hero p{color:var(--muted);font-size:13.5px;max-width:560px;margin:0 auto;line-height:1.85;font-weight:500}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px var(--pad);animation:pageIn .6s var(--ease) .1s both}
@media(max-width:640px){.features{grid-template-columns:1fr}}
.feat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;transition:.28s var(--ease-soft);position:relative;overflow:hidden}
.feat:hover{transform:translateY(-3px);border-color:var(--blue-line);box-shadow:0 12px 34px rgba(var(--blue-rgb),.14)}
.feat-ico{width:56px;height:56px;border-radius:16px;background:rgba(var(--blue-rgb),.12);border:1px solid var(--blue-line);display:grid;place-items:center;color:var(--blue);margin:0 auto 14px}
.feat-ico svg{width:26px;height:26px}
.feat b{display:block;font-size:15px;font-weight:900;margin-bottom:6px}
.feat p{color:var(--muted);font-size:12.5px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:24px var(--pad);animation:pageIn .6s var(--ease) .15s both}
.stats .s{background:var(--panel);padding:18px 8px;text-align:center;transition:.24s var(--ease-soft)}
.stats .s:hover{background:rgba(var(--blue-rgb),.06)}
.stats .s b{display:block;font-family:var(--font-en);font-size:26px;font-weight:900;line-height:1;color:var(--text)}
.stats .s b.blue{color:var(--blue);text-shadow:var(--glow-sm)}
.stats .s small{display:block;font-family:var(--font-en);font-size:10px;font-weight:800;color:var(--muted);margin-top:6px;letter-spacing:1.5px}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.live-strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * var(--pad));padding:4px var(--pad) 10px}
.live-strip::-webkit-scrollbar{display:none}
.live-card{flex:0 0 260px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.28s var(--ease-soft);position:relative}
.live-card:hover{border-color:var(--blue-line);transform:translateY(-2px)}
.live-card-cover{height:120px;background:linear-gradient(135deg,rgba(var(--blue-rgb),.3),rgba(0,0,0,.5));position:relative;overflow:hidden}
.live-card-cover img{width:100%;height:100%;object-fit:cover}
.live-card-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(3,5,8,.92))}
.live-card-body{padding:0 14px 14px;margin-top:-20px;position:relative;z-index:2}
.live-card-body b{display:block;font-size:14px;font-weight:900;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-card-body small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-card-body .v{color:#f87171;font-family:var(--font-en);font-weight:900;font-size:11px}
.sec{padding:22px var(--pad);animation:pageIn .45s var(--ease) both}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.sec-title{font-size:22px;font-weight:900;letter-spacing:.2px}
.sec-title span{color:var(--blue);transform:skewX(-8deg);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.ch{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:transform .32s var(--ease-soft),border-color .32s ease,box-shadow .32s ease}
.ch::before{content:"";position:absolute;top:10px;left:10px;width:14px;height:14px;border-top:2px solid var(--blue);border-left:2px solid var(--blue);opacity:.4;pointer-events:none;border-radius:4px 0 0 0}
.ch:hover{transform:translateY(-3px);border-color:var(--blue-line);box-shadow:0 18px 44px rgba(var(--blue-rgb),.16)}
.ch-cover{height:118px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(var(--blue-rgb),.28),rgba(0,0,0,.5))}
.ch-cover img{width:100%;height:100%;object-fit:cover;transition:transform .55s var(--ease-soft)}
.ch:hover .ch-cover img{transform:scale(1.05)}
.ch-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(3,5,8,.92))}
.ch-badge{position:absolute;top:12px;right:12px;z-index:3;font-size:10.5px;padding:5px 11px;border-radius:9px;font-weight:900;font-family:var(--font-en);letter-spacing:.5px;display:inline-flex;align-items:center;gap:5px}
.ch-badge.live{background:var(--red);color:#fff;animation:chPulse 1.9s infinite}
.ch-badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.ch-badge.off{background:rgba(255,255,255,.14);color:var(--text);backdrop-filter:blur(8px)}
.ch-badge.nosend{background:rgba(245,158,11,.9);color:#fff;backdrop-filter:blur(8px);top:auto;bottom:12px;right:12px}
@keyframes chPulse{70%{box-shadow:0 0 0 12px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.ch-head{display:flex;align-items:flex-end;gap:12px;padding:0 18px;margin-top:-28px;position:relative;z-index:2}
.ch-head img{width:56px;height:56px;border-radius:15px;object-fit:cover;border:3px solid var(--bg);background:var(--panel);flex-shrink:0;box-shadow:0 0 16px rgba(var(--blue-rgb),.35)}
.ch-head .ph{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;border:3px solid var(--bg);flex-shrink:0;color:#fff}

.kw-img-prev img{width:100%;height:100%;object-fit:cover}
.kw-img-row input[type=text]{flex:1}
.bot-list{max-height:240px;overflow-y:auto;display:grid;gap:6px;padding:8px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.bot-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;transition:.15s}
.bot-item:hover{background:rgba(var(--blue-rgb),.06)}
.bot-item.on{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.3)}
.bot-item .av{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#5865f2,#4752c4);display:grid;place-items:center;color:#fff;flex-shrink:0;overflow:hidden;font-size:13px;font-weight:900}
.bot-item .av img{width:100%;height:100%;object-fit:cover}
.bot-item .if{flex:1;min-width:0}
.bot-item b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bot-item small{display:block;font-size:10.5px;color:var(--muted);font-family:var(--font-en);margin-top:1px}
.bot-item .st{font-size:10.5px;padding:3px 9px;border-radius:10px;font-weight:900;flex-shrink:0}
.bot-item.on .st{background:rgba(239,68,68,.2);color:var(--red)}
.bot-item:not(.on) .st{background:rgba(255,255,255,.05);color:var(--muted)}
.ai-status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-size:12.5px;font-weight:800;margin-bottom:12px}
.ai-status.ok{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.28);color:var(--green)}
.ai-status.bad{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.28);color:var(--red)}
.ai-status.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);color:var(--orange)}
.dc-mode-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dc-mode-card{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);flex:1;min-width:140px;text-align:center}
.dc-mode-card .dc-label{font-family:var(--font-en);font-size:10px;font-weight:900;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}
.dc-mode-card .dc-val{font-family:var(--font-en);font-size:16px;font-weight:900;letter-spacing:1px}
.dc-mode-card.self-bot{background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(99,102,241,.06));border-color:rgba(139,92,246,.35)}
.dc-mode-card.self-bot .dc-val{color:var(--purple);text-shadow:0 0 12px rgba(139,92,246,.5)}
.dc-mode-card.bot{background:linear-gradient(135deg,rgba(88,101,242,.12),rgba(71,82,196,.06));border-color:rgba(88,101,242,.35)}
.dc-mode-card.bot .dc-val{color:#8b9dff;text-shadow:0 0 12px rgba(88,101,242,.5)}
.dc-mode-card.disabled{background:rgba(124,135,153,.06);border-color:rgba(124,135,153,.25)}
.dc-mode-card.disabled .dc-val{color:var(--muted)}
.dc-mode-card.failed{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.35)}
.dc-mode-card.failed .dc-val{color:var(--red);text-shadow:0 0 12px rgba(239,68,68,.5)}
.dc-mode-card .dc-sub{font-size:10.5px;color:var(--muted);margin-top:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:rgba(var(--blue-rgb),.28);border-radius:10px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--blue-rgb),.48)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* UTILS */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const stripTags = s => String(s ?? '').replace(/<[^>]+>/g,'').trim();
const fmtTime = ts => {
  if (!ts) return '';
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return 'الآن';
  if (d < 3600) return 'قبل ' + Math.floor(d/60) + ' دقيقة';
  if (d < 86400) return 'قبل ' + Math.floor(d/3600) + ' ساعة';
  if (d < 604800) return 'قبل ' + Math.floor(d/86400) + ' يوم';
  return new Date(ts*1000).toLocaleDateString('ar-EG');
};

function discordModeLabel(mode) {
  const m = {
    'self-bot': { label: 'SELF-BOT', sub: 'توكن شخصي', cls: 'self-bot' },
    'bot':      { label: 'BOT', sub: 'بوت رسمي', cls: 'bot' },
    'disabled': { label: 'DISABLED', sub: 'معطّل', cls: 'disabled' },
    'failed':   { label: 'FAILED', sub: 'فشل الاتصال', cls: 'failed' },
  };
  return m[mode] || { label: (mode || 'UNKNOWN').toUpperCase(), sub: '', cls: 'disabled' };
}

async function api(path, opts={}) {
  const o = { credentials:'include', method: opts.method || 'GET', headers: {} };
  if (opts.body !== undefined) { o.headers['content-type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  if (opts.form) o.body = opts.form;
  try {
    const r = await fetch(path, o);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const err = new Error(j.error || j.detail || 'خطأ في الاتصال'); err.status = r.status; throw err; }
    return j;
  } catch (e) { throw e; }
}

function toast(msg, kind) {
  const t = el('div', 'toast ' + (kind || ''));
  const icon = kind === 'ok'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>'
    : kind === 'bad'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" width="14" height="14"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" width="14" height="14"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
  t.innerHTML = icon + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(t);
  requestAnimationFrame(() => t.classList.add('on'));
  setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 400); }, 3600);
}

function modal(opts) {
  return new Promise(resolve => {
    const m = $('#modal'), sh = $('#sheet');
    sh.className = 'sheet' + (opts.small ? ' sm' : '') + (opts.wide ? ' wide' : '') + (opts.xwide ? ' xwide' : '');
    let html = '<div class="grab"></div>';
    if (opts.title) html += '<div class="sh-title">' + esc(opts.title) + '</div>';
    if (opts.sub) html += '<div class="sh-sub">' + esc(opts.sub) + '</div>';
    if (opts.html) html += opts.html;
    if (opts.input) html += '<label class="fld"><span>' + esc(opts.inputLabel||'') + '</span><input type="text" id="__mi" value="' + esc(opts.inputValue||'') + '" placeholder="' + esc(opts.placeholder||'') + '"></label>';
    html += '<div class="row">';
    if (opts.cancel !== false) html += '<button class="btn ghost" id="__mc" type="button">' + esc(opts.cancelText || 'إلغاء') + '</button>';
    html += '<button class="btn ' + (opts.danger ? 'danger' : opts.ai ? 'ai' : 'pri') + '" id="__mo" type="button">' + esc(opts.okText || 'تأكيد') + '</button></div>';
    sh.innerHTML = html;
    m.classList.add('on');
    const close = v => { m.classList.remove('on'); setTimeout(() => resolve(v), 320); };
    const okBtn = $('#__mo'), cBtn = $('#__mc');
    if (okBtn) okBtn.onclick = () => close(opts.input ? ($('#__mi').value || '') : true);
    if (cBtn) cBtn.onclick = () => opts.input ? close(null) : close(false);
    m.onclick = e => { if (e.target === m) close(opts.input ? null : false); };
    if (opts.input) setTimeout(() => { const i = $('#__mi'); if (i) i.focus(); }, 200);
    if (opts.onReady) setTimeout(opts.onReady, 60);
  });
}

function applyTheme(theme) {
  if (!theme) return;
  const root = document.documentElement.style;
  if (theme.c1) root.setProperty('--bg', theme.c1);
  if (theme.c2) root.setProperty('--panel', theme.c2);
  if (theme.ac) {
    root.setProperty('--blue', theme.ac);
    root.setProperty('--blue2', theme.ac);
    const hex = theme.ac.replace('#','');
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    root.setProperty('--blue-rgb', `${r},${g},${b}`);
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && theme.c1) meta.setAttribute('content', theme.c1);
}

/* SERVICE WORKER + PUSH */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.t === 'push') { loadNotifs().then(() => { if (S.view === 'notifs') renderView(); updateBadge(); }); }
  });
}
async function checkPushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { S.pushEnabled = false; return; }
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); S.pushEnabled = !!sub; }
  catch (e) { S.pushEnabled = false; }
}
function urlB64ToU8(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  s += '='.repeat((4 - s.length % 4) % 4);
  const raw = atob(s); const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return toast('المتصفح لا يدعم الإشعارات', 'bad');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('تم رفض الإذن', 'bad');
    const reg = await navigator.serviceWorker.ready;
    const keyRes = await api('/api/push/key');
    if (!keyRes.key) return toast('Push غير مفعّل من السيرفر', 'bad');
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToU8(keyRes.key) });
    await api('/api/push/subscribe', { method:'POST', body: sub.toJSON() });
    S.pushEnabled = true; toast('تم تفعيل الإشعارات', 'ok');
    const old = $('#accMenu'); if (old) old.remove(); renderApp();
  } catch (e) { toast(e.message || 'فشل تفعيل الإشعارات', 'bad'); }
}
async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await api('/api/push/unsubscribe', { method:'POST', body: { endpoint: sub.endpoint } }); await sub.unsubscribe(); }
    S.pushEnabled = false; toast('تم إيقاف الإشعارات', 'ok');
    const old = $('#accMenu'); if (old) old.remove(); renderApp();
  } catch (e) { toast(e.message || 'فشل الإيقاف', 'bad'); }
}
async function testPush() {
  try { const r = await api('/api/push/test', { method:'POST' }); toast('أُرسل ' + (r.sent || 0) + ' إشعار', 'ok'); }
  catch (e) { toast(e.message, 'bad'); }
}

async function boot() {
  try {
    const b = await api('/api/boot');
    S.boot = b;
    S.maintenance = !!b.maintenance;
    if (b.discord_mode) S.discordMode = b.discord_mode;
    if (typeof b.discord_enabled === 'boolean') S.discordEnabled = b.discord_enabled;
    document.title = b.site_name || 'Respect Live';
    const sf = $('#spFoot'); if (sf) sf.textContent = (b.site_sub || 'STREAM MONITOR').toUpperCase();
    const sp = $('#spLogo');
    if (sp && b.site_logo) sp.innerHTML = '<img src="' + esc(b.site_logo) + '" alt="">';
    if (b.theme) applyTheme(b.theme);
  } catch (e) {
    S.boot = { site_name:'Respect Live', site_sub:'STREAM MONITOR', guest_mode:true, guest_blur:14 };
  }
  try {
    const me = await api('/api/me');
    S.me = me;
    if (me.discord_mode) S.discordMode = me.discord_mode;
    if (typeof me.discord_enabled === 'boolean') S.discordEnabled = me.discord_enabled;
    if (S.maintenance && S.me.user.role !== 'owner') {
      setTimeout(() => { const sp = $('#splash'); if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 900); } }, 600);
      showMaintenance(S.boot.maintenance_text); return;
    }
    await loadAll();
    await checkPushStatus();
    renderApp();
  } catch (e) {
    if (S.maintenance) {
      setTimeout(() => { const sp = $('#splash'); if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 900); } }, 600);
      showMaintenance(S.boot.maintenance_text); return;
    }
    S.guest = true;
    if (S.boot.guest_mode) { await loadPreview(); renderApp(); }
    else { renderAuth(); }
  }
  setTimeout(() => {
    const sp = $('#splash');
    if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 900); }
  }, 1300);
}

  const list = $('#cList');
  if (!rows.length) {
    list.innerHTML = `<div class="empty"><div class="em-icon">${IC[kind]||IC.home}</div><h3>لا توجد قنوات بعد</h3><p>${isLogged()?'ابدأ بإضافة أول قناة':'سجّل دخولك'}</p>${isLogged() && !lim.isFull ? `<button class="btn pri" id="emptyAdd">${IC.plus} إضافة</button>` : ''}${!isLogged() ? `<button class="btn pri" id="emptyLogin">تسجيل الدخول</button>` : ''}</div>`;
    const eb = $('#emptyAdd'); if (eb) eb.onclick = () => openAddChannel(kind);
    const elb = $('#emptyLogin'); if (elb) elb.onclick = () => { S.guest = false; renderAuth(); };
  } else {
    const grid = el('div', 'grid');
    rows.forEach(r => grid.appendChild(chCard(kind, r)));
    list.appendChild(grid);
  }
  const ab = $('#addBtn'); if (ab && !lim.isFull) ab.onclick = () => openAddChannel(kind);
}

function chCard(kind, r) {
  const card = el('div', 'ch');
  if (!isLogged()) {
    card.innerHTML = `<div class="lock-blur" style="padding:14px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:12px"><div style="width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2))"></div><div style="flex:1"><div style="height:16px;background:rgba(255,255,255,.15);border-radius:6px;margin-bottom:6px;width:70%"></div><div style="height:12px;background:rgba(255,255,255,.08);border-radius:6px;width:50%"></div></div></div><div style="height:140px;background:rgba(255,255,255,.05);border-radius:12px"></div></div><div class="lock-cover"><div class="lc-icon" style="width:52px;height:52px">${IC.lock}</div><h3>سجّل دخولك</h3></div>`;
    return card;
  }
  let slug = '', title = '';
  if (kind === 'kick') { slug = '@' + (r.slug||''); title = r.name || r.slug || ''; }
  else if (kind === 'yt') { slug = r.channel_id||''; title = r.name || r.channel_id || ''; }
  else { slug = r.username || r.chat_id || ''; title = r.name || r.chat_id || ''; }
  const liveBadge = kind === 'kick' && r.live && r.enabled ? '<span class="ch-badge live">مباشر</span>' : '';
  const offBadge = !r.enabled ? '<span class="ch-badge off">موقوف</span>' : '';
  const noSend = (kind !== 'tg' && r.auto_send === 0) ? '<span class="ch-badge nosend">🔕 بدون إرسال</span>' : '';
  const cover = r.banner || r.avatar || '';
  const avatarHTML = r.avatar ? `<img src="${esc(r.avatar)}" alt="" onerror="this.style.display='none'">` : `<div class="ph">${IC[kind]}</div>`;
  card.innerHTML = `
    <div class="ch-cover">${cover ? `<img src="${esc(cover)}" alt="" onerror="this.remove()">` : ''}${liveBadge}${offBadge}${noSend}</div>
    <div class="ch-head">${avatarHTML}<div class="ch-info"><b>${esc(title)}</b><small>${esc(slug)}</small></div></div>
    ${kind === 'kick' && r.live && r.title ? `<div class="ch-live"><div>${esc(r.title)}</div><span>${r.viewers||0} 👁</span></div>` : ''}
    <div class="ch-acts">
      ${kind === 'kick' ? `<a class="btn sm" href="https://kick.com/${esc(r.slug)}" target="_blank">${IC.play} مشاهدة</a>` : ''}
      ${kind === 'yt' ? `<a class="btn sm" href="https://youtube.com/channel/${esc(r.channel_id)}" target="_blank">${IC.play} زيارة</a>` : ''}
      ${kind !== 'tg' ? `<button class="btn sm ghost" data-act="edit">${IC.edit} تخصيص</button>` : ''}
      ${kind === 'tg' || kind === 'yt' ? `<button class="btn sm ghost" data-act="refresh">${IC.refresh}</button>` : ''}
      ${kind !== 'tg' ? `<button class="btn sm ${r.auto_send===0?'dark':'ghost'}" data-act="autosend">${r.auto_send===0?'🔕':'🔔'}</button>` : ''}
      <button class="btn sm ghost" data-act="toggle">${r.enabled?'إيقاف':'تفعيل'}</button>
      <button class="btn sm danger" data-act="del">${IC.trash}</button>
    </div>`;
  card.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const act = b.dataset.act;
      if (act === 'del') {
        const ok = await dlgConfirm('حذف القناة نهائياً؟', 'تأكيد', true); if (!ok) return;
        try { await api('/api/channels/' + kind + '/' + r.id, { method:'DELETE' }); toast('تم الحذف', 'ok'); await loadChannels(kind); renderApp(); }
        catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'toggle') {
        try { await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { enabled: !r.enabled } }); toast(r.enabled ? 'تم الإيقاف' : 'تم التفعيل', 'ok'); await loadChannels(kind); renderApp(); }
        catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'autosend') {
        const nv = r.auto_send === 0 ? 1 : 0;
        try { await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { auto_send: nv } }); toast(nv ? 'الإرسال مفعّل' : 'الإرسال موقوف', 'ok'); await loadChannels(kind); renderApp(); }
        catch (e2) { toast(e2.message, 'bad'); }
      } else if (act === 'edit') { await editChannelMsg(kind, r); }
      else if (act === 'refresh') {
        try {
          const ep = kind === 'tg' ? '/api/channels/tg/' + r.id + '/refresh' : '/api/channels/yt/' + r.id + '/refresh';
          await api(ep, { method:'POST' }); toast('تم التحديث', 'ok');
          await loadChannels(kind); renderApp();
        } catch (e2) { toast(e2.message, 'bad'); }
      }
    };
  });
  return card;
}
async function editChannelMsg(kind, r) {
  const curImg = r.msg && r.msg.match(/\{img:([^}]+)\}/);
  const curMsg = r.msg ? r.msg.replace(/\{img:[^}]+\}/g, '').trim() : '';
  let uploadedImage = curImg ? curImg[1] : '';
  const defaultTpl = kind === 'kick' ? (S.me.tpl_kick || '') : (S.me.tpl_yt || '');
  const defaultBtn = kind === 'kick' ? (S.me.btn_kick || 'شاهد البث') : (S.me.btn_yt || 'شاهد الفيديو');

  const html = `
    <label class="fld"><span>نص الرسالة</span>
      <textarea id="__msg" rows="6" placeholder="اتركه فارغاً للقالب العام">${esc(curMsg)}</textarea></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px;margin-bottom:12px">
      <span class="mu" style="font-size:11.5px">المتغيرات:</span>
      <span class="pill">{name}</span><span class="pill">{title}</span><span class="pill">{url}</span>
    </div>
    <label class="fld"><span>نص زر المشاهدة</span>
      <input type="text" id="__btn" value="${esc(r.btn_text || '')}" placeholder="${esc(defaultBtn)}"></label>
    <label class="fld" style="margin-top:6px"><span>صورة مرفقة (اختياري)</span></label>
    <div class="img-preview-box ${uploadedImage ? '' : 'empty'}" id="__imgBox">
      ${uploadedImage ? `<img src="${esc(uploadedImage)}" alt="">` : '<div>لا توجد صورة</div>'}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button type="button" class="btn sm" id="__upBtn">${IC.camera} رفع</button>
      <button type="button" class="btn sm ghost" id="__clrBtn">${IC.x} مسح</button>
      <input type="file" id="__upFile" accept="image/*" style="display:none">
    </div>
    <div class="tpl-preview" id="__tplPrev"></div>`;

  const r2 = await modal({
    title:'تخصيص رسالة الإشعار',
    sub:'اتركه فارغاً للقالب العام',
    html, okText:'حفظ', wide: true,
    onReady: () => {
      const ta = $('#__msg'), prev = $('#__tplPrev');
      const update = () => {
        const tpl = ta.value.trim() || defaultTpl;
        const sample = tpl
          .replace(/\{name\}/g, r.name || 'اسم القناة')
          .replace(/\{title\}/g, kind === 'kick' ? 'عنوان البث' : 'عنوان الفيديو')
          .replace(/\{url\}/g, kind === 'kick' ? 'https://kick.com/' + (r.slug||'') : 'https://youtube.com/watch?v=...');
        prev.innerHTML = '<div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:var(--font-en)">PREVIEW</div>' + sample.replace(/\n/g, '<br>');
      };
      ta.oninput = update; update();
      $('#__upBtn').onclick = () => $('#__upFile').click();
      $('#__upFile').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
        const fd = new FormData(); fd.append('file', f);
        try {
          const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
          const j = await res.json();
          if (!res.ok) throw new Error(j.error || 'فشل');
          uploadedImage = j.url;
          const box = $('#__imgBox'); box.classList.remove('empty');
          box.innerHTML = `<img src="${esc(uploadedImage)}" alt="">`;
          toast('تم الرفع', 'ok');
        } catch (err) { toast(err.message, 'bad'); }
      };
      $('#__clrBtn').onclick = () => {
        uploadedImage = '';
        const box = $('#__imgBox'); box.classList.add('empty');
        box.innerHTML = '<div>لا توجد صورة</div>';
      };
    }
  });
  if (r2 === null || r2 === false) return;
  let finalMsg = ($('#__msg')?.value || '').trim();
  if (uploadedImage) finalMsg = (finalMsg ? finalMsg + '\n' : '') + `{img:${uploadedImage}}`;
  const btnText = ($('#__btn')?.value || '').trim();
  try {
    await api('/api/channels/' + kind + '/' + r.id, { method:'PATCH', body: { msg: finalMsg, btn_text: btnText } });
    toast('تم الحفظ', 'ok');
    await loadChannels(kind); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

async function openAddChannel(kind) {
  if (!isLogged()) return;
  let suggestions = [];
  try { const r = await api('/api/channels/' + kind + '/suggestions'); suggestions = r.rows || []; } catch (e) {}
  const lim = S.limits[kind] || { used:0, limit:10, remaining:10 };
  const labels = {
    kick: { title:'إضافة قناة كيك', label:'slug', ph:'xqc' },
    yt:   { title:'إضافة قناة يوتيوب', label:'@handle أو UC...', ph:'@MrBeast' },
    tg:   { title:'إضافة قناة تيليجرام', label:'@username أو chat_id', ph:'@mychannel' }
  }[kind];
  const botWarn = !S.botReady && kind !== 'tg' ? `<div style="padding:12px 14px;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.3);border-radius:12px;margin-bottom:12px;font-size:12.5px;line-height:1.7">⚠️ <b>البوت غير متصل</b> — ستنضاف القناة لكن لن يتم إرسال أي إشعارات.</div>` : '';
  const sugHTML = suggestions.length ? `
    <div style="margin-top:22px;padding-top:20px;border-top:1px solid var(--line)">
      <div class="sh-sub" style="margin-bottom:6px">${IC.plus} مُقترحات الإدارة</div>
      <div class="sug-grid" id="sugGrid">${suggestions.map(s => `
        <div class="sug-item" data-id="${s.id}">
          <div class="av">${s.avatar ? `<img src="${esc(s.avatar)}" onerror="this.remove()">` : esc((s.name||'?').charAt(0).toUpperCase())}</div>
          <div class="if"><b>${esc(s.name || s.identifier)}</b><small>${esc(s.identifier)}</small></div>
          <div class="ck">${IC.check}</div>
        </div>`).join('')}</div>
      <div class="sug-toolbar"><span id="sugCount">0</span><button type="button" id="sugToggleAll">تحديد الكل</button></div>
    </div>` : '';
  const html = `
    <div style="padding:12px 14px;background:rgba(var(--blue-rgb),.06);border:1px solid var(--blue-line);border-radius:12px;margin-bottom:12px;font-size:12.5px;font-weight:800">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>الحدود</span><span style="color:var(--blue);font-family:var(--font-en)">${lim.used} / ${lim.limit}</span></div>
      <div class="limit-bar"><b style="width:${lim.limit > 0 ? Math.min(100, (lim.used/lim.limit)*100) : 0}%"></b></div>
      <div style="text-align:center;margin-top:8px;color:var(--muted);font-size:11.5px">المتبقي: ${lim.remaining}</div>
    </div>
    ${botWarn}
    <label class="fld"><span>${esc(labels.label)}</span><input type="text" id="__ci" placeholder="${esc(labels.ph)}"></label>
    <label class="fld"><span>الاسم (اختياري)</span><input type="text" id="__cn"></label>
    ${kind !== 'tg' ? `<label class="fld"><span>نص الزر (اختياري)</span><input type="text" id="__bt" placeholder="${kind==='kick'?'شاهد البث':'شاهد الفيديو'}"></label>` : ''}
    ${sugHTML}`;
  const result = await modal({ title: labels.title, html, okText: 'إضافة', wide: suggestions.length > 0 });
  if (result === false || result === null) return;
  const val = ($('#__ci')?.value || '').trim();
  const customName = ($('#__cn')?.value || '').trim();
  const btnText = ($('#__bt')?.value || '').trim();
  if (suggestions.length) {
    const ids = $$('#sugGrid .sug-item.on').map(x => +x.dataset.id);
    if (ids.length > 0) {
      try {
        const r = await api('/api/channels/' + kind + '/bulk-add', { method:'POST', body: { ids } });
        toast('تمت إضافة ' + (r.added || 0) + (r.failed ? ' — فشل ' + r.failed : ''), 'ok');
        if (r.errors?.length) setTimeout(() => toast(r.errors[0], ''), 500);
        await loadChannels(kind); renderApp(); return;
      } catch (e) { toast(e.message, 'bad'); return; }
    }
  }
  if (!val) return toast('اكتب القيمة', 'bad');
  try {
    const body = kind === 'kick' ? { slug: val, msg: '', btn_text: btnText }
               : kind === 'yt'   ? { channel_id: val, name: customName, msg: '', btn_text: btnText }
                                 : { chat_id: val, name: customName };
    const res = await api('/api/channels/' + kind, { method:'POST', body });
    toast('تمت الإضافة', 'ok');
    if (res.warn) setTimeout(() => toast(res.warn, ''), 600);
    await loadChannels(kind); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

  let pre = { tgs: [], users: [], is_owner: isOwner() };

  const tgHTML = pre.tgs.length ? pre.tgs.map(t => `
    <label class="tg-pick-item">
      <div class="av">${t.avatar ? `<img src="${esc(t.avatar)}" onerror="this.remove()">` : esc((t.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(t.name || t.username || t.id)}</b><small>${esc(t.username || '')}</small></div>
      <input type="checkbox" data-tg="${t.id}" style="width:20px;height:20px">
    </label>`).join('') : '<div class="mu center" style="padding:14px;font-size:12.5px">لا توجد قنوات TG</div>';
  const usersHTML = pre.is_owner && pre.users.length ? pre.users.map(u => `
    <label class="tg-pick-item">
      <div class="av">${esc((u.display||u.username).charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(u.display || u.username)}</b><small>@${esc(u.username)}</small></div>
      <input type="checkbox" data-user="${u.id}" style="width:20px;height:20px">
    </label>`).join('') : '';
  const html = `
    <label class="fld"><span>نص الرسالة</span><textarea id="__txt" rows="5" placeholder="اكتب رسالتك..."></textarea></label>
    <label class="fld"><span>صورة (رابط)</span><input type="text" id="__img" placeholder="https://..."></label>
    <div style="display:flex;gap:8px;margin-top:-8px;margin-bottom:12px"><button type="button" class="btn sm" id="__imgUp">${IC.camera} رفع</button><input type="file" id="__imgFile" accept="image/*" style="display:none"></div>
    <div class="r2">
      <label class="fld"><span>نص الزر</span><input type="text" id="__btnT" placeholder="اختياري"></label>
      <label class="fld"><span>رابط الزر</span><input type="text" id="__btnU" placeholder="https://..."></label>
    </div>
    <label class="fld"><span>قنوات TG</span></label>
    <div class="rads">
      <label class="rad"><input type="radio" name="tgm" value="none" checked><span>بدون</span></label>
      <label class="rad"><input type="radio" name="tgm" value="all"><span>الكل</span></label>
      <label class="rad"><input type="radio" name="tgm" value="pick"><span>تحديد</span></label>
    </div>
    <div class="tg-pick-grid" id="__tgList">${tgHTML}</div>
    ${pre.is_owner && pre.users.length ? `<label class="fld" style="margin-top:14px"><span>المستخدمون</span></label>
      <div class="rads">
        <label class="rad"><input type="radio" name="usm" value="none" checked><span>بدون</span></label>
        <label class="rad"><input type="radio" name="usm" value="all"><span>الكل</span></label>
        <label class="rad"><input type="radio" name="usm" value="pick"><span>تحديد</span></label>
      </div>
      <div class="tg-pick-grid" id="__usList">${usersHTML}</div>` : ''}`;
  const result = await modal({
    title: 'إرسال رسالة', sub: 'أرسل لقنوات TG أو المستخدمين',
    html, okText: 'إرسال', wide: true,
    onReady: () => {
      $('#__imgUp').onclick = () => $('#__imgFile').click();
      $('#__imgFile').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
        const fd = new FormData(); fd.append('file', f);
        try {
          const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
          const j = await res.json();
          if (!res.ok) throw new Error(j.error || 'فشل');
          $('#__img').value = j.url; toast('تم الرفع', 'ok');
        } catch (err) { toast(err.message, 'bad'); }
      };
      $$('#__tgList .tg-pick-item,#__usList .tg-pick-item').forEach(item => {
        item.onclick = (e) => {
          if (e.target.tagName === 'INPUT') return;
          const cb = item.querySelector('input[type="checkbox"]');
          cb.checked = !cb.checked;
          item.classList.toggle('on', cb.checked);
        };
      });
    }
  });
  if (!result) return;
  const text = ($('#__txt')?.value || '').trim();
  const image = ($('#__img')?.value || '').trim();
  const btnT = ($('#__btnT')?.value || '').trim();
  const btnU = ($('#__btnU')?.value || '').trim();
  if (!text && !image) return toast('اكتب نص أو ارفع صورة', 'bad');
  const body = {
    text, image, btn_text: btnT, btn_url: btnU,
    tg: { mode: (document.querySelector('input[name=tgm]:checked') || {}).value || 'none', ids: $$('#__tgList input[data-tg]:checked').map(x => +x.dataset.tg) },
    users: { mode: (document.querySelector('input[name=usm]:checked') || {}).value || 'none', ids: $$('#__usList input[data-user]:checked').map(x => +x.dataset.user) },
  };
  try {
    const res = await api('/api/send', { method:'POST', body });
    const r = res.result || {};
    let msg = [];
    if (r.tg_sent || r.tg_failed) msg.push('TG: ' + r.tg_sent + ' ✓ / ' + r.tg_failed + ' ✗');
    if (r.users) msg.push('المستخدمون: ' + r.users);
    toast(msg.join(' · ') || 'تم', 'ok');
  } catch (e) { toast(e.message, 'bad'); }
}

      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
        ${botBadge} ${autoBadge} ${enableBadge}
        <span class="pill">${IC.dc} ${chsCount} روم</span>
        <span class="pill">${S.feeds.length} ربط</span>
      </div>
      ${!S.botReady ? `<div style="padding:14px 16px;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.3);border-radius:14px;margin-bottom:16px;font-size:13px;line-height:1.8"><b style="color:var(--red)">⚠️ البوت غير متصل</b><br>${!S.discordEnabled ? 'البوت معطّل — اضبط <code>DISCORD_ENABLE=1</code> في .env' : (S.discordMode === 'failed' ? 'فشل الاتصال — تأكد من التوكن والمكتبات' : 'تأكد من DISCORD_BOT_TOKEN')}</div>` : ''}
      ${chsCount > 0 ? `<details style="margin-bottom:16px;padding:12px 14px;background:rgba(var(--blue-rgb),.04);border:1px solid var(--blue-line);border-radius:14px"><summary style="cursor:pointer;font-weight:900;font-size:13px;color:var(--blue)">الرومات المتاحة (${chsCount})</summary><div style="margin-top:12px">${Object.entries(S.knownChannels).map(([id, info]) => `<div class="discord-ch-item"><div class="ic">${IC.dc}</div><div class="if"><b>#${esc(info.name)}</b><small>${esc(info.guild||'')} · ${esc(id)}</small></div></div>`).join('')}</div></details>` : ''}
      ${S.feeds.length ? `<div id="feedsList"></div>` : `<div class="empty"><div class="em-icon">${IC.dc}</div><h3>لا توجد رومات مربوطة</h3><p>اربط روم ديسكورد</p>${chsCount ? `<button class="btn pri" id="emptyAddFeed">${IC.plus} ربط</button>` : ''}</div>`}
    </div>`;
  const emptyBtn = $('#emptyAddFeed'); if (emptyBtn) emptyBtn.onclick = openAddFeed;
  const addBtn = $('#addFeedBtn'); if (addBtn) addBtn.onclick = openAddFeed;
  const rBtn = $('#refreshChBtn');
  if (rBtn) rBtn.onclick = async () => {
    rBtn.disabled = true;
    try { const r = await api('/api/discord/refresh', { method:'POST' }); toast('تم التحديث — ' + (r.channels || 0) + ' روم', 'ok'); await loadFeeds(); renderApp(); }
    catch (e) { toast(e.message, 'bad'); }
    rBtn.disabled = false;
  };
  const list = $('#feedsList');
  if (list) {
    S.feeds.forEach(f => {
      const card = el('div', 'ch');
      const name = (S.knownChannels[f.channel_id]?.name) || f.channel_name || f.channel_id;
      const src = f.source_type === 'twitter' ? 'تويتر' : f.source_type === 'youtube' ? 'يوتيوب' : 'عام';
      const useOrig = f.use_original !== 0;
      let tgtLabel = 'كل القنوات';
      try { const tids = JSON.parse(f.target_tg_ids || '[]'); if (tids.length) tgtLabel = tids.length + ' محددة'; } catch (e) {}
      let kwCount = 0;
      try { const kws = JSON.parse(f.keyword_rules || '[]'); kwCount = Array.isArray(kws) ? kws.length : 0; } catch (e) {}
      let ibCount = 0;
      try { const ibs = JSON.parse(f.ignore_bots || '[]'); ibCount = Array.isArray(ibs) ? ibs.length : 0; } catch (e) {}
      card.innerHTML = `
        <div style="padding:18px">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
            <div style="width:46px;height:46px;border-radius:13px;background:rgba(var(--blue-rgb),.15);border:1px solid var(--blue-line);display:grid;place-items:center;color:var(--blue);flex-shrink:0">${IC.dc}</div>
            <div style="flex:1;min-width:0"><div style="font-weight:900;font-size:15.5px">#${esc(name)}</div><div style="font-family:var(--font-en);font-size:10.5px;color:var(--muted);margin-top:3px">ID: ${esc(f.channel_id)}</div></div>
            <span class="pill">${esc(src)}</span>
          </div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">
            ${useOrig ? '<span class="pill ok">نسخ الأصل</span>' : '<span class="pill">قالب</span>'}
            <span class="pill">${esc(tgtLabel)}</span>
            ${kwCount ? `<span class="pill purple">${kwCount} قاعدة صورة</span>` : ''}
            ${ibCount ? `<span class="pill warn">${ibCount} بوت مستثنى</span>` : ''}
            ${f.use_ai ? '<span class="pill purple">AI</span>' : ''}
          </div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            <button class="btn sm ghost" data-fa="edit">${IC.edit} تخصيص</button>
            <button class="btn sm ghost" data-fa="toggle">${f.enabled ? 'إيقاف' : 'تفعيل'}</button>
            <button class="btn sm danger" data-fa="del">${IC.trash}</button>
          </div>
        </div>`;
      card.querySelectorAll('[data-fa]').forEach(b => {
        b.onclick = async () => {
          const act = b.dataset.fa;
          if (act === 'del') {
            const ok = await dlgConfirm('حذف الربط؟', 'تأكيد', true); if (!ok) return;
            try { await api('/api/discord/feeds/' + f.id, { method:'DELETE' }); toast('تم', 'ok'); await loadFeeds(); renderApp(); }
            catch (e) { toast(e.message, 'bad'); }
          } else if (act === 'toggle') {
            try { await api('/api/discord/feeds/' + f.id, { method:'PATCH', body: { enabled: !f.enabled } }); toast(f.enabled ? 'تم الإيقاف' : 'تم التفعيل', 'ok'); await loadFeeds(); renderApp(); }
            catch (e) { toast(e.message, 'bad'); }
          } else if (act === 'edit') { await editFeed(f); }
        };
      });
      list.appendChild(card);
    });
  }
}

async function editFeed(f) {
  await loadBots();
  let targetIds = [];
  try { targetIds = JSON.parse(f.target_tg_ids || '[]'); } catch (e) {}
  let ignoreBots = [];
  try { ignoreBots = JSON.parse(f.ignore_bots || '[]'); } catch (e) {}
  let keywordRules = [];
  try { keywordRules = JSON.parse(f.keyword_rules || '[]'); } catch (e) {}
  if (!Array.isArray(keywordRules)) keywordRules = [];

  const myTgs = S.myTgs || [];
  const botList = S.knownBots || [];

  const tgPickHTML = myTgs.length ? myTgs.map(t => `
    <label class="tg-pick-item ${targetIds.indexOf(t.id) >= 0 ? 'on' : ''}">
      <div class="av">${t.avatar ? `<img src="${esc(t.avatar)}" onerror="this.remove()">` : esc((t.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(t.name)}</b><small>${esc(t.username || '')}</small></div>
      <input type="checkbox" data-tgid="${t.id}" ${targetIds.indexOf(t.id) >= 0 ? 'checked' : ''} style="width:20px;height:20px">
    </label>`).join('') : '<div class="mu center" style="padding:14px;font-size:12.5px">أضف قنوات TG أولاً</div>';

  const botListHTML = botList.length ? botList.map(b => `
    <label class="bot-item ${ignoreBots.indexOf(b.id) >= 0 ? 'on' : ''}">
      <div class="av">${b.avatar ? `<img src="${esc(b.avatar)}" onerror="this.remove()">` : esc((b.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(b.name||b.id)}</b><small>ID: ${esc(b.id)} · ${b.seen_count || 0} رسالة</small></div>
      <span class="st">${ignoreBots.indexOf(b.id) >= 0 ? 'مستثنى' : 'مقبول'}</span>
      <input type="checkbox" data-botid="${b.id}" ${ignoreBots.indexOf(b.id) >= 0 ? 'checked' : ''} style="display:none">
    </label>`).join('') : '<div class="mu center" style="padding:14px;font-size:12.5px">لم يتم رصد بوتات بعد</div>';

  const kwHTML = `
    <div id="__kwList">${keywordRules.map((rule, idx) => renderKwRule(rule, idx)).join('')}</div>
    <button type="button" class="btn sm" id="__addKw" style="margin-top:10px">${IC.plus} إضافة قاعدة صورة</button>`;

  const html = `
    <div class="switch-row">
      <div class="sw-txt"><b>نسخ الأصل (بدون قالب)</b><small>يستخدم نص الرسالة الأصلي مباشرة</small></div>
      <label class="sw"><input type="checkbox" id="__useOrig" ${f.use_original !== 0 ? 'checked' : ''}><i></i></label>
    </div>
    <label class="fld"><span>القالب (يُستخدم إذا لم يفعل "نسخ الأصل")</span>
      <textarea id="__tp" rows="5" class="mono">${esc(f.template || '')}</textarea></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px;margin-bottom:10px">
      <span class="mu" style="font-size:11.5px">المتغيرات:</span>
      <span class="pill">{name}</span><span class="pill">{author}</span><span class="pill">{author_no_at}</span>
      <span class="pill">{content}</span><span class="pill">{title}</span><span class="pill">{description}</span>
      <span class="pill">{channel}</span><span class="pill">{url}</span>
    </div>
    <label class="fld"><span>نص الزر</span><input type="text" id="__bt" value="${esc(f.btn_text || 'عرض الروم')}"></label>
    <label class="fld"><span>رابط الزر المخصص (اختياري — سيستخدم رابط الرسالة إذا فارغ)</span>
      <input type="text" id="__ru" value="${esc(f.room_url || '')}" placeholder="https://discord.com/channels/..."></label>
    <label class="fld"><span>صورة ثابتة (اختياري — تُستخدم لكل الرسائل)</span>
      <input type="text" id="__fi" value="${esc(f.fixed_image || '')}" placeholder="https://..."></label>
    <label class="fld" style="margin-top:20px"><span>قواعد الصور بالكلمات المفتاحية</span></label>
    <div class="mu" style="font-size:11.5px;margin-bottom:8px">لو الرسالة تحتوي الكلمة → يستبدل الصورة المرفقة بالصورة المحددة</div>
    ${kwHTML}
    <label class="fld" style="margin-top:20px"><span>القنوات المستهدفة (فارغ = كل القنوات)</span></label>
    <div class="tg-pick-grid" id="__tgList">${tgPickHTML}</div>
    <label class="fld" style="margin-top:20px"><span>البوتات المستثناة (لن يقرأ رسائلها)</span></label>
    <div class="bot-list" id="__botList">${botListHTML}</div>
    <div class="switch-row" style="margin-top:20px">
      <div class="sw-txt"><b>AI Rewrite (Groq)</b><small>يعيد صياغة الرسالة قبل الإرسال</small></div>
      <label class="sw"><input type="checkbox" id="__useAi" ${f.use_ai ? 'checked' : ''} ${!S.aiStatus.available ? 'disabled' : ''}><i></i></label>
    </div>
    <label class="fld"><span>AI Prompt (اختياري)</span>
      <textarea id="__aiPrompt" rows="3" placeholder="أعد صياغة الرسالة بأسلوب إخباري موجز...">${esc(f.ai_prompt || '')}</textarea></label>
    ${!S.aiStatus.available ? '<div class="ai-status warn">⚠️ Groq غير مضبوط — أضف API key من لوحة التحكم</div>' : ''}
    <div class="tpl-preview" id="__tplPrev"></div>`;

  const r = await modal({
    title: 'تخصيص الربط', sub: 'كل الإعدادات المخصصة لهذا الروم',
    html, okText: 'حفظ', xwide: true,
    onReady: () => {
      const ta = $('#__tp'), prev = $('#__tplPrev');
      const update = () => {
        const tpl = ta.value.trim() || '<b>{author_no_at}</b>\n\n{content}';
        const sample = tpl
          .replace(/\{name\}/g, 'DRB7H').replace(/\{author\}/g, 'DRB7H').replace(/\{author_no_at\}/g, 'DRB7H')
          .replace(/\{content\}/g, '🔥🔥 محتوى')
          .replace(/\{title\}/g, 'اسم المقطع').replace(/\{description\}/g, 'الوصف')
          .replace(/\{channel\}/g, 'twitter').replace(/\{url\}/g, 'https://...');
        prev.innerHTML = '<div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:var(--font-en)">PREVIEW</div>' + sample.replace(/\n/g, '<br>');
      };
      ta.oninput = update; update();
      $$('#__tgList .tg-pick-item').forEach(item => {
        item.onclick = (e) => {
          if (e.target.tagName === 'INPUT') return;
          const cb = item.querySelector('input[type="checkbox"]');
          cb.checked = !cb.checked;
          item.classList.toggle('on', cb.checked);
        };
      });
      $$('#__botList .bot-item').forEach(item => {
        item.onclick = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.closest('.st')) {}
          const cb = item.querySelector('input[type="checkbox"]');
          if (e.target.closest('.st') || e.target === item) cb.checked = !cb.checked;
          item.classList.toggle('on', cb.checked);
          item.querySelector('.st').textContent = cb.checked ? 'مستثنى' : 'مقبول';
        };
      });
      bindKwRules();
      $('#__addKw').onclick = () => {
        keywordRules.push({ keywords: [], image: '' });
        $('#__kwList').innerHTML = keywordRules.map((r, i) => renderKwRule(r, i)).join('');
        bindKwRules();
      };
      function bindKwRules() {
        $$('#__kwList .kw-rule').forEach((el, idx) => {
          const rule = keywordRules[idx];
          el.querySelector('[data-kwdel]').onclick = () => {
            keywordRules.splice(idx, 1);
            $('#__kwList').innerHTML = keywordRules.map((r, i) => renderKwRule(r, i)).join('');
            bindKwRules();
          };
          const kwInput = el.querySelector('input[data-kwin]');
          const kwBtn = el.querySelector('[data-kwadd]');
          const addKw = () => {
            const v = (kwInput.value || '').trim();
            if (!v) return;
            if (!Array.isArray(rule.keywords)) rule.keywords = [];
            rule.keywords.push(v);
            kwInput.value = '';
            el.querySelector('.kw-tags').innerHTML = renderKwTags(rule.keywords, idx);
            bindKwTags();
          };
          kwBtn.onclick = addKw;
          kwInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addKw(); } };
          const imgInput = el.querySelector('input[data-kwimg]');
          imgInput.oninput = () => {
            rule.image = imgInput.value.trim();
            const prev = el.querySelector('.kw-img-prev');
            if (rule.image) prev.innerHTML = `<img src="${esc(rule.image)}" onerror="this.style.display='none'">`;
            else prev.textContent = 'لا صورة';
          };
          const upBtn = el.querySelector('[data-kwimgup]');
          if (upBtn) upBtn.onclick = () => {
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'image/*';
            inp.onchange = async () => {
              const file = inp.files[0]; if (!file) return;
              if (file.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
              const fd = new FormData(); fd.append('file', file);
              try {
                const res = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'include' });
                const j = await res.json();
                if (!res.ok) throw new Error(j.error || 'فشل');
                rule.image = j.url;
                imgInput.value = j.url;
                el.querySelector('.kw-img-prev').innerHTML = `<img src="${esc(j.url)}">`;
                toast('تم الرفع', 'ok');
              } catch (err) { toast(err.message, 'bad'); }
            };
            inp.click();
          };
          function bindKwTags() {
            el.querySelectorAll('.kw-tag button').forEach(b => {
              b.onclick = () => {
                const k = +b.dataset.kwi;
                rule.keywords.splice(k, 1);
                el.querySelector('.kw-tags').innerHTML = renderKwTags(rule.keywords, idx);
                bindKwTags();
              };
            });
          }
          bindKwTags();
        });
      }
    }
  });
  if (r === null || r === false) return;

  const tpl = ($('#__tp')?.value || '').trim();
  const btnText = ($('#__bt')?.value || 'عرض الروم').trim();
  const newTargets = $$('#__tgList input[data-tgid]:checked').map(x => +x.dataset.tgid);
  const newIgBots = $$('#__botList input[data-botid]:checked').map(x => x.dataset.botid);
  const fixedImage = ($('#__fi')?.value || '').trim();
  const roomUrl = ($('#__ru')?.value || '').trim();
  const useOrig = $('#__useOrig')?.checked ? 1 : 0;
  const useAi = $('#__useAi')?.checked ? 1 : 0;
  const aiPrompt = ($('#__aiPrompt')?.value || '').trim();
  const finalRules = keywordRules.filter(rule => rule.keywords && rule.keywords.length > 0 && rule.image);
  try {
    await api('/api/discord/feeds/' + f.id, { method:'PATCH', body: {
      template: tpl, btn_text: btnText, target_tg_ids: newTargets,
      ignore_bots: newIgBots, keyword_rules: finalRules,
      fixed_image: fixedImage, room_url: roomUrl,
      use_original: useOrig, use_ai: useAi, ai_prompt: aiPrompt,
    }});
    toast('تم الحفظ', 'ok');
    await loadFeeds(); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

function renderKwTags(keywords, ruleIdx) {
  if (!Array.isArray(keywords) || !keywords.length) return '<span class="mu" style="font-size:11.5px">لا كلمات بعد</span>';
  return keywords.map((k, i) => `<span class="kw-tag">${esc(k)} <button type="button" data-kwi="${i}">×</button></span>`).join('');
}

function renderKwRule(rule, idx) {
  return `
    <div class="kw-rule" data-kwidx="${idx}">
      <div class="kw-rule-head">
        <b>قاعدة #${idx + 1}</b>
        <button type="button" class="mini-btn danger" data-kwdel style="background:transparent;border:1px solid rgba(239,68,68,.4);color:var(--red);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:11px">${IC.trash}</button>
      </div>
      <div class="kw-rule-body">
        <div>
          <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px">الكلمات المفتاحية (Enter للإضافة)</div>
          <div class="kw-tags">${renderKwTags(rule.keywords || [], idx)}</div>
          <div class="kw-tag-input">
            <input type="text" data-kwin placeholder="مثال: مافيه">
            <button type="button" class="btn sm pri" data-kwadd style="min-width:auto;padding:8px 12px">${IC.plus}</button>
          </div>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px">الصورة المرسلة عند المطابقة</div>
          <div class="kw-img-row">
            <div class="kw-img-prev">${rule.image ? `<img src="${esc(rule.image)}" onerror="this.style.display='none'">` : 'لا صورة'}</div>
            <input type="text" data-kwimg value="${esc(rule.image || '')}" placeholder="https://...">
            <button type="button" class="btn sm" data-kwimgup style="min-width:auto;padding:8px 12px">${IC.upload}</button>
          </div>
        </div>
      </div>
    </div>`;
}

async function openAddFeed() {
  if (!canDiscord()) return;
  await loadBots();
  const known = S.knownChannels || {};
  const chs = Object.entries(known);
  if (!chs.length) return modal({ title:'لا رومات', sub:'البوت لم يكتشف رومات. تأكد من DISCORD_GUILD_ID ثم اضغط تحديث', okText:'حسناً', cancel:false });
  const linked = new Set(S.feeds.map(f => f.channel_id));
  const available = chs.filter(([id]) => !linked.has(id));
  if (!available.length) return modal({ title:'كل الرومات مربوطة', okText:'حسناً', cancel:false });
  const myTgs = S.myTgs || [];
  const botList = S.knownBots || [];
  const tgPickHTML = myTgs.length ? myTgs.map(t => `
    <label class="tg-pick-item">
      <div class="av">${t.avatar ? `<img src="${esc(t.avatar)}" onerror="this.remove()">` : esc((t.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(t.name)}</b><small>${esc(t.username || '')}</small></div>
      <input type="checkbox" data-tgid="${t.id}" style="width:20px;height:20px">

  const botListHTML = botList.length ? botList.map(b => `
    <label class="bot-item">
      <div class="av">${b.avatar ? `<img src="${esc(b.avatar)}" onerror="this.remove()">` : esc((b.name||'?').charAt(0).toUpperCase())}</div>
      <div class="if"><b>${esc(b.name||b.id)}</b><small>ID: ${esc(b.id)} · ${b.seen_count || 0}</small></div>
      <span class="st">مقبول</span>
      <input type="checkbox" data-botid="${b.id}" style="display:none">
    </label>`).join('') : '<div class="mu center" style="padding:14px;font-size:12.5px">لم يتم رصد بوتات بعد</div>';
  const html = `
    <label class="fld"><span>اختر الروم</span><select id="__chList">${available.map(([id, info]) => `<option value="${esc(id)}">#${esc(info.name)} — ${esc(info.guild||'')}</option>`).join('')}</select></label>
    <label class="fld"><span>نوع المصدر</span><select id="__src"><option value="generic">عام</option><option value="twitter">تويتر</option><option value="youtube">يوتيوب</option></select></label>
    <div class="switch-row"><div class="sw-txt"><b>نسخ الأصل</b><small>بدون قالب</small></div><label class="sw"><input type="checkbox" id="__useOrig" checked><i></i></label></div>
    <label class="fld"><span>القالب (اختياري)</span><textarea id="__tpl" rows="4" class="mono" placeholder="<b>{author_no_at}</b>&#10;&#10;{content}"></textarea></label>
    <label class="fld"><span>نص الزر</span><input type="text" id="__bt" value="عرض الروم"></label>
    <label class="fld"><span>القنوات المستهدفة (فارغ = الكل)</span></label>
    <div class="tg-pick-grid" id="__tgList">${tgPickHTML}</div>
    <label class="fld" style="margin-top:20px"><span>البوتات المستثناة</span></label>
    <div class="bot-list" id="__botList">${botListHTML}</div>`;
  const r = await modal({ title:'ربط روم', html, okText:'ربط', xwide: true,
    onReady: () => {
      $$('#__tgList .tg-pick-item,#__botList .bot-item').forEach(item => {
        item.onclick = (e) => {
          const cb = item.querySelector('input[type="checkbox"]');
          if (e.target.tagName !== 'INPUT') cb.checked = !cb.checked;
          item.classList.toggle('on', cb.checked);
          const st = item.querySelector('.st'); if (st) st.textContent = cb.checked ? 'مستثنى' : 'مقبول';
        };
      });

  const avHTML = u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : esc(u.username.charAt(0).toUpperCase());
  m.innerHTML = `
    <div class="acc-head">
      <div class="av-btn" id="accAvatar" title="تغيير الصورة">${avHTML}</div>

    <button class="acc-item" data-a="send">${IC.send} إرسال رسالة</button>
    <button class="acc-item" data-a="suggest">${IC.msg} إرسال اقتراح</button>

    <div class="acc-sep"></div>
    <button class="acc-item danger" data-a="logout">${IC.logout} تسجيل الخروج</button>`;
  document.body.appendChild(m);
  requestAnimationFrame(() => m.classList.add('on'));
  $('#accAvatar').onclick = () => changeProfileAvatar();
  $('#accDisplay').onclick = () => changeProfileDisplay();
  m.querySelectorAll('[data-a]').forEach(b => {
    b.onclick = () => {
      const a = b.dataset.a;
      if (a === 'logout') { m.classList.remove('on'); setTimeout(() => m.remove(), 260); doLogout(); }
      else if (a === 'suggest') { m.classList.remove('on'); setTimeout(() => m.remove(), 260); openSuggestion(); }
      else if (a === 'send') { m.classList.remove('on'); setTimeout(() => m.remove(), 260); openSendModal(); }
      else if (a === 'admin') { m.classList.remove('on'); setTimeout(() => m.remove(), 260); S.view = 'admin'; renderApp(); }
      else if (a === 'push') { m.classList.remove('on'); setTimeout(() => m.remove(), 260); S.pushEnabled ? disablePush() : enablePush(); }
      else if (a === 'pushtest') { m.classList.remove('on'); setTimeout(() => m.remove(), 260); testPush(); }
    };
  });
  setTimeout(() => {
    const close = e => { if (!m.contains(e.target) && e.target.id !== 'accBtn' && !e.target.closest('#accBtn')) { m.classList.remove('on'); setTimeout(() => m.remove(), 260); document.removeEventListener('click', close); } };
    document.addEventListener('click', close);
  }, 60);
}

async function changeProfileAvatar() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) return toast('أكبر من 2MB', 'bad');
    const fd = new FormData(); fd.append('file', f);
    try {
      const res = await fetch('/api/upload', { method:'POST', body: fd, credentials:'include' });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || 'فشل');
      await api('/api/me/profile', { method:'PATCH', body: { avatar: j.url } });
      S.me.user.avatar = j.url; toast('تم تحديث الصورة', 'ok');
      const old = $('#accMenu'); if (old) old.remove(); renderApp();
    } catch (e) { toast(e.message, 'bad'); }
  };
  inp.click();
}

async function changeProfileDisplay() {
  const cur = S.me.user.display || S.me.user.username;
  const nv = await modal({ title: 'تعديل الاسم', input: true, inputLabel: 'الاسم', inputValue: cur, okText: 'حفظ' });
  if (nv === null || !nv.trim()) return;
  try {
    await api('/api/me/profile', { method:'PATCH', body: { display: nv.trim() } });
    S.me.user.display = nv.trim(); toast('تم', 'ok');
    const old = $('#accMenu'); if (old) old.remove(); renderApp();
  } catch (e) { toast(e.message, 'bad'); }
}

async function doLogout() {
